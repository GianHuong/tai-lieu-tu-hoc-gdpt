<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tâm Lý Quần Chúng Trong Giáo Dục Phật Giáo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF;
  --bg-card:#FFFDF8;
  --ink:#3E3A34;
  --ink-soft:#6E6759;
  --ink-faint:#9A927F;
  --border:#EFE3D0;
  --sage:#8FB988;
  --sage-ink:#3E5C3B;
  --sage-bg:#E8F1E4;
  --lotus:#E8A3B0;
  --lotus-ink:#7A3A44;
  --lotus-bg:#FBE7EA;
  --saffron:#E7BA53;
  --saffron-ink:#6B5220;
  --saffron-bg:#FBF0D9;
  --sky:#93BEDB;
  --sky-ink:#2E5470;
  --sky-bg:#E5F0F7;
  --shadow: 0 2px 10px rgba(62,58,52,0.06), 0 1px 2px rgba(62,58,52,0.05);
  --radius: 18px;
  color-scheme: light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211E1A;
    --bg-card:#2A2620;
    --ink:#F1EAD9;
    --ink-soft:#C9BFA9;
    --ink-faint:#938972;
    --border:#3C362C;
    --sage:#9DC896;
    --sage-ink:#DDF0D7;
    --sage-bg:#31402E;
    --lotus:#EDB2BE;
    --lotus-ink:#F7DEE2;
    --lotus-bg:#402B30;
    --saffron:#EFC46B;
    --saffron-ink:#F8E6BC;
    --saffron-bg:#453A22;
    --sky:#A4CBE3;
    --sky-ink:#DDEEF7;
    --sky-bg:#28384A;
    --shadow: 0 2px 14px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211E1A;
  --bg-card:#2A2620;
  --ink:#F1EAD9;
  --ink-soft:#C9BFA9;
  --ink-faint:#938972;
  --border:#3C362C;
  --sage:#9DC896;
  --sage-ink:#DDF0D7;
  --sage-bg:#31402E;
  --lotus:#EDB2BE;
  --lotus-ink:#F7DEE2;
  --lotus-bg:#402B30;
  --saffron:#EFC46B;
  --saffron-ink:#F8E6BC;
  --saffron-bg:#453A22;
  --sky:#A4CBE3;
  --sky-ink:#DDEEF7;
  --sky-bg:#28384A;
  --shadow: 0 2px 14px rgba(0,0,0,0.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html{scroll-padding-top: calc(84px + env(safe-area-inset-top,0px));}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Be Vietnam Pro', -apple-system, 'Segoe UI', sans-serif;
  line-height:1.65;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{
  font-family:'Literata', Georgia, 'Times New Roman', serif;
  font-weight:600;
  line-height:1.28;
  margin:0 0 .5em 0;
  color:var(--ink);
}
a{color:var(--sage-ink);}
p{margin:0 0 1em 0;}
ul{margin:0 0 1em 0;padding-left:1.3em;}
li{margin-bottom:.5em;}
blockquote{
  margin:0 0 1em 0;
  padding:.7em 1.1em;
  border-left:3px solid var(--sage);
  background:var(--sage-bg);
  border-radius:0 10px 10px 0;
  font-style:italic;
  color:var(--ink-soft);
}
.container{max-width:720px;margin:0 auto;padding:0 18px;}

/* ---------- HEADER ---------- */
header.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{
  max-width:720px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}
.brand .emoji{font-size:22px;}
.brand-text{font-family:'Literata',serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-back-btn{
  display:none;align-items:center;gap:7px;flex-shrink:0;
  padding:8px 14px 8px 12px;border-radius:999px;border:1.5px solid var(--sage);
  background:var(--sage-bg);color:var(--sage-ink);
  cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;
}
.top-back-btn.show{display:flex;}
.top-back-btn:active{filter:brightness(0.97);}
.lang-toggle{
  display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0;
}
.lang-toggle button{
  border:none;background:transparent;padding:6px 12px;border-radius:999px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-faint);cursor:pointer;
  transition:background .2s, color .2s;
}
.lang-toggle button.active{background:var(--sage);color:#20331E;}
.progress-row{max-width:720px;margin:0 auto;padding:0 18px 12px 18px;display:flex;gap:8px;}
.progress-step{
  flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;
}
.progress-bar{height:6px;width:100%;border-radius:999px;background:var(--border);overflow:hidden;}
.progress-bar > span{display:block;height:100%;width:0%;background:var(--sage);border-radius:999px;transition:width .35s ease;}
.progress-label{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.01em;}
.progress-step.current .progress-label{color:var(--ink);}
.progress-step.done .progress-bar > span{background:var(--sage);}

main{padding-bottom: calc(104px + env(safe-area-inset-bottom,0px));}
main.container{padding:22px 18px calc(104px + env(safe-area-inset-bottom,0px)) 18px;}

/* ---------- HERO (stage read only) ---------- */
.hero{padding:6px 0 22px 0;}
.hero h1{font-size:26px;letter-spacing:-0.01em;}
.hero .subtitle{color:var(--ink-soft);font-size:15.5px;margin-top:2px;}
.hero .lotus-mark{font-size:30px;display:block;margin-bottom:10px;}

/* ---------- 3-STEP GUIDE ---------- */
.steps-guide{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  margin:18px 0 22px 0;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
}
.steps-guide-title{width:100%;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;}
.step-chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12.5px;font-weight:700;flex:0 0 auto;white-space:nowrap;}
.step-chip .step-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0;}
.step-chip.s1{background:var(--sage-bg);color:var(--sage-ink);}
.step-chip.s1 .step-num{background:var(--sage);color:#20331E;}
.step-chip.s2{background:var(--lotus-bg);color:var(--lotus-ink);}
.step-chip.s2 .step-num{background:var(--lotus);color:#4A1F27;}
.step-chip.s3{background:var(--saffron-bg);color:var(--saffron-ink);}
.step-chip.s3 .step-num{background:var(--saffron);color:#4A3A10;}
.step-arrow{color:var(--ink-faint);flex-shrink:0;font-size:14px;}
@media (max-width:480px){
  .steps-guide{flex-direction:column;align-items:stretch;}
  .step-chip{width:100%;}
  .step-arrow{align-self:center;transform:rotate(90deg);}
}

/* ---------- ACCORDION SECTIONS ---------- */
.section-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  border-left:5px solid var(--accent, var(--sage));
}
.section-head{
  width:100%;
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;
  background:transparent;
  border:none;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  color:var(--ink);
}
.section-head .num{
  flex-shrink:0;
  width:30px;height:30px;border-radius:50%;
  background:var(--accent-bg, var(--sage-bg));
  color:var(--accent-ink, var(--sage-ink));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;font-family:'Literata',serif;
}
.section-head .num.check{background:var(--sage);color:#20331E;}
.section-head .htitle{flex:1;font-family:'Literata',serif;font-weight:600;font-size:17px;min-width:0;}
.section-head .chev{flex-shrink:0;transition:transform .25s ease;color:var(--ink-faint);}
.section-card.open .chev{transform:rotate(180deg);}
.section-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}
.section-card.open .section-body{max-height:none;}
.section-body-inner{padding:0 18px 20px 18px;font-size:15.5px;color:var(--ink-soft);}
.section-body-inner h4{font-size:16.5px;color:var(--ink);margin-top:1.1em;}
.section-body-inner h5{font-size:15px;color:var(--ink);margin-top:1em;}
.section-body-inner strong{color:var(--ink);}
.section-body-inner .callout{
  background:var(--saffron-bg);border:1px solid var(--saffron);border-radius:12px;padding:12px 14px;margin:0 0 1em 0;
  font-size:14.5px;
}
.section-body-inner .callout strong{color:var(--saffron-ink);}
.collapse-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:18px;
  padding:10px 14px;border-radius:12px;border:1px dashed var(--border);background:transparent;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-faint);cursor:pointer;
}
.collapse-btn:hover{color:var(--ink-soft);border-color:var(--ink-faint);}
.thinker{border-top:1px dashed var(--border);padding-top:14px;margin-top:14px;}
.thinker:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.thinker h4{margin-bottom:.4em;}
.thinker .meta{font-weight:400;color:var(--ink-faint);font-size:.85em;}
.thinker .critique{background:var(--lotus-bg);border-radius:10px;padding:10px 12px;font-size:14px;}
.thinker .critique strong{color:var(--lotus-ink);}

/* ---------- MINI ACCORDION (nested, inside Part 3) ---------- */
.mini-acc{
  border:1px solid var(--border);
  border-radius:14px;
  margin:14px 0;
  background:color-mix(in srgb, var(--bg-card) 60%, var(--bg) 40%);
  overflow:hidden;
}
.mini-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:transparent;border:none;cursor:pointer;text-align:left;
  font-family:'Literata',serif;font-weight:600;font-size:15px;color:var(--ink);
}
.mini-chev{flex-shrink:0;color:var(--ink-faint);transition:transform .25s ease;}
.mini-acc.open > .mini-head .mini-chev{transform:rotate(180deg);}
.mini-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
.mini-acc.open > .mini-body{max-height:none;}
.mini-body-inner{padding:0 14px 14px 14px;font-size:15px;}
.mini-acc .mini-acc{background:transparent;border-color:var(--border);}
.mini-acc .mini-acc .mini-head{font-size:14.5px;font-weight:600;}

/* ---------- TIMELINE ---------- */
.timeline-wrap{margin:18px 0 22px 0;padding:16px 14px 14px 14px;background:var(--sky-bg);border-radius:16px;border:1px solid var(--sky);}
.timeline-title{font-size:12.5px;font-weight:700;color:var(--sky-ink);text-transform:uppercase;letter-spacing:.02em;margin-bottom:12px;}
.timeline-track{display:flex;overflow-x:auto;gap:0;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.timeline-node{flex:0 0 auto;width:132px;display:flex;flex-direction:column;align-items:flex-start;position:relative;padding-right:14px;cursor:pointer;background:none;border:none;text-align:left;font-family:inherit;}
.timeline-node .tl-line{position:absolute;top:7px;left:0;width:100%;height:2px;background:var(--sky);}
.timeline-node:last-child .tl-line{width:0;}
.timeline-node .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--sky-ink);border:3px solid var(--sky-bg);position:relative;z-index:2;margin-bottom:8px;}
.timeline-node .tl-year{font-size:11.5px;font-weight:700;color:var(--sky-ink);}
.timeline-node .tl-name{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:1px;line-height:1.25;}
.timeline-node .tl-idea{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}

/* ---------- BACK TO TOP (flash/quiz) ---------- */
.back-top-row{display:flex;justify-content:flex-start;margin-bottom:10px;}
.back-top-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;
}

.table-wrap{overflow-x:auto;margin-bottom:1em;-webkit-overflow-scrolling:touch;}
table.glossary{border-collapse:collapse;width:100%;min-width:480px;font-size:14px;}
table.glossary th{
  text-align:left;background:var(--sage-bg);color:var(--sage-ink);
  padding:9px 10px;font-family:'Literata',serif;font-weight:600;font-size:13px;
  position:sticky;top:0;
}
table.glossary td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:top;}
table.glossary tr:nth-child(odd){background:color-mix(in srgb, var(--bg-card) 60%, var(--bg) 40%);}

ul.refs{padding-left:1.1em;font-size:14.5px;color:var(--ink-soft);}
ul.refs li{margin-bottom:.65em;}

.fn-ref{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;
  background:var(--sky-bg);color:var(--sky-ink);
  font-size:10.5px;font-weight:700;border:1px solid var(--sky);
  cursor:pointer;vertical-align:super;margin:0 1px;
  font-family:'Be Vietnam Pro',sans-serif;padding:0;
}

/* ---------- CONTINUE BAR ---------- */
.continue-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)) 18px;
}
.continue-bar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.continue-status{font-size:13px;color:var(--ink-faint);font-weight:600;}
.btn{
  border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;
  font-family:'Be Vietnam Pro',sans-serif;cursor:pointer;
  background:var(--sage);color:#20331E;
  transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  box-shadow:0 4px 14px rgba(143,185,136,.35);
}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:not(:disabled):active{transform:scale(.97);}
.btn.secondary{background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--border);}

/* ---------- MODAL (footnotes) ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(30,26,20,.45);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-backdrop.show{opacity:1;pointer-events:auto;}
.modal-sheet{
  background:var(--bg-card);border-radius:20px 20px 0 0;max-width:560px;width:100%;
  padding:20px 22px calc(22px + env(safe-area-inset-bottom,0px)) 22px;
  transform:translateY(20px);transition:transform .25s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.15);
  max-height:70vh;overflow-y:auto;
}
.modal-backdrop.show .modal-sheet{transform:translateY(0);}
@media (min-width:640px){
  .modal-backdrop{align-items:center;}
  .modal-sheet{border-radius:20px;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.modal-head .tag{font-size:12px;font-weight:700;color:var(--sky-ink);background:var(--sky-bg);padding:3px 9px;border-radius:999px;}
.modal-close{background:var(--border);border:none;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink);}
.modal-body{font-size:15px;color:var(--ink-soft);}

/* ---------- FLASHCARDS ---------- */
.stage-panel{min-height:50vh;}
.flash-wrap{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.flash-scene{width:100%;max-width:480px;height:clamp(200px, 40vh, 340px);perspective:1700px;margin-bottom:16px;}
.flash-counter{font-size:13px;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}

.flash-card{
  position:relative;width:100%;height:100%;cursor:pointer;
  transform-style:preserve-3d;
}
.flash-card.flipped{transform:rotateY(180deg);}
@keyframes flipToBack{
  0%{transform:rotateY(0deg) scale(1);}
  45%{transform:rotateY(100deg) scale(1.07);}
  100%{transform:rotateY(180deg) scale(1);}
}
@keyframes flipToFront{
  0%{transform:rotateY(180deg) scale(1);}
  45%{transform:rotateY(80deg) scale(1.07);}
  100%{transform:rotateY(0deg) scale(1);}
}
.flash-card.flip-to-back{animation:flipToBack .58s cubic-bezier(.3,.1,.3,1) both;}
.flash-card.flip-to-front{animation:flipToFront .58s cubic-bezier(.3,.1,.3,1) both;}
.flash-card:active{filter:brightness(0.98);}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;padding:26px;box-shadow:0 10px 26px rgba(62,58,52,.12), 0 2px 8px rgba(62,58,52,.06);border:1px solid var(--border);
  overflow-y:auto;
}
.flash-face-content{margin:auto 0;width:100%;}
.flash-face.front{background:var(--bg-card);}
.flash-face.back{background:var(--accent-bg, var(--sage-bg));border-color:var(--accent, var(--sage));transform:rotateY(180deg);}
.flash-face::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:28px;border-radius:0 0 20px 20px;pointer-events:none;
  background:linear-gradient(to bottom, transparent, var(--bg-card));
}
.flash-face.back::after{background:linear-gradient(to bottom, transparent, var(--accent-bg, var(--sage-bg)));}
.flash-face .kicker{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-faint);margin-bottom:14px;}
.flash-face.back .kicker{color:var(--accent-ink, var(--sage-ink));opacity:.75;}
.flash-face .term{font-family:'Literata',serif;font-size:22px;font-weight:600;color:var(--ink);}
.flash-face .term-repeat{font-family:'Literata',serif;font-size:18px;font-weight:700;color:var(--accent-ink, var(--sage-ink));margin-bottom:10px;}
.flash-face .def{font-size:18px;font-weight:600;color:var(--accent-ink, var(--sage-ink));line-height:1.6;}
.flash-face .tap-hint{display:block;margin-top:18px;font-size:12px;color:var(--ink-faint);}
.flash-nav{display:flex;align-items:center;gap:16px;}
.flash-dot-row{display:flex;gap:5px;flex-wrap:wrap;max-width:280px;justify-content:center;margin-top:12px;}
.flash-dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
.flash-dot.seen{background:var(--sage);}
.flash-dot.current{background:var(--lotus);}
.iconbtn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
}
.iconbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- QUIZ ---------- */
.quiz-progress{font-size:13px;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}
.quiz-q{font-family:'Literata',serif;font-size:19px;font-weight:600;margin-bottom:16px;}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.quiz-option{
  text-align:left;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--bg-card);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
  transition:border-color .15s, background .15s;
}
.quiz-option.selected{border-color:var(--sage);background:var(--sage-bg);}
.quiz-option.correct{border-color:var(--sage);background:var(--sage-bg);}
.quiz-option.wrong{border-color:var(--lotus);background:var(--lotus-bg);}
.quiz-explain{
  background:var(--sky-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--sky-ink);margin-bottom:14px;
}
.quiz-dot-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.quiz-dot{width:26px;height:26px;border-radius:8px;background:var(--border);border:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-faint);font-family:inherit;cursor:pointer;}
.quiz-dot.answered{background:var(--sage-bg);color:var(--sage-ink);}
.quiz-dot.current{outline:2px solid var(--sage);outline-offset:1px;}
.quiz-retry-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px dashed var(--border);border-radius:999px;
  padding:8px 14px;font-family:inherit;font-weight:700;font-size:12.5px;color:var(--ink-faint);
  cursor:pointer;margin-bottom:16px;
}
.retake-btn{margin-top:18px;background:var(--saffron);color:#4A3A10;box-shadow:0 4px 14px rgba(231,186,83,.35);display:inline-flex;align-items:center;gap:7px;}

/* ---------- RESULTS ---------- */
.results{text-align:center;padding:20px 0 10px 0;}
.results .big-emoji{font-size:56px;display:block;margin-bottom:6px;}
.results h2{font-size:22px;}
.results .score{font-family:'Literata',serif;font-size:40px;font-weight:700;color:var(--sage-ink);margin:6px 0 2px 0;}
.results .congrats{
  margin-top:16px;background:var(--saffron-bg);border:1px solid var(--saffron);border-radius:16px;
  padding:18px 20px;font-size:16px;font-weight:600;color:var(--saffron-ink);line-height:1.5;
}
.results .review-title{margin-top:26px;font-family:'Literata',serif;font-size:16px;text-align:left;}
.review-item{text-align:left;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px;}
.review-item .q{font-weight:700;margin-bottom:4px;}
.review-item .a-correct{color:var(--sage-ink);}
.review-item .a-wrong{color:var(--lotus-ink);}

/* ---------- CONFETTI & FIREWORKS ---------- */
.confetti-piece{
  position:fixed;top:-20px;z-index:200;border-radius:2px;pointer-events:none;
  animation:confetti-fall linear forwards;
}
@keyframes confetti-fall{
  to{transform:translateY(110vh) rotate(var(--rot));opacity:.9;}
}
.spark{
  position:fixed;z-index:201;border-radius:50%;pointer-events:none;
  animation:spark-burst ease-out forwards;
}
@keyframes spark-burst{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}
}
.results .big-emoji{animation:emoji-pop .6s cubic-bezier(.2,1.4,.4,1);}
@keyframes emoji-pop{
  0%{transform:scale(0.3);opacity:0;}
  60%{transform:scale(1.15);opacity:1;}
  100%{transform:scale(1);}
}

@media (max-width:420px){
  .hero h1{font-size:22px;}
}
</style>
