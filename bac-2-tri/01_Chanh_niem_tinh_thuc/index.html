eption (Tưởng - <em>saññā</em>)</td><td>Recognizing and labeling: “this is a flower,” “that’s my friend.”</td></tr><tr><td>Volitional formations (Hành - <em>saṅkhārā</em>)</td><td>Intentions, habits, mental reactions: wanting, anger, decisions.</td></tr><tr><td>Consciousness (Thức - <em>viññāṇa</em>)</td><td>Knowing the experience: knowing that we are seeing, hearing, or thinking.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Back to the Note box (section 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3. Six Internal and External Sense Bases (Sáu Nội Ngoại Xứ - cha ajjhattika-bāhira āyatana)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>twelve “doors” of experience, formed by six sense faculties (sáu căn; internal) meeting six sense objects (sáu trần; external).</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Sense faculty – Sáu căn (internal)</strong></th><th><strong>Sense object – Sáu trần (external)</strong></th><th><strong>Example</strong></th></tr></thead><tbody><tr><td>Eye (Mắt - <em>cakkhu</em>)</td><td>Form (Sắc - <em>rūpa</em>)</td><td>Images, colors.</td></tr><tr><td>Ear (Tai - <em>sota</em>)</td><td>Sound (Thanh - <em>sadda</em>)</td><td>Sounds, voices, music.</td></tr><tr><td>Nose (Mũi - <em>ghāna</em>)</td><td>Smell (Hương - <em>gandha</em>)</td><td>Pleasant and unpleasant smells.</td></tr><tr><td>Tongue (Lưỡi - <em>jivhā</em>)</td><td>Taste (Vị - <em>rasa</em>)</td><td>Tastes: sour, sweet, bitter, salty…</td></tr><tr><td>Body (Thân - <em>kāya</em>)</td><td>Touch (Xúc - <em>phoṭṭhabba</em>)</td><td>Touch sensations: hot, cold, soft, rough.</td></tr><tr><td>Mind (Ý - <em>mano</em>)</td><td>Mental phenomena (Pháp - <em>dhammā</em>)</td><td>Thoughts, memories, and images appearing in the mind. (Here “pháp” does not mean the Buddha-Dharma [giáo pháp].)</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Back to the Note box (section 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-4\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">4. Seven Factors of Awakening (Bảy giác chi - satta bojjhaṅga)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>seven factors that help the mind become alert and aware, and lead to awakening (giác ngộ).</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Awakening factor (Giác chi)</strong></th><th><strong>Simple meaning</strong></th></tr></thead><tbody><tr><td>Mindfulness (Niệm<em> - sati</em>)</td><td>Keeping in mind, focusing on what is happening now.</td></tr><tr><td>Investigation of phenomena (Trạch pháp - <em>dhammavicaya</em>)</td><td>Observing and telling wholesome from unwholesome.</td></tr><tr><td>Effort (Tinh tấn - <em>vīriya</em>)</td><td>Steady effort, not giving up.</td></tr><tr><td>Joy (Hỷ<em> - pīti</em>)</td><td>Gentle joy in practice.</td></tr><tr><td>Tranquility (Khinh an - <em>passaddhi</em>)</td><td>Light, settled body and mind.</td></tr><tr><td>Concentration (Định<em> - samādhi</em>)</td><td>A focused, steady mind.</td></tr><tr><td>Equanimity (Xả - <em>upekkhā</em>)</td><td>Calm, not swept along by liking or disliking.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Back to the Note box (section 3)</button></div></div></div>"}, "optional": true}], "footnotes": {"vi": {}, "en": {}}, "flashcards": [{"front": {"vi": "Chánh niệm (sammā-sati)", "en": "Right Mindfulness (chánh niệm; sammā-sati)"}, "back": {"vi": "Chi phần thứ bảy của Bát Chánh Đạo. Chánh niệm là biết rõ điều đang diễn ra ở bốn phần: Thân, Thọ, Tâm và Pháp.", "en": "The seventh factor of the Noble Eightfold Path. Mindfulness is knowing clearly what is happening in four areas: Body (thân), Feelings (thọ), Mind (tâm) and Mental phenomena (pháp)."}}, {"front": {"vi": "Chánh (sammā)", "en": "Right (chánh; sammā)"}, "back": {"vi": "Đúng đắn, chân chính, không lệch lạc, hướng đến điều lành và sự giải thoát khỏi khổ.", "en": "Correct, genuine, not distorted, aimed at the wholesome and at liberation (giải thoát) from suffering."}}, {"front": {"vi": "Niệm (sati)", "en": "Mindfulness (niệm; sati)"}, "back": {"vi": "Ghi nhớ, nhận biết, chú ý đến điều đang diễn ra ngay lúc này.", "en": "Keeping in mind, recognizing, attending to what is happening right now."}}, {"front": {"vi": "Tỉnh giác (sampajañña)", "en": "Clear comprehension (tỉnh giác; sampajañña)"}, "back": {"vi": "Biết rõ việc mình đang làm. Theo chú giải, tỉnh giác còn gồm biết việc ấy có mục đích và có phù hợp hay không.", "en": "Knowing clearly what one is doing. The commentaries add knowing whether the activity has a purpose and is suitable."}}, {"front": {"vi": "Chánh niệm tỉnh thức", "en": "Mindful awareness (chánh niệm tỉnh thức)"}, "back": {"vi": "Biết rõ, trọn vẹn và sáng suốt những gì đang xảy ra trong ta và quanh ta ngay lúc này, với thái độ khách quan và không vội phán xét.", "en": "Knowing clearly, fully, and wisely what is happening within and around us right now, objectively and without rushing to judge."}}, {"front": {"vi": "Tâm viên, ý mã", "en": "Monkey mind, horse thought (tâm viên, ý mã)"}, "back": {"vi": "Hình ảnh nói về tâm không yên: tâm nhảy như con khỉ, ý chạy như con ngựa.", "en": "An image of the restless mind: the mind leaps like a monkey, thought races like a horse."}}, {"front": {"vi": "Dục ái (kāma-taṇhā)", "en": "Craving for sensual pleasure (dục ái; kāma-taṇhā)"}, "back": {"vi": "Luôn muốn thêm cái mới kích thích, như thêm một video, thêm một thông báo, xe mới, iPhone mới…", "en": "Always wanting something new and stimulating—another video, another notification, a new car, a new iPhone…"}}, {"front": {"vi": "Hữu ái (bhava-taṇhā)", "en": "Craving for becoming (hữu ái; bhava-taṇhā)"}, "back": {"vi": "Muốn trở thành và được công nhận, như số lượt thích trên mạng, hình ảnh hoàn hảo, thành tích…", "en": "Wanting to become something and be recognized, such as online likes, a perfect image, achievements…"}}, {"front": {"vi": "Vô hữu ái (vibhava-taṇhā)", "en": "Craving for non-becoming (vô hữu ái; vibhava-taṇhā)"}, "back": {"vi": "Muốn trốn khỏi điều khó chịu, như mở màn hình để thoát buồn chán, trống rỗng, lo âu, cô đơn…", "en": "Wanting to flee the unpleasant, such as opening a screen to escape boredom, emptiness, anxiety, loneliness…"}}, {"front": {"vi": "Diệt (nirodha)", "en": "Cessation (diệt; nirodha)"}, "back": {"vi": "Khổ đau không phải là trạng thái mãi mãi. Khi hiểu nguyên nhân của khổ và buông bỏ tham ái, bám víu, tâm dần được tự do, an ổn; sự chấm dứt hoàn toàn khổ đau là Niết-bàn.", "en": "Suffering is not a permanent state. When we understand its cause and let go of craving and clinging, the mind gradually becomes free and at peace; the complete end of suffering is Nirvana (Niết-bàn)."}}, {"front": {"vi": "Bốn nơi an trú chánh niệm (kinh Niệm Xứ)", "en": "Four foundations for establishing mindfulness (Kinh Niệm Xứ)"}, "back": {"vi": "Quán Thân (nhận biết cơ thể), Quán Thọ (nhận biết cảm giác), Quán Tâm (nhận biết trạng thái của tâm), Quán Pháp (nhận biết điều hiện ra trong tâm và yếu tố nảy sinh từ đó).", "en": "Contemplation of the Body (Quán Thân; noticing the body), of Feelings (Quán Thọ; noticing feelings), of the Mind (Quán Tâm; noticing the mind’s state), and of Mental Phenomena (Quán Pháp; noticing what appears in the mind and the factors arising from it)."}}, {"front": {"vi": "Năm triền cái (pañca nīvaraṇa)", "en": "Five Hindrances (năm triền cái; pañca nīvaraṇa)"}, "back": {"vi": "Năm thứ che phủ tâm, làm ta khó tập trung và khó thấy rõ sự việc. Gồm: ái dục, sân hận, hôn trầm – thụy miên, trạo hối và nghi.", "en": "Five things that veil the mind, making it hard to concentrate and see clearly. They are: sensual desire (ái dục), ill will (sân hận), sloth and torpor (hôn trầm – thụy miên), restlessness and remorse (trạo hối), and doubt (nghi)."}}, {"front": {"vi": "Quán niệm hơi thở (Ānāpānasati)", "en": "Mindfulness of Breathing (quán niệm hơi thở; Ānāpānasati)"}, "back": {"vi": "Một trong những pháp môn căn bản và phổ biến nhất. Hơi thở luôn có mặt trong hiện tại, nên rất dễ đặt sự chú ý vào đó.", "en": "Among the most basic and widespread practices. The breath is always here in the present, so attention settles on it easily."}}, {"front": {"vi": "Chánh niệm trong hành động", "en": "Mindfulness in Action"}, "back": {"vi": "Biết rõ việc mình đang làm trong mọi hoạt động: ăn, uống, nhai, nếm, đi, đứng, ngồi, ngủ, thức, nói, im lặng.", "en": "Knowing clearly what we are doing in every activity: eating, drinking, chewing, tasting, walking, standing, sitting, sleeping, waking, speaking, being silent."}}, {"front": {"vi": "S.T.O.P", "en": "S.T.O.P"}, "back": {"vi": "Không có trong kinh, mà là công cụ của các chương trình chánh niệm hiện đại. S (Stop): dừng lại việc đang làm hoặc lời đang nói trong vài giây. T (Take a breath): hít một hơi thật sâu và thở ra chậm rãi. O (Observe): quan sát cơ thể và trạng thái của tâm. P (Proceed): tiếp tục hành động với sự sáng suốt.", "en": "Not in the suttas, but a tool of modern mindfulness programs. S (Stop): stop what we are doing or saying for a few seconds. T (Take a breath): take one deep breath and exhale slowly. O (Observe): observe the body and the mind’s state. P (Proceed): continue acting with clarity."}}, {"front": {"vi": "Nghĩ quá nhiều (overthinking)", "en": "Overthinking (nghĩ quá nhiều)"}, "back": {"vi": "Là bị cuốn theo dòng suy nghĩ; còn chánh niệm là nhận ra “đang có một ý nghĩ” mà không đi theo nó.", "en": "Being swept along by the stream of thoughts; mindfulness is noticing “a thought is here” without following it."}}], "quiz": [{"level": "medium", "q": {"vi": "“Niệm (sati)” nghĩa là gì?", "en": "What does “Mindfulness (niệm; sati)” mean?"}, "options": {"vi": ["Đúng đắn, chân chính, không lệch lạc, hướng đến điều lành", "Ghi nhớ, nhận biết, chú ý đến điều đang diễn ra ngay lúc này", "Biết rõ việc mình đang làm, có mục đích và phù hợp", "Dừng mọi suy nghĩ để tâm hoàn toàn trống rỗng và yên lặng"], "en": ["Correct, genuine, not distorted, aimed at the wholesome", "Keeping in mind, recognizing, attending to what is happening right now", "Knowing clearly what one is doing, with a purpose and suitably", "Stopping all thoughts so the mind is completely empty and silent"]}, "correct": 1, "explain": {"vi": "Mục 1: “Niệm (sati): ghi nhớ, nhận biết, chú ý đến điều đang diễn ra ngay lúc này.” Đáp án A là nghĩa của “Chánh”, đáp án C là tỉnh giác.", "en": "Section 1: “Mindfulness (niệm; sati): keeping in mind, recognizing, attending to what is happening right now.” Option A is the meaning of “Right” (chánh); option C is clear comprehension."}}, {"level": "medium", "q": {"vi": "Tỉnh giác (sampajañña) là gì?", "en": "What is clear comprehension (tỉnh giác; sampajañña)?"}, "options": {"vi": ["Nhận ra tâm đang nhảy như con khỉ", "Ghi nhớ điều đang diễn ra ngay lúc này", "Biết rõ việc mình đang làm", "Thấy rõ điều nào là thiện, điều nào là bất thiện"], "en": ["Noticing that the mind is leaping like a monkey", "Keeping in mind what is happening right now", "Knowing clearly what one is doing", "Seeing clearly which things are wholesome and which are unwholesome"]}, "correct": 2, "explain": {"vi": "Mục 1: “Tỉnh giác (sampajañña) là biết rõ việc mình đang làm.”", "en": "Section 1: “Clear comprehension (tỉnh giác; sampajañña) is knowing clearly what one is doing.”"}}, {"level": "medium", "q": {"vi": "Chánh niệm là biết rõ điều đang diễn ra ở bốn phần nào?", "en": "Mindfulness is knowing clearly what is happening in which four areas?"}, "options": {"vi": ["Thân, Khẩu, Ý, Giới", "Thân, Thọ, Tâm, Pháp", "Giới, Định, Tuệ, Pháp", "Tâm, Tham, Sân, Si"], "en": ["Body, Speech, Mind, Precepts", "Body, Feelings, Mind, Mental phenomena", "Precepts, Concentration, Wisdom, Mental phenomena", "Mind, Greed, Hatred, Delusion"]}, "correct": 1, "explain": {"vi": "Mục 1: “…ở bốn phần: Thân, Thọ, Tâm và Pháp”; mục 3 nhắc lại thành bốn nơi an trú chánh niệm.", "en": "Section 1: “…in four areas: Body, Feelings, Mind and Mental phenomena”; section 3 repeats them as the four foundations for establishing mindfulness."}}, {"level": "medium", "q": {"vi": "“Tâm viên, ý mã” nói về điều gì?", "en": "What does “monkey mind, horse thought” (tâm viên, ý mã) describe?"}, "options": {"vi": ["Tâm vững như núi, ý nhanh như gió", "Tâm không yên: nhảy như con khỉ, chạy như con ngựa", "Tâm hiền như con khỉ, ý ngoan như con ngựa", "Tâm biết đi lang thang để tìm điều lành"], "en": ["A mind steady as a mountain, thought swift as the wind", "A restless mind: leaping like a monkey, racing like a horse", "A mind gentle as a monkey, thought obedient as a horse", "A mind that wanders in order to find the wholesome"]}, "correct": 1, "explain": {"vi": "Mục 2: hình ảnh nói về tâm không yên: tâm nhảy như con khỉ, ý chạy như con ngựa.", "en": "Section 2: an image of a restless mind: the mind leaps like a monkey, thought races like a horse."}}, {"level": "medium", "q": {"vi": "“Muốn trốn khỏi điều khó chịu, như mở màn hình để thoát buồn chán, cô đơn” là dạng ái nào?", "en": "“Wanting to flee the unpleasant, such as opening a screen to escape boredom or loneliness” is which form of craving?"}, "options": {"vi": ["Dục ái (kāma-taṇhā)", "Hữu ái (bhava-taṇhā)", "Vô hữu ái (vibhava-taṇhā)", "Vô minh (avijjā)"], "en": ["Craving for sensual pleasure (dục ái; kāma-taṇhā)", "Craving for becoming (hữu ái; bhava-taṇhā)", "Craving for non-becoming (vô hữu ái; vibhava-taṇhā)", "Ignorance (vô minh; avijjā)"]}, "correct": 2, "explain": {"vi": "Mục 2 (Tập): vô hữu ái là muốn trốn khỏi điều khó chịu.", "en": "Section 2 (Origin): craving for non-becoming (vô hữu ái) is wanting to flee the unpleasant."}}, {"level": "medium", "q": {"vi": "Trong ví dụ có người nói lời xúc phạm, điều nào thuộc Quán Tâm?", "en": "In the example of someone saying something insulting, which belongs to Contemplation of the Mind?"}, "options": {"vi": ["Ngực nóng, vai căng, tim đập nhanh", "Cảm giác khó chịu", "Gọi tên trạng thái của tâm: “Tâm có sân.”", "Ý nghĩ “họ xúc phạm mình” hiện ra"], "en": ["Chest hot, shoulders tense, heart racing", "An unpleasant feeling", "Naming its state: “Hatred is in the mind.”", "The thought “they insulted me” arises"]}, "correct": 2, "explain": {"vi": "Mục 3: A là Quán Thân, B là Quán Thọ, D là Quán Pháp.", "en": "Section 3: A is Contemplation of the Body, B of Feelings, D of Mental Phenomena."}}, {"level": "medium", "q": {"vi": "Thứ tự bốn bước S.T.O.P là gì?", "en": "What is the order of the four S.T.O.P steps?"}, "options": {"vi": ["Hít thở – Dừng lại – Quan sát – Tiếp tục", "Dừng lại – Hít thở – Quan sát – Tiếp tục", "Dừng lại – Quan sát – Hít thở – Tiếp tục", "Quan sát – Dừng lại – Tiếp tục – Hít thở"], "en": ["Take a breath – Stop – Observe – Proceed", "Stop – Take a breath – Observe – Proceed", "Stop – Observe – Take a breath – Proceed", "Observe – Stop – Proceed – Take a breath"]}, "correct": 1, "explain": {"vi": "Mục 3, Phương pháp 3: Stop, Take a breath, Observe, Proceed.", "en": "Section 3, Method 3: Stop, Take a breath, Observe, Proceed."}}, {"level": "medium", "q": {"vi": "Khi theo dõi hơi thở mà có suy nghĩ chen vào, tài liệu hướng dẫn làm gì?", "en": "While following the breath, thoughts break in. What does the lesson say to do?"}, "options": {"vi": ["Tự trách mình vì đã xao nhãng, rồi bắt đầu lại bài tập từ đầu", "Cố xua hết mọi suy nghĩ cho đến khi tâm hoàn toàn trống rỗng", "Nhận biết “À, tâm mình đang suy nghĩ”, rồi nhẹ nhàng quay lại với hơi thở", "Dừng bài tập vì cho rằng chánh niệm đã mất và không thể lấy lại"], "en": ["Blame ourselves for being distracted, then restart the exercise from the beginning", "Push away every thought until the mind is completely empty", "Recognize: “Ah, my mind is thinking,” then gently return to the breath", "Stop the exercise, since mindfulness is lost and cannot be regained"]}, "correct": 2, "explain": {"vi": "Mục 3, Phương pháp 1: không cần tự trách; nhận biết “À, tâm mình đang suy nghĩ”, rồi nhẹ nhàng quay lại với hơi thở.", "en": "Section 3, Method 1: no need to blame ourselves; just recognize “Ah, my mind is thinking,” then gently return to the breath."}}, {"level": "medium", "q": {"vi": "Theo tài liệu, “năm triền cái” là gì?", "en": "According to the lesson, what are the “five hindrances” (năm triền cái)?"}, "options": {"vi": ["Năm tư thế ngồi thiền mà kinh Niệm Xứ mô tả cho người mới tập", "Năm thứ che phủ tâm, làm ta khó tập trung và khó thấy rõ sự việc", "Năm điều lành cần nuôi dưỡng để tâm luôn được an ổn và vững vàng", "Năm cách buông bỏ tham ái để từng bước chứng ngộ Niết-bàn"], "en": ["Five sitting postures that the Foundations of Mindfulness Sutta describes for beginners", "Five things that veil the mind, making it hard to concentrate and see clearly", "Five wholesome qualities to nurture so the mind stays at peace and steady", "Five ways of letting go of craving to realize Nirvana step by step"]}, "correct": 1, "explain": {"vi": "Phụ lục (câu dẫn), được nhắc ở mục 3: năm thứ che phủ tâm, làm ta khó tập trung và khó thấy rõ sự việc.", "en": "Appendix (opening line), referred to in section 3: five things that veil the mind, making it hard to concentrate and see clearly."}}, {"level": "advanced", "q": {"vi": "Khi ngồi theo dõi hơi thở, bạn nghĩ “Bài tập chưa xong” rồi lên kế hoạch làm bài suốt mấy phút. Theo tài liệu, đó là gì?", "en": "While following your breath, you think “My assignment isn’t finished” and spend several minutes planning how to do it. According to the lesson, what is this?"}, "options": {"vi": ["Chánh niệm, vì bạn đang biết rõ điều tâm đang nghĩ", "Nghĩ quá nhiều: bị cuốn theo dòng suy nghĩ, chưa nhận ra “đang có một ý nghĩ”", "Tỉnh giác, vì bạn đang biết việc mình làm có mục đích", "Quán Thọ, vì bạn đang nhận biết cảm giác dễ chịu hay khó chịu"], "en": ["Mindfulness, because you know clearly what the mind is thinking", "Overthinking: being swept along by the stream of thoughts, not yet noticing “a thought is here”", "Clear comprehension, because you know that what you are doing has a purpose", "Contemplation of Feelings, because you are noticing pleasant or unpleasant sensations"]}, "correct": 1, "explain": {"vi": "Mục 3: “Nghĩ quá nhiều là bị cuốn theo dòng suy nghĩ; chánh niệm là nhận ra “đang có một ý nghĩ” mà không đi theo nó.”", "en": "Section 3: “Overthinking is being swept along by the stream of thoughts; mindfulness is noticing “a thought is here” without following it.”"}}, {"level": "advanced", "q": {"vi": "Một bạn quan sát rất kỹ mọi suy nghĩ của mình nhưng luôn tự trách và phán xét mình. Theo tài liệu, điều gì còn thiếu?", "en": "A friend observes all their thoughts very closely but always blames and judges themselves. According to the lesson, what is missing?"}, "options": {"vi": ["Làm từng việc một (single-tasking)", "Ngăn mọi cảm xúc xuất hiện trong tâm", "Bình tĩnh nhìn nhận, không vội trách mình hay phán xét, để hiểu và điều chỉnh hành động", "Ngồi thiền lâu hơn mỗi ngày"], "en": ["Doing one thing at a time (single-tasking)", "Stopping every emotion from arising in the mind", "Observing calmly, without rushing to blame ourselves or judge, so as to understand and adjust our actions", "Meditating longer each day"]}, "correct": 2, "explain": {"vi": "Mục 1 (Lưu ý): “không vội trách mình hay phán xét người, mà bình tĩnh nhìn nhận để hiểu và điều chỉnh hành động của mình.”", "en": "Section 1 (Note): “we don’t rush to blame ourselves or judge others, but observe calmly to understand and adjust our actions.”"}}, {"level": "advanced", "q": {"vi": "Điều nào đúng về S.T.O.P?", "en": "Which statement about S.T.O.P is correct?"}, "options": {"vi": ["Được Đức Phật dạy trong kinh Niệm Xứ như một cách Quán Pháp, gồm bốn bước", "Không có trong kinh; là công cụ của các chương trình chánh niệm hiện đại", "Là tên khác của phương pháp quán niệm hơi thở trong kinh Niệm Xứ", "Chỉ dùng để luyện sự tập trung khi học bài hoặc làm việc ở nhà"], "en": ["The Buddha taught it in the Foundations of Mindfulness Sutta as a way of Contemplation of Mental Phenomena, in four steps", "It is not in the suttas; it is a tool of modern mindfulness programs", "It is another name for the mindfulness of breathing in the Foundations of Mindfulness Sutta", "It is only for training concentration when studying or working at home"]}, "correct": 1, "explain": {"vi": "Mục 3: S.T.O.P không có trong kinh; hỗ trợ Quán Thọ và Quán Tâm lúc căng thẳng hay giận dữ.", "en": "Section 3: S.T.O.P is not in the suttas; it supports Contemplation of Feelings and of the Mind when stressed or angry."}}, {"level": "advanced", "q": {"vi": "Một bạn luôn chỉnh ảnh để hình ảnh trên mạng trông hoàn hảo, mong được công nhận. Theo cách soi Tứ Diệu Đế của tài liệu, đây là dạng ái nào?", "en": "A friend always edits photos so their online image looks perfect, hoping to be recognized. Looking through the Four Noble Truths as the lesson does, which form of craving is this?"}, "options": {"vi": ["Dục ái, vì luôn muốn thêm cái mới kích thích", "Hữu ái, vì muốn trở thành và được công nhận", "Vô hữu ái, vì muốn trốn khỏi điều khó chịu", "Không dạng nào, vì ảnh đẹp không gây ra khổ"], "en": ["Craving for sensual pleasure, because they always want something new and stimulating", "Craving for becoming, because they want to become something and be recognized", "Craving for non-becoming, because they want to flee the unpleasant", "None, because a nice photo causes no suffering"]}, "correct": 1, "explain": {"vi": "Mục 2 (Tập): hữu ái là “muốn trở thành và được công nhận, như số lượt thích trên mạng, hình ảnh hoàn hảo, thành tích…”", "en": "Section 2 (Origin): craving for becoming is “wanting to become something and be recognized, such as online likes, a perfect image, achievements…”"}}, {"level": "advanced", "q": {"vi": "Một bạn hay thức khuya lướt điện thoại và tiêu xài bốc đồng. Theo mục 4 của tài liệu, luyện chánh niệm đều đặn giúp bạn ấy thay đổi như thế nào?", "en": "A friend often stays up late scrolling on the phone and spends impulsively. According to section 4, how does regular mindfulness practice help?"}, "options": {"vi": ["Nhận ra sớm các thói quen có hại ấy để tự điều chỉnh, không phản ứng bộc phát", "Không còn bị thói quen nào lôi kéo nữa, nên không cần điều chỉnh thêm điều gì", "Tin ngay vào lời dạy này, vì việc tự thử và tự kiểm chứng là không cần thiết", "Không còn cảm xúc nào xuất hiện, nên không còn thôi thúc lướt điện thoại hay mua sắm"], "en": ["Noticing such harmful habits early so as to correct ourselves, not reacting impulsively", "Nothing pulls them in anymore, so they have nothing left to adjust", "Believing the teaching right away, since trying and verifying it for themselves is unnecessary", "No emotions arise anymore, so the urge to scroll or shop disappears"]}, "correct": 0, "explain": {"vi": "Mục 4 (Tự chủ hơn): chuyển từ “phản ứng bộc phát” sang “phản ứng có lựa chọn”, nhận ra sớm những thói quen có hại (thức khuya, lướt điện thoại, tiêu xài bốc đồng, nghiện game) để tự điều chỉnh. Tài liệu không nói thói quen hay cảm xúc biến mất hẳn (B, D), và mời “hãy tự thử và tự kiểm chứng” chứ không bảo tin ngay (C).", "en": "Section 4 (More self-control): shifting from “impulsive reaction” to “a chosen response”, noticing harmful habits early (staying up late, scrolling on the phone, impulsive spending, gaming addiction) to correct ourselves. The lesson does not say habits or emotions disappear entirely (B, D), and it invites us to “try and verify for ourselves” rather than to believe right away (C)."}}, {"level": "advanced", "q": {"vi": "Một bạn ngồi yên quan sát tâm thì thấy rất khó chịu, và đã lo âu, mất ngủ kéo dài. Theo tài liệu nên làm gì?", "en": "A friend feels a lot of discomfort when sitting still and observing the mind, and has also had persistent anxiety and insomnia. According to the lesson, what should they do?"}, "options": {"vi": ["Cố ngồi lâu hơn cho đến khi cảm giác khó chịu tự hết hẳn", "Dừng lại và hỏi người hướng dẫn; nếu kéo dài thì gặp bác sĩ hoặc chuyên gia tâm lý", "Dùng chánh niệm hằng ngày để thay cho việc đi khám và chữa bệnh", "Xem đó là dấu hiệu cho thấy việc thực hành chánh niệm đã tiến bộ"], "en": ["Try to sit longer until the discomfort goes away completely", "Stop and ask the instructor; if the problem persists, talk to a doctor or psychologist", "Use mindfulness every day in place of seeing a doctor and getting treatment", "Take it as a sign that the mindfulness practice has progressed"]}, "correct": 1, "explain": {"vi": "Mục 4 (Lưu ý): chánh niệm không thay thế thuốc chữa bệnh; nếu lo âu, buồn bã hoặc mất ngủ kéo dài thì nói chuyện với bác sĩ hoặc chuyên gia tâm lý; khó chịu nhiều thì dừng lại và hỏi người hướng dẫn.", "en": "Section 4 (Note): mindfulness is not a substitute for medication; if anxiety, sadness, or insomnia persists, talk to a doctor or psychologist; if sitting still brings up a lot of discomfort, stop and ask your instructor."}}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('artifact-data').textContent);
const ACCENTS = ['sage','lotus','saffron','sky','sage','lotus','saffron'];

const STR = {
  vi: {
    read:'Đọc', flash:'Flashcard', quiz:'Trắc nghiệm',
    heroKicker:'GĐPT · Tài liệu tu học',
    continueReadPrefix:'Đã đọc', continueReadBtn:'Tiếp tục: Flashcard',
    startFlash:'Bắt đầu Flashcard',
    flashBackHint:'Chạm để lật lại', flashFrontHint:'Chạm để xem giải nghĩa',
    flashOf:'Thẻ', flashContinue:'Tiếp tục: Trắc nghiệm',
    quizOf:'Câu', quizNext:'Câu tiếp theo', quizSubmit:'Nộp bài',
    quizStart:'Bắt đầu trắc nghiệm',
    resultsTitle:'Kết quả của anh/chị', resultsScoreOf:'trên',
    congrats:'Chúc mừng anh chị đã hoàn thành bài tu học!',
    optTag:'Mở rộng · không bắt buộc',
    reviewTitle:'Xem lại đáp án', backToStart:'Về đầu tài liệu',
    fnTag:'Ghi chú',
    footnoteHeading:'Chú thích',
    stepsTitle:'Quy trình 3 bước',
    step1:'Hoàn thành đọc tài liệu', step2:'Hoàn thành Flashcard', step3:'Hoàn thành Trắc nghiệm',
    summaryShow:'Xem tóm tắt', summaryHide:'Ẩn tóm tắt', summaryTag:'Tóm tắt nhanh · không thay thế nguyên văn',
    summaryReadFull:'Đọc toàn văn', collapse:'Thu gọn',
    lvPickTitle:'Chọn mức độ trắc nghiệm', lvPickSub:'Mỗi lần làm, thứ tự câu hỏi và các đáp án được xáo trộn ngẫu nhiên.',
    lvMedium:'Mức 1 · Trung bình', lvAdvanced:'Mức 2 · Nâng cao',
    lvMediumDesc:'Kiểm tra kiến thức cốt lõi sau khi đọc.', lvAdvancedDesc:'Vận dụng, phân tích và so sánh các khái niệm.',
    lvQuestions:'câu', lvLocked:'Hoàn thành Mức 1 để mở khóa', lvDone:'Đã hoàn thành',
    lvStart:'Bắt đầu', lvRetake:'Làm lại mức này (xáo trộn)', lvOther:'Chọn mức khác', lvTryAdv:'Thử thách Mức 2 · Nâng cao',
    lvShuffled:'Thứ tự câu hỏi & đáp án đã được xáo trộn',
    levelName_medium:'Trung bình', levelName_advanced:'Nâng cao',
  },
  en: {
    read:'Read', flash:'Flashcards', quiz:'Quiz',
    heroKicker:'GĐPT · Study Document',
    continueReadPrefix:'Read', continueReadBtn:'Continue: Flashcards',
    startFlash:'Start Flashcards',
    flashBackHint:'Tap to flip back', flashFrontHint:'Tap to see the meaning',
    flashOf:'Card', flashContinue:'Continue: Quiz',
    quizOf:'Question', quizNext:'Next question', quizSubmit:'Submit',
    quizStart:'Start Quiz',
    resultsTitle:'Your Results', resultsScoreOf:'out of',
    congrats:"Congratulations — you've completed this study lesson!",
    optTag:'Optional extra · not required',
    reviewTitle:'Review Answers', backToStart:'Back to top',
    fnTag:'Note',
    footnoteHeading:'Footnote',
    stepsTitle:'3-Step Process',
    step1:'Finish Reading', step2:'Finish Flashcards', step3:'Finish Quiz',
    summaryShow:'View summary', summaryHide:'Hide summary', summaryTag:'Quick summary · does not replace the full text',
    summaryReadFull:'Read full text', collapse:'Collapse',
    lvPickTitle:'Choose your quiz level', lvPickSub:'Each attempt shuffles the order of the questions and the answer options.',
    lvMedium:'Level 1 · Intermediate', lvAdvanced:'Level 2 · Advanced',
    lvMediumDesc:'Checks the core knowledge after reading.', lvAdvancedDesc:'Application, analysis and comparison of concepts.',
    lvQuestions:'questions', lvLocked:'Complete Level 1 to unlock', lvDone:'Completed',
    lvStart:'Start', lvRetake:'Retake this level (shuffled)', lvOther:'Choose another level', lvTryAdv:'Take the Level 2 · Advanced challenge',
    lvShuffled:'Questions and answer options have been shuffled',
    levelName_medium:'Intermediate', levelName_advanced:'Advanced',
  }
};

let state = {
  lang:'vi',
  stage:'read', // read | flash | quiz | results
  readSet: new Set(),
  miniOpen: new Set(),
  flashIndex:0,
  flashFlipped:false,
  flashSeen:new Set(),
  summaryOpen: new Set(),
  quizLevel:null,      // 'medium' | 'advanced' | null (picker)
  quizSession:null,    // [{qi, perm}] shuffled order of this attempt
  quizIndex:0,
  quizAnswers:{},      // session position -> DISPLAYED option index
  quizSubmitted:false,
  levelDone:{},        // {medium:true, advanced:true}
};

function t(key){ return STR[state.lang][key]; }

function setLang(l){
  state.lang = l;
  document.getElementById('btnLangVi').classList.toggle('active', l==='vi');
  document.getElementById('btnLangEn').classList.toggle('active', l==='en');
  document.documentElement.lang = l;
  render();
}

/* ---------------- HEADER / PROGRESS ---------------- */
function renderHeader(){
  const notRead = state.stage!=='read';
  document.getElementById('topBackBtn').classList.toggle('show', notRead);
  document.getElementById('topBackLabel').textContent = state.lang==='vi' ? 'Đọc tài liệu' : 'Read document';
  document.querySelectorAll('[data-i18n-label]').forEach(el=>{
    const k = el.getAttribute('data-i18n-label');
    el.textContent = t(k);
  });
  const total = DATA.sections.filter(s=>!s.optional).length;
  const readPct = Math.round((state.readSet.size/total)*100);
  document.getElementById('pbRead').style.width = readPct+'%';
  const flashPct = Math.round((state.flashSeen.size/DATA.flashcards.length)*100);
  document.getElementById('pbFlash').style.width = (state.stage==='read'?0:flashPct)+'%';
  const answered = Object.keys(state.quizAnswers).length;
  const sessLen = state.quizSession ? state.quizSession.length : 0;
  const quizPct = state.quizSubmitted ? 100 : (sessLen ? Math.round((answered/sessLen)*100) : 0);
  document.getElementById('pbQuiz').style.width = ((state.stage==='read'||state.stage==='flash')?0:quizPct)+'%';

  document.querySelectorAll('.progress-step').forEach(el=>{
    const s = el.getAttribute('data-stage');
    el.classList.toggle('current', s===state.stage || (state.stage==='results' && s==='quiz'));
  });
}

/* ---------------- FOOTNOTE MODAL ---------------- */
function openFn(n){
  document.getElementById('fnTag').textContent = t('fnTag')+' '+n;
  document.getElementById('fnBody').textContent = DATA.footnotes[state.lang][n];
  document.getElementById('fnModal').classList.add('show');
}
function closeFn(e){
  document.getElementById('fnModal').classList.remove('show');
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.fn-ref');
  if(btn){ openFn(btn.getAttribute('data-fn')); }
});

/* ---------------- STAGE: READ ---------------- */
function renderRead(){
  const root = document.getElementById('stageRead');
  const lang = state.lang;
  let html = `
    <div class="hero">
      <div style="font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--sage-ink);text-transform:uppercase;margin-bottom:6px;">${(DATA.meta.kicker && DATA.meta.kicker[lang]) || t('heroKicker')}</div>
      <h1>${DATA.meta.title[lang]}</h1>
      ${DATA.meta.subtitle && DATA.meta.subtitle[lang] ? `<div class="subtitle">${DATA.meta.subtitle[lang]}</div>` : ''}
    </div>
    <div class="steps-guide">
      <div class="steps-guide-title">${t('stepsTitle')}</div>
      <div class="step-chip s1"><span class="step-num">1</span>${t('step1')}</div>
      <span class="step-arrow">→</span>
      <div class="step-chip s2"><span class="step-num">2</span>${t('step2')}</div>
      <span class="step-arrow">→</span>
      <div class="step-chip s3"><span class="step-num">3</span>${t('step3')}</div>
    </div>
  `;
  DATA.sections.forEach((sec, i)=>{
    const accent = ACCENTS[i % ACCENTS.length];
    const isOpen = sec._open;
    const isRead = state.readSet.has(sec.id);
    const hasSum = !!(sec.summary && sec.summary[lang]);
    const sumOpen = hasSum && state.summaryOpen.has(sec.id);
    const summaryHtml = hasSum ? `
        <div class="summary-bar"><button class="summary-btn ${sumOpen?'on':''}" onclick="toggleSummary('${sec.id}')" aria-expanded="${sumOpen}">
          <span aria-hidden="true">💡</span>${sumOpen?t('summaryHide'):t('summaryShow')}
          <svg class="sb-chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></div>
        ${sumOpen?`<div class="summary-panel"><span class="sp-tag">${t('summaryTag')}</span>${sec.summary[lang]}
          <div class="summary-actions">
            ${isOpen?'':`<button onclick="openFull('${sec.id}')">${t('summaryReadFull')}</button>`}
            <button onclick="toggleSummary('${sec.id}')">${t('summaryHide')}</button>
          </div></div>`:''}` : '';
    html += `
      <div class="section-card ${isOpen?'open':''}" style="--accent:var(--${accent});--accent-bg:var(--${accent}-bg);--accent-ink:var(--${accent}-ink);">
        <button class="section-head" onclick="toggleSection('${sec.id}')">
          <span class="num ${isRead?'check':''} ${sec.optional?'pl':''}">${sec.optional ? '+' : (i+1)}</span>
          <span class="htitle">${sec.title[lang]}${sec.optional ? `<span class="opt-tag">${t('optTag')}</span>` : ''}</span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        ${summaryHtml}
        <div class="section-body">
          <div class="section-body-inner">${sec.html[lang]}${isOpen ? `<button class="collapse-btn" onclick="toggleSection('${sec.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 15l-6-6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>${t('collapse')}</button>` : ''}</div>
        </div>
      </div>
    `;
  });
  root.innerHTML = html;

  // inject timeline into its placeholder (Part 2)
  const tlHost = root.querySelector('#__TIMELINE__');
  if(tlHost){ tlHost.outerHTML = renderTimelineHtml(lang); }

  // apply persisted mini-accordion open states
  root.querySelectorAll('.mini-acc').forEach(el=>{
    if(state.miniOpen.has(el.getAttribute('data-mid'))) el.classList.add('open');
  });
}
function toggleSection(id){
  const sec = DATA.sections.find(s=>s.id===id);
  sec._open = !sec._open;
  if(sec._open && !sec.optional){ state.readSet.add(id); }
  renderRead();
  renderContinueBar();
  renderHeader();
}
function toggleSummary(id){
  if(state.summaryOpen.has(id)) state.summaryOpen.delete(id); else state.summaryOpen.add(id);
  renderRead();
}
function openFull(id){
  const sec = DATA.sections.find(s=>s.id===id);
  sec._open = true; if(!sec.optional){ state.readSet.add(id); }
  state.summaryOpen.delete(id);
  renderRead(); renderContinueBar(); renderHeader();
}
function toggleMini(btn){
  const wrap = btn.closest('.mini-acc');
  const mid = wrap.getAttribute('data-mid');
  if(state.miniOpen.has(mid)) state.miniOpen.delete(mid); else state.miniOpen.add(mid);
  renderRead();
}

/* ---------------- TIMELINE ---------------- */
function renderTimelineHtml(lang){
  const nodes = DATA.timeline.map(pt=>`
    <button class="timeline-node" onclick="openThinker('${pt.anchor}')">
      <span class="tl-line"></span>
      <span class="tl-dot"></span>
      <span class="tl-year">${pt.year}</span>
      <span class="tl-name">${pt.name}</span>
      <span class="tl-idea">${pt.idea[lang]}</span>
    </button>
  `).join('');
  const title = (DATA.meta.timelineTitle && DATA.meta.timelineTitle[lang]) || (lang==='vi' ? 'Dòng thời gian' : 'Timeline');
  return `<div class="timeline-wrap"><div class="timeline-title">${title}</div><div class="timeline-track">${nodes}</div></div>`;
}
function openThinker(anchor){
  const needle = 'id="'+anchor+'"';
  const sec = DATA.sections.find(s=>((s.html.vi||'')+(s.html.en||'')).includes(needle)) || DATA.sections.find(s=>s.id==='part2') || DATA.sections[0];
  sec._open = true;
  if(!sec.optional){ state.readSet.add(sec.id); }
  renderRead();
  renderHeader();
  renderContinueBar();
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const el = document.getElementById(anchor);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
    }, 60);
  });
}

/* ---------------- JUMPS BETWEEN THE NOTE BOX (section 3) AND THE OPTIONAL APPENDIX ---------------- */
function scrollMode(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; }catch(e){ return 'smooth'; }
}
function jumpToAppendix(n){
  const sec = DATA.sections.find(s=>s.optional);
  if(!sec) return;
  sec._open = true;                       // opening the appendix never counts as reading a required section
  state.miniOpen.add('pl-'+n);
  renderRead(); renderHeader(); renderContinueBar();
  requestAnimationFrame(()=>{ setTimeout(()=>{
    const el = document.querySelector('.mini-acc[data-mid="pl-'+n+'"]');
    if(el){ el.scrollIntoView({behavior:scrollMode(), block:'start'}); }
  }, 60); });
}
function jumpBack(){
  const sec = DATA.sections.find(s=>((s.html.vi||'')+(s.html.en||'')).includes('id="luu-y-quan-phap"'));
  if(!sec) return;
  sec._open = true;
  if(!sec.optional){ state.readSet.add(sec.id); }
  renderRead(); renderHeader(); renderContinueBar();
  requestAnimationFrame(()=>{ setTimeout(()=>{
    const el = document.getElementById('luu-y-quan-phap');
    if(el){ el.scrollIntoView({behavior:scrollMode(), block:'start'}); }
  }, 60); });
}
function goToRead(){
  state.stage = 'read';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- STAGE: FLASHCARDS ---------------- */
function renderFlash(){
  const root = document.getElementById('stageFlash');
  const lang = state.lang;
  const cards = DATA.flashcards;
  const i = state.flashIndex;
  const card = cards[i];
  const accent = ACCENTS[i % ACCENTS.length];
  state.flashSeen.add(i);
  const dots = cards.map((c,idx)=>`<span class="flash-dot ${state.flashSeen.has(idx)?'seen':''} ${idx===i?'current':''}"></span>`).join('');
  root.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-counter">${t('flashOf')} ${i+1} / ${cards.length}</div>
      <div class="flash-scene">
        <div class="flash-card ${state.flashFlipped?'flipped':''}" id="flashCardEl" onclick="flipCard()" style="--accent:var(--${accent});--accent-bg:var(--${accent}-bg);--accent-ink:var(--${accent}-ink);">
          <div class="flash-face front">
            <div class="flash-face-content">
              <div class="kicker">${lang==='vi'?'Thuật ngữ':'Term'}</div>
              <div class="term">${card.front[lang]}</div>
              <div class="tap-hint">${t('flashFrontHint')}</div>
            </div>
          </div>
          <div class="flash-face back">
            <div class="flash-face-content">
              <div class="kicker">${lang==='vi'?'Giải nghĩa':'Meaning'}</div>
              <div class="term-repeat">${card.front[lang]}</div>
              <div class="def">${card.back[lang]}</div>
              <div class="tap-hint">${t('flashBackHint')}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="iconbtn" onclick="flashPrev()" ${i===0?'disabled':''} aria-label="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" onclick="flashNext()" ${i===cards.length-1?'disabled':''} aria-label="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="flash-dot-row">${dots}</div>
    </div>
  `;
  renderHeader();
  renderContinueBar();
}
function flipCard(){
  state.flashFlipped = !state.flashFlipped;
  renderFlash();
  const el = document.getElementById('flashCardEl');
  if(el){
    const cls = state.flashFlipped ? 'flip-to-back' : 'flip-to-front';
    el.classList.add(cls);
    el.addEventListener('animationend', function handler(){
      el.classList.remove('flip-to-back','flip-to-front');
      el.removeEventListener('animationend', handler);
    });
  }
}
function flashPrev(){ if(state.flashIndex>0){ state.flashIndex--; state.flashFlipped=false; renderFlash(); } }
function flashNext(){ if(state.flashIndex<DATA.flashcards.length-1){ state.flashIndex++; state.flashFlipped=false; renderFlash(); } }

/* ---------------- STAGE: QUIZ (v2: 2 levels + shuffle) ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function levelOf(q){ return q.level==='advanced' ? 'advanced' : 'medium'; }
function questionsOfLevel(level){
  const out=[]; DATA.quiz.forEach((q,i)=>{ if(levelOf(q)===level) out.push(i); }); return out;
}
function levelsAvailable(){ return ['medium','advanced'].filter(l=>questionsOfLevel(l).length>0); }
function isLevelLocked(level){
  if(level!=='advanced') return false;
  if(DATA.meta.gateAdvanced===false) return false;
  return questionsOfLevel('medium').length>0 && !state.levelDone.medium;
}
/* Option order is a permutation of INDICES, so it is language-toggle safe:
   VI and EN option arrays must have the same order (same index = same option). */
function makePerm(q){
  const n = (q.options.vi || q.options.en).length;
  const id = Array.from({length:n}, (_,i)=>i);
  return q.lockOptions ? id : shuffle(id);
}
function initQuizSession(level){
  state.quizLevel = level;
  state.quizSession = shuffle(questionsOfLevel(level)).map(qi=>({qi, perm:makePerm(DATA.quiz[qi])}));
  state.quizAnswers = {};
  state.quizIndex = 0;
  state.quizSubmitted = false;
}
function startQuiz(level){
  if(isLevelLocked(level)) return;
  initQuizSession(level);
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function pickAnotherLevel(){
  state.quizLevel = null; state.quizSession = null; state.quizAnswers = {}; state.quizIndex = 0; state.quizSubmitted = false;
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderQuizPicker(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  const cards = levelsAvailable().map(l=>{
    const n = questionsOfLevel(l).length;
    const locked = isLevelLocked(l);
    const done = !!state.levelDone[l];
    const nameKey = l==='medium' ? 'lvMedium' : 'lvAdvanced';
    const descKey = l==='medium' ? 'lvMediumDesc' : 'lvAdvancedDesc';
    return `<button class="level-card lvl-${l}" ${locked?'disabled':''} onclick="startQuiz('${l}')">
      <div class="lv-name">${locked?'🔒':(done?'✅':(l==='medium'?'🌱':'🔥'))} ${t(nameKey)}</div>
      <div class="lv-meta">${n} ${t('lvQuestions')}${done?' · '+t('lvDone'):''}${locked?' · '+t('lvLocked'):''}</div>
      <div class="lv-desc">${t(descKey)}</div>
    </button>`;
  }).join('');
  root.innerHTML = `
    <div class="level-intro">${t('lvPickTitle')}</div>
    <div class="level-sub">${t('lvPickSub')}</div>
    ${cards}
  `;
  renderHeader();
  renderContinueBar();
}
function renderQuiz(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  if(!state.quizSession){
    const lv = levelsAvailable();
    if(lv.length>1){ renderQuizPicker(); return; }
    initQuizSession(lv[0] || 'medium');
  }
  const sess = state.quizSession;
  const i = state.quizIndex;
  const item = sess[i];
  const q = DATA.quiz[item.qi];
  const answered = state.quizAnswers[i];
  const correctShown = item.perm.indexOf(q.correct);
  const dots = sess.map((_,idx)=>`<button class="quiz-dot ${state.quizAnswers[idx]!==undefined?'answered':''} ${idx===i?'current':''}" onclick="goToQuizQuestion(${idx})">${idx+1}</button>`).join('');

  let optionsHtml = '';
  item.perm.forEach((orig, shown)=>{
    let cls = 'quiz-option';
    if(answered!==undefined){
      if(shown===correctShown) cls += ' correct';
      else if(shown===answered) cls += ' wrong';
    }
    optionsHtml += `<button class="${cls}" onclick="answerQuiz(${shown})" ${answered!==undefined?'disabled':''}>${q.options[lang][orig]}</button>`;
  });

  let explainHtml = '';
  if(answered!==undefined){
    explainHtml = `<div class="quiz-explain">${q.explain[lang]}</div>
    <button class="quiz-retry-btn" onclick="retryQuestion(${i})">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V7m0 5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${lang==='vi'?'Trả lời lại câu này':'Answer this again'}
    </button>`;
  }

  const isLast = i === sess.length-1;
  let nextBtn = '';
  if(answered!==undefined){
    nextBtn = `<button class="btn" onclick="${isLast?'submitQuiz()':'quizNext()'}">${isLast? t('quizSubmit') : t('quizNext')}</button>`;
  }
  const lv = levelOf(q);
  root.innerHTML = `
    <div class="quiz-dot-row">${dots}</div>
    <div class="quiz-progress">${t('quizOf')} ${i+1} / ${sess.length}</div>
    <span class="level-chip lvl-${lv}">${t('levelName_'+lv)}</span>
    <div class="quiz-q">${q.q[lang]}</div>
    <div class="quiz-options">${optionsHtml}</div>
    ${explainHtml}
    ${nextBtn}
  `;
  renderHeader();
  renderContinueBar();
}
function answerQuiz(shown){
  state.quizAnswers[state.quizIndex] = shown;
  renderQuiz();
}
function quizNext(){
  if(state.quizIndex < state.quizSession.length-1){ state.quizIndex++; renderQuiz(); }
}
function goToQuizQuestion(idx){
  state.quizIndex = idx;
  renderQuiz();
}
function retryQuestion(idx){
  delete state.quizAnswers[idx];
  const item = state.quizSession[idx];
  item.perm = makePerm(DATA.quiz[item.qi]);   // reshuffle options on a retry
  state.quizIndex = idx;
  renderQuiz();
}
function submitQuiz(){
  state.quizSubmitted = true;
  state.levelDone[state.quizLevel] = true;
  state.stage = 'results';
  renderAll();
  setTimeout(()=>{ fireConfetti(); fireFireworks(); }, 250);
}
function retakeQuiz(){
  initQuizSession(state.quizLevel || levelsAvailable()[0] || 'medium');   // new shuffle every restart
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  const sess = state.quizSession;
  let correct = 0;
  sess.forEach((it,idx)=>{ const q=DATA.quiz[it.qi]; if(it.perm[state.quizAnswers[idx]]===q.correct) correct++; });

  let reviewHtml = sess.map((it,idx)=>{
    const q = DATA.quiz[it.qi];
    const yourOrig = it.perm[state.quizAnswers[idx]];
    const ok = yourOrig===q.correct;
    return `<div class="review-item">
      <div class="q">${idx+1}. ${q.q[lang]}</div>
      <div class="${ok?'a-correct':'a-wrong'}">${ok?'✓':'✕'} ${q.options[lang][yourOrig]}</div>
      ${!ok?`<div class="a-correct">→ ${q.options[lang][q.correct]}</div>`:''}
    </div>`;
  }).join('');

  const multi = levelsAvailable().length>1;
  const canAdv = multi && state.quizLevel==='medium' && !isLevelLocked('advanced');
  root.innerHTML = `
    <div class="results">
      <span class="big-emoji">🎆</span>
      <h2>${t('resultsTitle')} · ${t('levelName_'+state.quizLevel)}</h2>
      <div class="score">${correct} / ${sess.length}</div>
      <div class="congrats">🎉 ${t('congrats')}</div>
      <div class="results-actions">
        ${canAdv?`<button class="btn lotus" onclick="startQuiz('advanced')">🔥 ${t('lvTryAdv')}</button>`:''}
        <button class="btn retake-btn" onclick="retakeQuiz()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V7m0 5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ${t('lvRetake')}
        </button>
        ${multi?`<button class="btn secondary" onclick="pickAnotherLevel()">${t('lvOther')}</button>`:''}
      </div>
    </div>
    <div class="review-title">${t('reviewTitle')}</div>
    ${reviewHtml}
  `;
  renderHeader();
  renderContinueBar();
}

/* ---------------- CONTINUE BAR ---------------- */
function renderContinueBar(){
  const bar = document.getElementById('continueBar');
  const status = document.getElementById('continueStatus');
  const btn = document.getElementById('continueBtn');
  const lang = state.lang;

  if(state.stage==='read'){
    const total = DATA.sections.filter(s=>!s.optional).length;
    const readCount = state.readSet.size;
    status.textContent = `${t('continueReadPrefix')} ${readCount}/${total}`;
    btn.textContent = t('continueReadBtn');
    btn.disabled = readCount < total;
    btn.onclick = ()=>{ state.stage='flash'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    bar.style.display='block';
  } else if(state.stage==='flash'){
    const total = DATA.flashcards.length;
    const seen = state.flashSeen.size;
    status.textContent = `${lang==='vi'?'Đã xem':'Viewed'} ${seen}/${total}`;
    btn.textContent = t('flashContinue');
    btn.disabled = seen < total;
    btn.onclick = ()=>{ state.stage='quiz'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    bar.style.display='block';
  } else {
    bar.style.display='none';
  }
}

/* ---------------- CONFETTI ---------------- */
function fireConfetti(){
  const colors = ['#8FB988','#E8A3B0','#E7BA53','#93BEDB','#F3C9D0'];
  const count = 90;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    el.style.width = size+'px';
    el.style.height = (size*0.4 + Math.random()*size*0.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 2.6 + Math.random()*1.8;
    const rot = (Math.random()>0.5?1:-1) * (180+Math.random()*360);
    el.style.setProperty('--rot', rot+'deg');
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = (Math.random()*0.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (duration+0.6)*1000);
  }
}
function fireFireworks(){
  const colors = ['#8FB988','#E8A3B0','#E7BA53','#93BEDB','#F3C9D0','#fff'];
  const burstCount = 5;
  for(let b=0;b<burstCount;b++){
    setTimeout(()=>{
      const originX = 12 + Math.random()*76;
      const originY = 12 + Math.random()*28;
      const particles = 26;
      for(let p=0;p<particles;p++){
        const el = document.createElement('div');
        el.className = 'spark';
        const size = 5 + Math.random()*4;
        el.style.width = size+'px';
        el.style.height = size+'px';
        el.style.left = originX+'vw';
        el.style.top = originY+'vh';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        const angle = (Math.PI*2)*(p/particles) + Math.random()*0.25;
        const dist = 55 + Math.random()*75;
        el.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
        el.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
        const dur = 0.75 + Math.random()*0.5;
        el.style.animationDuration = dur+'s';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), dur*1000+120);
      }
    }, b*320);
  }
}

/* ---------------- MASTER RENDER ---------------- */
function renderAll(){
  document.getElementById('stageRead').style.display = state.stage==='read' ? 'block':'none';
  document.getElementById('stageFlash').style.display = state.stage==='flash' ? 'block':'none';
  document.getElementById('stageQuiz').style.display = (state.stage==='quiz'||state.stage==='results') ? 'block':'none';

  if(state.stage==='read') renderRead();
  else if(state.stage==='flash') renderFlash();
  else if(state.stage==='quiz') renderQuiz();
  else if(state.stage==='results') renderResults();

  renderHeader();
  renderContinueBar();
}
function render(){ renderAll(); }

DATA.sections.forEach(s=>{ s._open = false; });
render();
</script>
