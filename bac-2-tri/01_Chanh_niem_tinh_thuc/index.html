<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chánh Niệm Tỉnh Thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF;
  --bg-card:#FFFDF8;
  --ink:#3E3A34;
  --ink-soft:#6E6759;
  --ink-faint:#9A927F;
  --border:#EFE3D0;
  --sage:#8FB988;
  --sage-ink:#3E5C3B;
  --sage-bg:#E8F1E4;
  --lotus:#E8A3B0;
  --lotus-ink:#7A3A44;
  --lotus-bg:#FBE7EA;
  --saffron:#E7BA53;
  --saffron-ink:#6B5220;
  --saffron-bg:#FBF0D9;
  --sky:#93BEDB;
  --sky-ink:#2E5470;
  --sky-bg:#E5F0F7;
  --shadow: 0 2px 10px rgba(62,58,52,0.06), 0 1px 2px rgba(62,58,52,0.05);
  --radius: 18px;
  color-scheme: light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211E1A;
    --bg-card:#2A2620;
    --ink:#F1EAD9;
    --ink-soft:#C9BFA9;
    --ink-faint:#938972;
    --border:#3C362C;
    --sage:#9DC896;
    --sage-ink:#DDF0D7;
    --sage-bg:#31402E;
    --lotus:#EDB2BE;
    --lotus-ink:#F7DEE2;
    --lotus-bg:#402B30;
    --saffron:#EFC46B;
    --saffron-ink:#F8E6BC;
    --saffron-bg:#453A22;
    --sky:#A4CBE3;
    --sky-ink:#DDEEF7;
    --sky-bg:#28384A;
    --shadow: 0 2px 14px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211E1A;
  --bg-card:#2A2620;
  --ink:#F1EAD9;
  --ink-soft:#C9BFA9;
  --ink-faint:#938972;
  --border:#3C362C;
  --sage:#9DC896;
  --sage-ink:#DDF0D7;
  --sage-bg:#31402E;
  --lotus:#EDB2BE;
  --lotus-ink:#F7DEE2;
  --lotus-bg:#402B30;
  --saffron:#EFC46B;
  --saffron-ink:#F8E6BC;
  --saffron-bg:#453A22;
  --sky:#A4CBE3;
  --sky-ink:#DDEEF7;
  --sky-bg:#28384A;
  --shadow: 0 2px 14px rgba(0,0,0,0.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html{scroll-padding-top: calc(84px + env(safe-area-inset-top,0px));}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Be Vietnam Pro', -apple-system, 'Segoe UI', sans-serif;
  line-height:1.65;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{
  font-family:'Literata', Georgia, 'Times New Roman', serif;
  font-weight:600;
  line-height:1.28;
  margin:0 0 .5em 0;
  color:var(--ink);
}
a{color:var(--sage-ink);}
p{margin:0 0 1em 0;}
ul{margin:0 0 1em 0;padding-left:1.3em;}
li{margin-bottom:.5em;}
blockquote{
  margin:0 0 1em 0;
  padding:.7em 1.1em;
  border-left:3px solid var(--sage);
  background:var(--sage-bg);
  border-radius:0 10px 10px 0;
  font-style:italic;
  color:var(--ink-soft);
}
.container{max-width:720px;margin:0 auto;padding:0 18px;}

/* ---------- HEADER ---------- */
header.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{
  max-width:720px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.top-back-btn{
  display:none;align-items:center;gap:7px;flex-shrink:0;
  padding:8px 14px 8px 12px;border-radius:999px;border:1.5px solid var(--sage);
  background:var(--sage-bg);color:var(--sage-ink);
  cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;
}
.top-back-btn.show{display:flex;}
.top-back-btn:active{filter:brightness(0.97);}
.lang-toggle{
  margin-left:auto;display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0;
}
.lang-toggle button{
  border:none;background:transparent;padding:6px 12px;border-radius:999px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-faint);cursor:pointer;
  transition:background .2s, color .2s;
}
.lang-toggle button.active{background:var(--sage);color:#20331E;}
.progress-row{max-width:720px;margin:0 auto;padding:0 18px 12px 18px;display:flex;gap:8px;}
.progress-step{
  flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;
}
.progress-bar{height:6px;width:100%;border-radius:999px;background:var(--border);overflow:hidden;}
.progress-bar > span{display:block;height:100%;width:0%;background:var(--sage);border-radius:999px;transition:width .35s ease;}
.progress-label{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.01em;}
.progress-step.current .progress-label{color:var(--ink);}
.progress-step.done .progress-bar > span{background:var(--sage);}

main{padding-bottom: calc(104px + env(safe-area-inset-bottom,0px));}
main.container{padding:22px 18px calc(104px + env(safe-area-inset-bottom,0px)) 18px;}

/* ---------- HERO (stage read only) ---------- */
.hero{padding:6px 0 22px 0;}
.hero h1{font-size:26px;letter-spacing:-0.01em;}
.hero .subtitle{color:var(--ink-soft);font-size:15.5px;margin-top:2px;}

/* ---------- 3-STEP GUIDE ---------- */
.steps-guide{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  margin:18px 0 22px 0;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
}
.steps-guide-title{width:100%;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;}
.step-chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12.5px;font-weight:700;flex:0 0 auto;white-space:nowrap;}
.step-chip .step-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0;}
.step-chip.s1{background:var(--sage-bg);color:var(--sage-ink);}
.step-chip.s1 .step-num{background:var(--sage);color:#20331E;}
.step-chip.s2{background:var(--lotus-bg);color:var(--lotus-ink);}
.step-chip.s2 .step-num{background:var(--lotus);color:#4A1F27;}
.step-chip.s3{background:var(--saffron-bg);color:var(--saffron-ink);}
.step-chip.s3 .step-num{background:var(--saffron);color:#4A3A10;}
.step-arrow{color:var(--ink-faint);flex-shrink:0;font-size:14px;}
@media (max-width:480px){
  .steps-guide{flex-direction:column;align-items:stretch;}
  .step-chip{width:100%;}
  .step-arrow{align-self:center;transform:rotate(90deg);}
}

/* ---------- ACCORDION SECTIONS ---------- */
.section-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  border-left:5px solid var(--accent, var(--sage));
}
.section-head{
  width:100%;
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;
  background:transparent;
  border:none;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  color:var(--ink);
}
.section-head .num{
  flex-shrink:0;
  width:30px;height:30px;border-radius:50%;
  background:var(--accent-bg, var(--sage-bg));
  color:var(--accent-ink, var(--sage-ink));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;font-family:'Literata',serif;
}
.section-head .num.check{background:var(--sage);color:#20331E;}
.section-head .htitle{flex:1;font-family:'Literata',serif;font-weight:600;font-size:17px;min-width:0;}
.section-head .chev{flex-shrink:0;transition:transform .25s ease;color:var(--ink-faint);}
.section-card.open .chev{transform:rotate(180deg);}
.section-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}
.section-card.open .section-body{max-height:none;}
.section-body-inner{padding:0 18px 20px 18px;font-size:15.5px;color:var(--ink-soft);}
.section-body-inner h4{font-size:16.5px;color:var(--ink);margin-top:1.1em;}
.section-body-inner h5{font-size:15px;color:var(--ink);margin-top:1em;}
.section-body-inner strong{color:var(--ink);}
.section-body-inner .callout{
  background:var(--saffron-bg);border:1px solid var(--saffron);border-radius:12px;padding:12px 14px;margin:0 0 1em 0;
  font-size:14.5px;
}
.section-body-inner .callout strong{color:var(--saffron-ink);}
.collapse-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:18px;
  padding:10px 14px;border-radius:12px;border:1px dashed var(--border);background:transparent;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-faint);cursor:pointer;
}
.collapse-btn:hover{color:var(--ink-soft);border-color:var(--ink-faint);}
.thinker{border-top:1px dashed var(--border);padding-top:14px;margin-top:14px;}
.thinker:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.thinker h4{margin-bottom:.4em;}
.thinker .meta{font-weight:400;color:var(--ink-faint);font-size:.85em;}
.thinker .critique{background:var(--lotus-bg);border-radius:10px;padding:10px 12px;font-size:14px;}
.thinker .critique strong{color:var(--lotus-ink);}

/* ---------- MINI ACCORDION (nested, inside Part 3) ---------- */
.mini-acc{
  border:1px solid var(--border);
  border-radius:14px;
  margin:14px 0;
  background:color-mix(in srgb, var(--bg-card) 60%, var(--bg) 40%);
  overflow:hidden;
}
.mini-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:transparent;border:none;cursor:pointer;text-align:left;
  font-family:'Literata',serif;font-weight:600;font-size:15px;color:var(--ink);
}
.mini-chev{flex-shrink:0;color:var(--ink-faint);transition:transform .25s ease;}
.mini-acc.open > .mini-head .mini-chev{transform:rotate(180deg);}
.mini-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
.mini-acc.open > .mini-body{max-height:none;}
.mini-body-inner{padding:0 14px 14px 14px;font-size:15px;}
.mini-acc .mini-acc{background:transparent;border-color:var(--border);}
.mini-acc .mini-acc .mini-head{font-size:14.5px;font-weight:600;}

/* ---------- TIMELINE ---------- */
.timeline-wrap{margin:18px 0 22px 0;padding:16px 14px 14px 14px;background:var(--sky-bg);border-radius:16px;border:1px solid var(--sky);}
.timeline-title{font-size:12.5px;font-weight:700;color:var(--sky-ink);text-transform:uppercase;letter-spacing:.02em;margin-bottom:12px;}
.timeline-track{display:flex;overflow-x:auto;gap:0;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.timeline-node{flex:0 0 auto;width:132px;display:flex;flex-direction:column;align-items:flex-start;position:relative;padding-right:14px;cursor:pointer;background:none;border:none;text-align:left;font-family:inherit;}
.timeline-node .tl-line{position:absolute;top:7px;left:0;width:100%;height:2px;background:var(--sky);}
.timeline-node:last-child .tl-line{width:0;}
.timeline-node .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--sky-ink);border:3px solid var(--sky-bg);position:relative;z-index:2;margin-bottom:8px;}
.timeline-node .tl-year{font-size:11.5px;font-weight:700;color:var(--sky-ink);}
.timeline-node .tl-name{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:1px;line-height:1.25;}
.timeline-node .tl-idea{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}

/* ---------- BACK TO TOP (flash/quiz) ---------- */
.back-top-row{display:flex;justify-content:flex-start;margin-bottom:10px;}
.back-top-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;
}

.table-wrap{overflow-x:auto;margin-bottom:1em;-webkit-overflow-scrolling:touch;}
table.glossary{border-collapse:collapse;width:100%;min-width:0;font-size:14px;}
table.glossary th{
  text-align:left;background:var(--sage-bg);color:var(--sage-ink);
  padding:9px 10px;font-family:'Literata',serif;font-weight:600;font-size:13px;
  position:sticky;top:0;
}
table.glossary td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:top;}
table.glossary tr:nth-child(odd){background:color-mix(in srgb, var(--bg-card) 60%, var(--bg) 40%);}

ul.refs{padding-left:1.1em;font-size:14.5px;color:var(--ink-soft);}
ul.refs li{margin-bottom:.65em;}

.fn-ref{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;
  background:var(--sky-bg);color:var(--sky-ink);
  font-size:10.5px;font-weight:700;border:1px solid var(--sky);
  cursor:pointer;vertical-align:super;margin:0 1px;
  font-family:'Be Vietnam Pro',sans-serif;padding:0;
}

/* ---------- CONTINUE BAR ---------- */
.continue-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)) 18px;
}
.continue-bar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.continue-status{font-size:13px;color:var(--ink-faint);font-weight:600;}
.btn{
  border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;
  font-family:'Be Vietnam Pro',sans-serif;cursor:pointer;
  background:var(--sage);color:#20331E;
  transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  box-shadow:0 4px 14px rgba(143,185,136,.35);
}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:not(:disabled):active{transform:scale(.97);}
.btn.secondary{background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--border);}

/* ---------- MODAL (footnotes) ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(30,26,20,.45);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-backdrop.show{opacity:1;pointer-events:auto;}
.modal-sheet{
  background:var(--bg-card);border-radius:20px 20px 0 0;max-width:560px;width:100%;
  padding:20px 22px calc(22px + env(safe-area-inset-bottom,0px)) 22px;
  transform:translateY(20px);transition:transform .25s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.15);
  max-height:70vh;overflow-y:auto;
}
.modal-backdrop.show .modal-sheet{transform:translateY(0);}
@media (min-width:640px){
  .modal-backdrop{align-items:center;}
  .modal-sheet{border-radius:20px;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.modal-head .tag{font-size:12px;font-weight:700;color:var(--sky-ink);background:var(--sky-bg);padding:3px 9px;border-radius:999px;}
.modal-close{background:var(--border);border:none;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink);}
.modal-body{font-size:15px;color:var(--ink-soft);}

/* ---------- FLASHCARDS ---------- */
.stage-panel{min-height:50vh;}
.flash-wrap{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.flash-scene{width:100%;max-width:480px;height:clamp(200px, 40vh, 340px);perspective:1700px;margin-bottom:16px;}
.flash-counter{font-size:13px;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}

.flash-card{
  position:relative;width:100%;height:100%;cursor:pointer;
  transform-style:preserve-3d;
}
.flash-card.flipped{transform:rotateY(180deg);}
@keyframes flipToBack{
  0%{transform:rotateY(0deg) scale(1);}
  45%{transform:rotateY(100deg) scale(1.07);}
  100%{transform:rotateY(180deg) scale(1);}
}
@keyframes flipToFront{
  0%{transform:rotateY(180deg) scale(1);}
  45%{transform:rotateY(80deg) scale(1.07);}
  100%{transform:rotateY(0deg) scale(1);}
}
.flash-card.flip-to-back{animation:flipToBack .58s cubic-bezier(.3,.1,.3,1) both;}
.flash-card.flip-to-front{animation:flipToFront .58s cubic-bezier(.3,.1,.3,1) both;}
.flash-card:active{filter:brightness(0.98);}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;padding:26px;box-shadow:0 10px 26px rgba(62,58,52,.12), 0 2px 8px rgba(62,58,52,.06);border:1px solid var(--border);
  overflow-y:auto;
}
.flash-face-content{margin:auto 0;width:100%;}
.flash-face.front{background:var(--bg-card);}
.flash-face.back{background:var(--accent-bg, var(--sage-bg));border-color:var(--accent, var(--sage));transform:rotateY(180deg);}
.flash-face::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:28px;border-radius:0 0 20px 20px;pointer-events:none;
  background:linear-gradient(to bottom, transparent, var(--bg-card));
}
.flash-face.back::after{background:linear-gradient(to bottom, transparent, var(--accent-bg, var(--sage-bg)));}
.flash-face .kicker{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-faint);margin-bottom:14px;}
.flash-face.back .kicker{color:var(--accent-ink, var(--sage-ink));opacity:.75;}
.flash-face .term{font-family:'Literata',serif;font-size:22px;font-weight:600;color:var(--ink);}
.flash-face .term-repeat{font-family:'Literata',serif;font-size:18px;font-weight:700;color:var(--accent-ink, var(--sage-ink));margin-bottom:10px;}
.flash-face .def{font-size:18px;font-weight:600;color:var(--accent-ink, var(--sage-ink));line-height:1.6;}
.flash-face .tap-hint{display:block;margin-top:18px;font-size:12px;color:var(--ink-faint);}
.flash-nav{display:flex;align-items:center;gap:16px;}
.flash-dot-row{display:flex;gap:5px;flex-wrap:wrap;max-width:280px;justify-content:center;margin-top:12px;}
.flash-dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
.flash-dot.seen{background:var(--sage);}
.flash-dot.current{background:var(--lotus);}
.iconbtn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
}
.iconbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- QUIZ ---------- */
.quiz-progress{font-size:13px;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}
.quiz-q{font-family:'Literata',serif;font-size:19px;font-weight:600;margin-bottom:16px;}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.quiz-option{
  text-align:left;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--bg-card);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
  transition:border-color .15s, background .15s;
}
.quiz-option.selected{border-color:var(--sage);background:var(--sage-bg);}
.quiz-option.correct{border-color:var(--sage);background:var(--sage-bg);}
.quiz-option.wrong{border-color:var(--lotus);background:var(--lotus-bg);}
.quiz-explain{
  background:var(--sky-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--sky-ink);margin-bottom:14px;
}
.quiz-dot-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.quiz-dot{width:26px;height:26px;border-radius:8px;background:var(--border);border:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-faint);font-family:inherit;cursor:pointer;}
.quiz-dot.answered{background:var(--sage-bg);color:var(--sage-ink);}
.quiz-dot.current{outline:2px solid var(--sage);outline-offset:1px;}
.quiz-retry-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px dashed var(--border);border-radius:999px;
  padding:8px 14px;font-family:inherit;font-weight:700;font-size:12.5px;color:var(--ink-faint);
  cursor:pointer;margin-bottom:16px;
}
.retake-btn{margin-top:18px;background:var(--saffron);color:#4A3A10;box-shadow:0 4px 14px rgba(231,186,83,.35);display:inline-flex;align-items:center;gap:7px;}


/* ---------- SECTION SUMMARY (v2) ---------- */
.summary-bar{padding:0 18px 12px 18px;display:flex;}
.summary-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;border:1.5px solid var(--saffron);
  background:var(--saffron-bg);color:var(--saffron-ink);
  font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
}
.summary-btn:active{filter:brightness(.97);}
.summary-btn .sb-chev{transition:transform .2s ease;}
.summary-btn.on .sb-chev{transform:rotate(180deg);}
.summary-panel{
  margin:0 18px 14px 18px;padding:14px 16px;border-radius:14px;
  background:var(--saffron-bg);border:1px solid var(--saffron);
  font-size:15px;color:var(--saffron-ink);line-height:1.65;
}
.summary-panel .sp-tag{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;opacity:.8;margin-bottom:6px;display:block;}
.summary-panel p:last-of-type,.summary-panel ul:last-of-type{margin-bottom:.4em;}
.summary-panel strong{color:var(--ink);}
.summary-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.summary-actions button{
  padding:6px 12px;border-radius:999px;border:1px solid var(--saffron);background:transparent;
  color:var(--saffron-ink);font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;
}

/* ---------- QUIZ LEVEL PICKER (v2) ---------- */
.level-intro{font-family:'Literata',serif;font-size:20px;font-weight:600;margin:4px 0 6px 0;}
.level-sub{font-size:14px;color:var(--ink-soft);margin-bottom:16px;}
.level-card{
  display:block;width:100%;text-align:left;margin-bottom:12px;padding:16px 18px;border-radius:16px;
  border:1.5px solid var(--lvl, var(--sage));background:var(--lvl-bg, var(--sage-bg));color:var(--lvl-ink, var(--sage-ink));
  font-family:inherit;cursor:pointer;
}
.level-card:disabled{opacity:.6;cursor:not-allowed;border-style:dashed;}
.level-card:not(:disabled):active{transform:scale(.99);}
.level-card .lv-name{font-family:'Literata',serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.level-card .lv-meta{font-size:13px;font-weight:600;margin-top:4px;opacity:.85;}
.level-card .lv-desc{font-size:14px;margin-top:6px;color:var(--ink-soft);}
.level-chip{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;margin-bottom:10px;
  background:var(--lvl-bg, var(--sage-bg));color:var(--lvl-ink, var(--sage-ink));border:1px solid var(--lvl, var(--sage));
}
.lvl-medium{--lvl:var(--sage);--lvl-bg:var(--sage-bg);--lvl-ink:var(--sage-ink);}
.lvl-advanced{--lvl:var(--lotus);--lvl-bg:var(--lotus-bg);--lvl-ink:var(--lotus-ink);}
.shuffle-note{font-size:12.5px;color:var(--ink-faint);margin-top:6px;display:flex;align-items:center;gap:6px;}
.results-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px;}
.results-actions .btn{margin-top:0;}
.btn.lotus{background:var(--lotus);color:#4A1F27;box-shadow:0 4px 14px rgba(232,163,176,.35);}

/* ---------- RESULTS ---------- */
.results{text-align:center;padding:20px 0 10px 0;}
.results .big-emoji{font-size:56px;display:block;margin-bottom:6px;}
.results h2{font-size:22px;}
.results .score{font-family:'Literata',serif;font-size:40px;font-weight:700;color:var(--sage-ink);margin:6px 0 2px 0;}
.results .congrats{
  margin-top:16px;background:var(--saffron-bg);border:1px solid var(--saffron);border-radius:16px;
  padding:18px 20px;font-size:16px;font-weight:600;color:var(--saffron-ink);line-height:1.5;
}
.results .review-title{margin-top:26px;font-family:'Literata',serif;font-size:16px;text-align:left;}
.review-item{text-align:left;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px;}
.review-item .q{font-weight:700;margin-bottom:4px;}
.review-item .a-correct{color:var(--sage-ink);}
.review-item .a-wrong{color:var(--lotus-ink);}

/* ---------- CONFETTI & FIREWORKS ---------- */
.confetti-piece{
  position:fixed;top:-20px;z-index:200;border-radius:2px;pointer-events:none;
  animation:confetti-fall linear forwards;
}
@keyframes confetti-fall{
  to{transform:translateY(110vh) rotate(var(--rot));opacity:.9;}
}
.spark{
  position:fixed;z-index:201;border-radius:50%;pointer-events:none;
  animation:spark-burst ease-out forwards;
}
@keyframes spark-burst{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}
}
.results .big-emoji{animation:emoji-pop .6s cubic-bezier(.2,1.4,.4,1);}
@keyframes emoji-pop{
  0%{transform:scale(0.3);opacity:0;}
  60%{transform:scale(1.15);opacity:1;}
  100%{transform:scale(1);}
}

  .hero h1{font-size:22px;}
}

<script id="artifact-data" type="application/json">{"meta": {"title": {"vi": "CHÁNH NIỆM TỈNH THỨC", "en": "MINDFUL AWARENESS (CHÁNH NIỆM TỈNH THỨC)"}, "kicker": {"vi": "GĐPT · Tài liệu tu học Bậc Trì", "en": "GĐPT · Study Document, Trì Level"}, "subtitle": {"vi": "", "en": ""}}, "sections": [{"id": "s1", "title": {"vi": "CHÁNH NIỆM TỈNH THỨC LÀ GÌ?", "en": "WHAT IS MINDFUL AWARENESS?"}, "html": {"vi": "<p>Chúng ta đang trò chuyện với một người bạn thì điện thoại rung. Chúng ta liếc xuống màn hình, và vài phút sau nhận ra mình chưa nghe được câu nào. Chánh niệm là khả năng nhận ra khoảnh khắc “bị kéo đi” ấy, rồi nhẹ nhàng quay về.</p><div class=\"mini-acc\" data-mid=\"s1-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1.1. Định nghĩa theo Phật học</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Trong giáo lý Phật giáo, <strong>chánh niệm</strong> (Pāli: <em>sammā-sati</em>; tiếng Anh: <em>mindfulness</em>) là chi phần thứ bảy của <strong>Bát Chánh Đạo</strong> – con đường gồm tám chi phần dẫn đến sự chấm dứt khổ đau.</p><ul><li><strong>Chánh</strong> (<em>sammā</em>): đúng đắn, chân chính, không lệch lạc, hướng đến điều lành và sự giải thoát khỏi khổ.</li><li><strong>Niệm</strong> (<em>sati</em>): ghi nhớ, nhận biết, chú ý đến điều đang diễn ra ngay lúc này.</li></ul><p><strong>Chánh niệm</strong> là biết rõ điều đang diễn ra ở bốn phần: <strong>Thân</strong> (cơ thể), <strong>Thọ</strong> (cảm giác dễ chịu, khó chịu hoặc trung tính), <strong>Tâm</strong> (trạng thái của tâm lúc này: có tham, sân, si, tán loạn hay có định) và <strong>Pháp</strong> (những gì hiện ra trong tâm như ký ức, ý nghĩ, hình ảnh, và các yếu tố nảy sinh từ đó như buồn ngủ, bồn chồn, hoài nghi).</p><p><strong>Lưu ý:</strong> chữ “Chánh” cho thấy chánh niệm không chỉ là nhận biết mọi việc đang diễn ra, mà còn thấy rõ điều gì là thiện, điều gì là bất thiện để nuôi dưỡng điều thiện, tránh xa điều bất thiện. Đồng thời, chúng ta không vội trách mình hay phán xét người, mà bình tĩnh nhìn nhận để hiểu và điều chỉnh hành động của mình.</p><p><strong>Tỉnh giác</strong> (<em>sampajañña</em>) là biết rõ việc mình đang làm. Kinh Niệm Xứ dùng cụm này cho mọi hoạt động: “khi bước tới bước lui, biết rõ việc mình đang làm”. Theo chú giải, tỉnh giác còn gồm biết việc ấy có mục đích và có phù hợp hay không. Kinh thường nêu ba phẩm chất đi cùng nhau: “nhiệt tâm, tỉnh giác, chánh niệm”.</p><p><strong>Định nghĩa tổng quát:</strong> trong bài này, chúng ta gọi chung chánh niệm và tỉnh giác là <strong>chánh niệm tỉnh thức</strong>, gọi tắt là <strong>chánh niệm</strong>: biết rõ, trọn vẹn và sáng suốt những gì đang xảy ra trong ta và quanh ta ngay lúc này, với thái độ khách quan và không vội phán xét.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s1-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1.2. Giải thích bằng hình ảnh thực tế</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Hãy tưởng tượng tâm của chúng ta như mặt hồ. Khi căng thẳng, tức giận hay lo lắng vì thi cử, công việc, tâm xáo động như mặt hồ nổi sóng, nước gợn đục, nên chúng ta khó nhìn rõ sự việc. Chánh niệm giúp chúng ta nhận biết cảm xúc và suy nghĩ đang diễn ra thay vì vội phản ứng theo chúng. Khi biết dừng lại và bình tĩnh quan sát, tâm dần lắng dịu như nước hồ trong lại; nhờ đó chúng ta thấy rõ vấn đề và ứng xử phù hợp hơn.</p></div></div></div>", "en": "<p>We’re chatting with a friend when our phone buzzes. We glance at the screen, and a few minutes later realize we haven’t heard a single sentence. Mindfulness (chánh niệm) is the ability to notice that moment of being “pulled away,” then gently return.</p><div class=\"mini-acc\" data-mid=\"s1-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1.1. The Buddhist Definition</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>In Buddhist teachings, <strong>Right Mindfulness</strong> (Pāli: <em>sammā-sati</em>) is the seventh factor of the <strong>Noble Eightfold Path</strong> (Bát Chánh Đạo), the path of eight factors leading to the end of suffering (khổ đau).</p><ul><li><strong>Right</strong> (chánh; <em>sammā</em>): correct, genuine, not distorted, aimed at the wholesome and at liberation (giải thoát) from suffering.</li><li><strong>Mindfulness</strong> (niệm; <em>sati</em>): keeping in mind, recognizing, attending to what is happening right now.</li></ul><p><strong>Mindfulness</strong> is knowing clearly what is happening in four areas: <strong>Body</strong> (thân), <strong>Feelings</strong> (thọ: pleasant, unpleasant, or neutral sensations), <strong>Mind</strong> (tâm: the state of the mind right now, whether it has greed, hatred, or delusion [tham, sân, si], is scattered, or is concentrated [định]) and <strong>Mental phenomena</strong> (pháp: what appears in the mind, such as memories, thoughts, images, and the factors arising from them, such as drowsiness, restlessness, doubt).</p><p><strong>Note:</strong> “Right” shows that mindfulness is not only knowing everything that is happening, but also seeing clearly what is wholesome (thiện) and unwholesome (bất thiện), to nurture the former and avoid the latter. At the same time, we don’t rush to blame ourselves or judge others, but observe calmly to understand and adjust our actions.</p><p><strong>Clear comprehension</strong> (tỉnh giác; <em>sampajañña</em>) is knowing clearly what one is doing. The Foundations of Mindfulness Sutta (Kinh Niệm Xứ) applies it to every activity: “when stepping forward or back, knowing clearly what one is doing.” The commentaries add knowing whether the activity has a purpose and is suitable. The suttas often name three qualities together: “ardent (nhiệt tâm), clearly comprehending, mindful.”</p><p><strong>General definition:</strong> in this lesson, mindfulness and clear comprehension together are called <strong>mindful awareness</strong>, or <strong>mindfulness</strong> for short: knowing clearly, fully, and wisely what is happening within and around us right now, objectively and without rushing to judge.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s1-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1.2. Explained Through a Real-Life Image</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Imagine our mind as the surface of a lake. When we are stressed, angry, or worried about exams or work, the mind churns like a choppy lake, with rippling, cloudy water, and we can hardly see clearly. Mindfulness helps us notice the emotions and thoughts arising instead of reacting to them right away. When we pause and observe calmly, the mind gradually settles like lake water clearing, and so we see the problem clearly and respond more appropriately.</p></div></div></div>"}, "summary": {"vi": "<ul><li>Chánh (sammā): đúng đắn, chân chính, không lệch lạc, hướng đến điều lành và sự giải thoát khỏi khổ.</li><li>Niệm (sati): ghi nhớ, nhận biết, chú ý đến điều đang diễn ra ngay lúc này.</li><li>Chánh niệm là biết rõ điều đang diễn ra ở bốn phần: Thân, Thọ, Tâm, Pháp.</li><li>“Chánh” còn là thấy rõ thiện – bất thiện, không vội trách mình hay phán xét người.</li><li>Tỉnh giác (sampajañña) là biết rõ việc mình đang làm; cùng chánh niệm, gọi chung là chánh niệm tỉnh thức.</li><li>Như mặt hồ lắng trong, tâm bình tĩnh thì thấy rõ vấn đề và ứng xử phù hợp hơn.</li></ul>", "en": "<ul><li>Right (chánh; sammā): correct, genuine, not distorted, aimed at the wholesome and at liberation (giải thoát) from suffering.</li><li>Mindfulness (niệm; sati): keeping in mind, recognizing, attending to what is happening right now.</li><li>Mindfulness is knowing clearly what is happening in four areas: Body, Feelings, Mind, and Mental phenomena.</li><li>“Right” also means seeing what is wholesome and unwholesome, without rushing to blame ourselves or judge others.</li><li>Clear comprehension (tỉnh giác; sampajañña) is knowing clearly what one is doing; together they are called mindful awareness.</li><li>Like lake water settling, a calm mind sees the problem clearly and responds more appropriately.</li></ul>"}}, {"id": "s2", "title": {"vi": "TẠI SAO CẦN HỌC VỀ CHÁNH NIỆM TỈNH THỨC?", "en": "WHY SHOULD WE LEARN ABOUT MINDFUL AWARENESS?"}, "html": {"vi": "<p>Màn hình, thông báo, so sánh với bạn bè trên mạng, bài vở và công việc… luôn kéo sự chú ý của chúng ta đi nơi khác. Nếu không nhận ra, chúng ta dễ sống theo thói quen như người máy và quên mất mình thật sự đang cần gì.</p><div class=\"mini-acc\" data-mid=\"s2-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2.1. Tâm chạy lung tung: “tâm viên, ý mã”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Truyền thống Phật giáo thường dùng hình ảnh <strong>“tâm viên, ý mã”</strong> để nói về tâm không yên: tâm nhảy như con khỉ, ý chạy như con ngựa. Trong kinh <em>Assutavā</em> (SN 12.61), Đức Phật cũng ví tâm như con khỉ leo trong rừng, buông cành này rồi nắm cành khác. Tâm lý học hiện đại gọi hiện tượng gần giống là <em>mind wandering</em> (tâm đi lang thang).</p><ul><li><strong>Quá khứ:</strong> tâm hay hối tiếc, dằn vặt về những sai lầm đã qua.</li><li><strong>Tương lai:</strong> tâm hay lo lắng, sợ hãi về những điều chưa tới.</li></ul><p>Khi tâm không ở hiện tại, chúng ta dễ nghĩ quá nhiều (<em>overthinking</em>) và lo âu.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s2-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2.2. Tứ Diệu Đế soi vào đời sống người trẻ</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Tứ Diệu Đế đã được học đầy đủ, nên ở đây chúng ta không nhắc lại lý thuyết, mà dùng bốn sự thật ấy để soi vào những vấn đề của chúng ta hôm nay:</p><ol><li><strong>Khổ</strong> (<em>dukkha</em>): Những bất an người trẻ thường gặp hôm nay: bị điện thoại và mạng xã hội làm xao nhãng; tự ti khi so sánh mình với hình ảnh đẹp đẽ, thành công của người khác trên mạng; áp lực học tập, công việc và kỳ vọng của bạn bè; cô đơn dù kết nối với nhiều người qua mạng; hoặc không biết mình muốn gì, nên đi theo hướng nào.</li><li><strong>Tập</strong> (<em>samudaya</em>): Khổ ấy được nuôi bằng <strong>ái</strong> (<em>taṇhā</em>), trên nền <strong>vô minh</strong> (<em>avijjā</em>): chưa thấy rằng điều mình bám víu cũng đổi thay (vô thường), nên không thể làm mình thỏa mãn mãi mãi. Ái hiện ra ở ba dạng quen thuộc:<ul><li><strong>Dục ái</strong> (<em>kāma-taṇhā</em>): luôn muốn thêm cái mới kích thích, như thêm một video, thêm một thông báo, xe mới, iPhone mới…</li><li><strong>Hữu ái</strong> (<em>bhava-taṇhā</em>): muốn trở thành và được công nhận, như số lượt thích trên mạng, hình ảnh hoàn hảo, thành tích…</li><li><strong>Vô hữu ái</strong> (<em>vibhava-taṇhā</em>): muốn trốn khỏi điều khó chịu, như mở màn hình để thoát buồn chán, trống rỗng, lo âu, cô đơn…</li></ul></li><li><strong>Diệt</strong> (<em>nirodha</em>): khổ đau không phải là trạng thái mãi mãi. Khi hiểu nguyên nhân của khổ và buông bỏ tham ái, bám víu, tâm dần được tự do, an ổn; sự chấm dứt hoàn toàn khổ đau là Niết-bàn. Ngay trên đường tu học, chúng ta đã có thể cảm nhận sự bình an trong từng việc nhỏ, như  thưởng thức một bữa cơm hay trò chuyện với người thân, bạn bè mà không nhìn vào điện thoại hay suy nghĩ đến chuyện khác.</li><li><strong>Đạo</strong> (<em>magga</em>): con đường là <strong>Bát Chánh Đạo</strong> (thuộc 37 phẩm trợ đạo), trong đó có <strong>chánh niệm</strong> – chủ đề của bài này.</li></ol></div></div></div>", "en": "<p>Screens, notifications, comparing ourselves with friends online, schoolwork and work… constantly pull our attention elsewhere. If we don’t notice this, we easily live by habit, like robots, and forget what we really need.</p><div class=\"mini-acc\" data-mid=\"s2-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2.1. The Mind Running Wild: “Monkey Mind, Horse Thought” (tâm viên, ý mã)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Buddhist tradition often calls a restless mind <strong>“monkey mind, horse thought”</strong>: the mind leaps like a monkey, thought races like a horse. In the <em>Assutavā</em> Sutta (SN 12.61), the Buddha also compares the mind to a monkey climbing through a forest, releasing one branch and grabbing another. Modern psychology calls a similar phenomenon <em>mind wandering</em> (tâm đi lang thang).</p><ul><li><strong>The past:</strong> the mind often regrets and agonizes over past mistakes.</li><li><strong>The future:</strong> the mind often worries and fears what is yet to come.</li></ul><p>When the mind leaves the present, we easily fall into <em>overthinking</em> (nghĩ quá nhiều) and anxiety.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s2-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2.2. Looking at Young People’s Lives Through the Four Noble Truths (Tứ Diệu Đế)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>The Four Noble Truths have been studied in full, so here we skip the theory and use these four truths to illuminate our problems today:</p><ol><li><strong>Suffering</strong> (khổ; <em>dukkha</em>): The unease young people often face today: distraction by phones and social media; feeling inferior when comparing themselves with others’ attractive, successful online images; pressure from studies, work, and friends’ expectations; loneliness despite being connected online to many people; or not knowing what they want or which way to go.</li><li><strong>Origin</strong> (tập; <em>samudaya</em>): That suffering is fed by <strong>craving</strong> (ái; <em>taṇhā</em>), grounded in <strong>ignorance</strong> (vô minh; <em>avijjā</em>): not yet seeing that what we cling to also changes (impermanence, vô thường), so it can never satisfy us for good. Craving takes three familiar forms:<ul><li><strong>Craving for sensual pleasure</strong> (dục ái; <em>kāma-taṇhā</em>): always wanting something new and stimulating—another video, another notification, a new car, a new iPhone…</li><li><strong>Craving for becoming</strong> (hữu ái; <em>bhava-taṇhā</em>): wanting to become something and be recognized, such as online likes, a perfect image, achievements…</li><li><strong>Craving for non-becoming</strong> (vô hữu ái; <em>vibhava-taṇhā</em>): wanting to flee the unpleasant, such as opening a screen to escape boredom, emptiness, anxiety, loneliness…</li></ul></li><li><strong>Cessation</strong> (diệt; <em>nirodha</em>): suffering is not a permanent state. When we understand its cause and let go of craving and clinging, the mind gradually becomes free and at peace; the complete end of suffering is Nirvana (Niết-bàn). Even on the path of study and practice, we can already feel peace in small things, such as enjoying a meal or talking with family and friends without looking at our phones or thinking of something else.</li><li><strong>Path</strong> (đạo; <em>magga</em>): the <strong>Noble Eightfold Path</strong> (part of the 37 aids to awakening, 37 phẩm trợ đạo), including <strong>mindfulness</strong>—this lesson’s subject.</li></ol></div></div></div>"}, "summary": {"vi": "<ul><li>Màn hình, thông báo, so sánh với bạn bè trên mạng kéo ta đi nơi khác; ta dễ sống như người máy và quên mình thật sự cần gì.</li><li>“Tâm viên, ý mã”: tâm nhảy như khỉ, ý chạy như ngựa; hối tiếc quá khứ, lo lắng tương lai, nên dễ nghĩ quá nhiều và lo âu.</li><li>Tứ Diệu Đế soi vào đời sống người trẻ:<ul class=\"dash\"><li><strong>Khổ</strong>: xao nhãng vì điện thoại, tự ti khi so sánh, áp lực, cô đơn, không biết mình muốn gì.</li><li><strong>Tập</strong>: khổ được nuôi bằng ái trên nền vô minh, qua ba dạng: dục ái (muốn thêm), hữu ái (muốn được công nhận), vô hữu ái (muốn trốn điều khó chịu).</li><li><strong>Diệt</strong>: hiểu nguyên nhân của khổ và buông bỏ tham ái, bám víu thì tâm dần tự do, an ổn; chấm dứt hoàn toàn khổ đau là Niết-bàn.</li><li><strong>Đạo</strong>: con đường chấm dứt khổ là Bát Chánh Đạo gồm 8 chi phần, trong đó có chánh niệm.</li></ul></li></ul>", "en": "<ul><li>Screens, notifications, and comparing ourselves with friends online pull our attention away; we easily live by habit, like robots, and forget what we really need.</li><li>“Monkey mind, horse thought” (tâm viên, ý mã): the mind leaps like a monkey, thought races like a horse; regret over the past and worry about the future lead to overthinking and anxiety.</li><li>The Four Noble Truths (Tứ Diệu Đế) light up young people’s lives:<ul class=\"dash\"><li><strong>Suffering (khổ)</strong>: distraction by phones, feeling inferior when comparing, pressure, loneliness, not knowing what we want.</li><li><strong>Origin (tập)</strong>: suffering is fed by craving (ái) grounded in ignorance (vô minh), in three forms: sensual pleasure (dục ái), becoming (hữu ái), non-becoming (vô hữu ái).</li><li><strong>Cessation (diệt)</strong>: understanding the cause and letting go of craving and clinging, the mind gradually becomes free and at peace; the complete end of suffering is Nirvana (Niết-bàn).</li><li><strong>Path (đạo)</strong>: the way to the end of suffering is the Noble Eightfold Path (Bát Chánh Đạo) of eight factors, which includes mindfulness.</li></ul></li></ul>"}}, {"id": "s3", "title": {"vi": "THỰC HÀNH CHÁNH NIỆM TỈNH THỨC NHƯ THẾ NÀO?", "en": "HOW DO WE PRACTICE MINDFUL AWARENESS?"}, "html": {"vi": "<p>Để chánh niệm không chỉ là lý thuyết, Phật giáo có nhiều phương pháp rèn luyện cụ thể. Nền tảng là kinh <strong>Niệm Xứ</strong> (<em>Satipaṭṭhāna Sutta</em>, MN 10), dạy bốn nơi để an trú chánh niệm:</p><div class=\"table-wrap\"><table class=\"glossary pairs\"><tr><td><strong>1. Quán Thân</strong></td><td><strong>2. Quán Thọ</strong></td><td><strong>3. Quán Tâm</strong></td><td><strong>4. Quán Pháp</strong></td></tr><tr><td>(Nhận biết cơ thể)</td><td>(Nhận biết cảm giác)</td><td>(Nhận biết trạng thái của tâm)</td><td>(Nhận biết điều hiện ra trong tâm và yếu tố nảy sinh từ đó)</td></tr></table></div><p>Chúng ta hãy lấy một ví dụ để minh họa cho việc quán niệm: có người nói lời xúc phạm chúng ta. Lời nói ấy là điều kiện (duyên). Điều chúng ta quán là những gì đang diễn ra trong mình:</p><ul><li><strong>Quán Thân:</strong> ngực nóng, vai căng, tim đập nhanh.</li><li><strong>Quán Thọ:</strong> cảm giác khó chịu.</li><li><strong>Quán Tâm:</strong> gọi tên trạng thái của tâm: “Tâm có sân.”</li><li><strong>Quán Pháp:</strong> ý nghĩ “họ xúc phạm mình” hiện ra; sân hận (một triền cái) có mặt. Chúng ta biết lúc nó sinh khởi và khi nó được đoạn diệt.</li></ul><div class=\"callout\" id=\"luu-y-quan-phap\"><p><strong>Lưu ý:</strong> Quán Pháp là phần quán chiếu sâu hơn, giúp nhận biết và hiểu rõ các hiện tượng tâm lý cũng như các yếu tố trên đường tu tập. Theo kinh Niệm Xứ, Quán Pháp gồm năm nhóm đối tượng:</p><ol><li>Năm triền cái: Ái dục, sân hận, hôn trầm – thụy miên, trạo hối và nghi. <button class=\"jump-btn\" onclick=\"jumpToAppendix(1)\">Xem giải thích ↓</button></li><li>Năm thủ uẩn: Sắc, thọ, tưởng, hành và thức. <button class=\"jump-btn\" onclick=\"jumpToAppendix(2)\">Xem giải thích ↓</button></li><li>Sáu nội ngoại xứ: Sáu căn (mắt, tai, mũi, lưỡi, thân, ý) và sáu trần (sắc, thanh, hương, vị, xúc, pháp). <button class=\"jump-btn\" onclick=\"jumpToAppendix(3)\">Xem giải thích ↓</button></li><li>Bảy giác chi: Niệm, trạch pháp, tinh tấn, hỷ, khinh an, định và xả. <button class=\"jump-btn\" onclick=\"jumpToAppendix(4)\">Xem giải thích ↓</button></li><li>Tứ Diệu Đế: Khổ, Tập, Diệt, Đạo.<br>(Giải thích từng thuật ngữ của bốn nhóm đầu ở phần Phụ lục, cuối tài liệu)</li></ol></div><p>Ba phương pháp sau là điểm khởi đầu: phương pháp 1 và 2 thuộc Quán Thân, phương pháp 3 bắt đầu Quán Thọ và Quán Tâm.</p><div class=\"mini-acc\" data-mid=\"s3-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.1. Phương pháp 1: Quán niệm hơi thở (Ānāpānasati)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Đây là một trong những pháp môn căn bản và phổ biến nhất, được Đức Phật dạy trong Kinh Niệm Xứ (MN 10) và Kinh Quán Niệm Hơi Thở (<em>Ānāpānasati</em>, MN 118). Hơi thở luôn có mặt trong hiện tại, nên rất dễ đặt sự chú ý vào đó.</p><ul><li><strong>Cách thực hiện:</strong><ol><li><strong>Tư thế:</strong> ngồi thẳng lưng, vai thả lỏng, hai mắt khép nhẹ hoặc nhìn xuống sàn trước mặt khoảng 1 mét. Kinh mô tả “ngồi kiết già, lưng thẳng”; người mới có thể ngồi ghế hoặc ngồi đệm cho thoải mái.</li><li><strong>Theo dõi:</strong> nhận biết khi hít vào (<em>“Tôi biết tôi đang hít vào”</em>), nhận biết khi thở ra (<em>“Tôi biết tôi đang thở ra”</em>). Cứ để hơi thở tự nhiên, không cần điều chỉnh.</li><li><strong>Khi bị xao nhãng:</strong> sẽ có suy nghĩ chen vào (ví dụ: <em>“Tối nay ăn gì?”</em>, <em>“Bài tập chưa xong”</em>). Điều này rất bình thường, không cần tự trách. Hãy nhận biết: <em>“À, tâm mình đang suy nghĩ”</em>, rồi nhẹ nhàng quay lại với hơi thở. Nghĩ quá nhiều là bị cuốn theo dòng suy nghĩ; chánh niệm là nhận ra “đang có một ý nghĩ” mà không đi theo nó. Mỗi lần nhận ra rồi quay về là một lần luyện chánh niệm.</li></ol></li></ul></div></div></div><div class=\"mini-acc\" data-mid=\"s3-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.2. Phương pháp 2: Chánh niệm trong hành động</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Chánh niệm không chỉ có khi ngồi thiền. Kinh dạy biết rõ việc mình đang làm trong mọi hoạt động: ăn, uống, nhai, nếm, đi, đứng, ngồi, ngủ, thức, nói, im lặng. Chúng ta có thể sống chánh niệm trong từng việc làm:</p><ul><li><strong>Khi ăn:</strong> cảm nhận hương vị, màu sắc, từng lần nhai, và không vừa ăn vừa lướt TikTok/YouTube.</li><li><strong>Khi đi (thiền hành):</strong> biết từng bước chân chạm đất. Chân trái bước – biết chân trái bước; chân phải bước – biết chân phải bước.</li><li><strong>Khi học và làm việc:</strong> làm từng việc một (<em>single-tasking</em>): học bài thì chỉ học bài, viết email thì chỉ viết email. Khi thấy tâm nghĩ sang chuyện khác hoặc bị xao nhãng, nhẹ nhàng đưa sự chú ý về việc đang làm, đồng thời nhận biết tâm mình lúc ấy đang chú tâm, lo lắng, mệt mỏi hay phân tán.</li></ul><p><strong>Điểm quan trọng:</strong> làm một việc giúp chúng ta tập trung làm tốt việc ấy; chánh niệm còn giúp chúng ta biết mình đang làm gì và tâm mình đang ở trạng thái nào.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s3-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.3. Phương pháp 3: Nhận biết cảm xúc bằng kỹ thuật S.T.O.P</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>S.T.O.P không có trong kinh, mà là công cụ của các chương trình chánh niệm hiện đại, giúp Quán Thọ và Quán Tâm lúc căng thẳng hay giận dữ:</p><ul><li><strong>S (Stop):</strong> dừng lại việc đang làm hoặc lời đang nói trong vài giây.</li><li><strong>T (Take a breath):</strong> hít một hơi thật sâu và thở ra chậm rãi.</li><li><strong>O (Observe):</strong> quan sát cơ thể (nóng, căng, tim đập nhanh) và trạng thái của tâm (“Tôi đang cảm thấy tức giận/lo lắng”).</li><li><strong>P (Proceed):</strong> tiếp tục hành động với sự sáng suốt, chọn cách ứng xử phù hợp thay vì phản ứng bộc phát.</li></ul></div></div></div>", "en": "<p>To make mindfulness more than theory, Buddhism has many concrete training methods. The basis is the <strong>Foundations of Mindfulness</strong> Sutta (<em>Satipaṭṭhāna Sutta</em>, MN 10), teaching four foundations for establishing mindfulness:</p><div class=\"table-wrap\"><table class=\"glossary pairs\"><tr><td><strong>1. Contemplation of the Body (Quán Thân)</strong></td><td><strong>2. Contemplation of Feelings (Quán Thọ)</strong></td><td><strong>3. Contemplation of the Mind (Quán Tâm)</strong></td><td><strong>4. Contemplation of Mental Phenomena (Quán Pháp)</strong></td></tr><tr><td>(Noticing the body)</td><td>(Noticing feelings)</td><td>(Noticing the mind’s state)</td><td>(Noticing what appears in the mind and the factors arising from it)</td></tr></table></div><p>Let’s illustrate the practice of contemplation with an example: someone says something insulting to us. Those words are a condition (duyên). What we contemplate is what is happening within us:</p><ul><li><strong>Contemplation of the Body:</strong> chest hot, shoulders tense, heart racing.</li><li><strong>Contemplation of Feelings:</strong> an unpleasant feeling.</li><li><strong>Contemplation of the Mind:</strong> naming its state: “Hatred is in the mind.”</li><li><strong>Contemplation of Mental Phenomena:</strong> the thought “they insulted me” arises; ill will (sân hận), a hindrance (triền cái), is present. We know when it arises and when it is abandoned.</li></ul><div class=\"callout\" id=\"luu-y-quan-phap\"><p><strong>Note:</strong> Contemplation of Mental Phenomena is a deeper contemplation (quán chiếu), helping to recognize and understand psychological phenomena and the factors along the path of practice. According to the Foundations of Mindfulness Sutta, it covers five groups of objects:</p><ol><li>Five Hindrances: sensual desire (ái dục), ill will (sân hận), sloth and torpor (hôn trầm – thụy miên), restlessness and remorse (trạo hối), and doubt (nghi). <button class=\"jump-btn\" onclick=\"jumpToAppendix(1)\">See explanation ↓</button></li><li>Five Aggregates of Clinging (năm thủ uẩn): form (sắc), feeling (thọ), perception (tưởng), volitional formations (hành), consciousness (thức). <button class=\"jump-btn\" onclick=\"jumpToAppendix(2)\">See explanation ↓</button></li><li>Six Internal and External Sense Bases (sáu nội ngoại xứ): six sense faculties (sáu căn)—eye, ear, nose, tongue, body, mind—and six sense objects (sáu trần)—form (sắc), sound (thanh), smell (hương), taste (vị), touch (xúc), mental phenomena (pháp). <button class=\"jump-btn\" onclick=\"jumpToAppendix(3)\">See explanation ↓</button></li><li>Seven Factors of Awakening (bảy giác chi): mindfulness, investigation of phenomena (trạch pháp), effort (tinh tấn), joy (hỷ), tranquility (khinh an), concentration (định), equanimity (xả). <button class=\"jump-btn\" onclick=\"jumpToAppendix(4)\">See explanation ↓</button></li><li>The Four Noble Truths: Suffering (khổ), Origin (tập), Cessation (diệt), Path (đạo).<br>(Each term in the first four groups is explained in the Appendix at the end)</li></ol></div><p>The three methods below are starting points: 1 and 2 belong to Contemplation of the Body, 3 begins Contemplation of Feelings and of the Mind.</p><div class=\"mini-acc\" data-mid=\"s3-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.1. Method 1: Mindfulness of Breathing (quán niệm hơi thở; Ānāpānasati)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>This is among the most basic and widespread practices, taught by the Buddha in the Foundations of Mindfulness Sutta (MN 10) and the Mindfulness of Breathing Sutta (<em>Ānāpānasati</em>, MN 118). The breath is always here in the present, so attention settles on it easily.</p><ul><li><strong>How to do it:</strong><ol><li><strong>Posture:</strong> sit upright with relaxed shoulders, eyes gently closed or looking at the floor about 1 meter ahead. The suttas describe “sitting cross-legged, back straight” (ngồi kiết già); beginners may use a chair or cushion for comfort.</li><li><strong>Following the breath:</strong> notice breathing in (<em>“I know I am breathing in”</em>), notice breathing out (<em>“I know I am breathing out”</em>). Let the breath stay natural, with no need to adjust it.</li><li><strong>When distracted:</strong> thoughts will break in (e.g., <em>“What should I eat tonight?”</em>, <em>“My assignment isn’t finished”</em>). This is perfectly normal; no need to blame ourselves. Just recognize: <em>“Ah, my mind is thinking,”</em> then gently return to the breath. Overthinking is being swept along by the stream of thoughts; mindfulness is noticing “a thought is here” without following it. Each time we notice and return, we train mindfulness.</li></ol></li></ul></div></div></div><div class=\"mini-acc\" data-mid=\"s3-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.2. Method 2: Mindfulness in Action</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Mindfulness is not only for sitting meditation (ngồi thiền). The suttas teach knowing clearly what we are doing in every activity: eating, drinking, chewing, tasting, walking, standing, sitting, sleeping, waking, speaking, being silent. We can live mindfully in each task:</p><ul><li><strong>When eating:</strong> notice the flavors, colors, and each chew, and don’t scroll TikTok/YouTube while eating.</li><li><strong>When walking (walking meditation, thiền hành):</strong> know each footstep touching the ground. Left foot steps—know the left foot stepping; right foot steps—know the right foot stepping.</li><li><strong>When studying and working:</strong> do one thing at a time (<em>single-tasking</em>): when studying, only study; when writing an email, only write the email. When the mind drifts or gets distracted, gently return attention to the task at hand and notice whether the mind is focused, anxious, tired, or scattered at that moment.</li></ul><p><strong>Key point:</strong> doing one thing at a time helps us concentrate on doing it well; mindfulness also helps us know what we are doing and what state our mind is in.</p></div></div></div><div class=\"mini-acc\" data-mid=\"s3-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3.3. Method 3: Recognizing Emotions with the S.T.O.P Technique</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>S.T.O.P is not in the suttas but is a tool of modern mindfulness programs, supporting Contemplation of Feelings and of the Mind when stressed or angry:</p><ul><li><strong>S (Stop):</strong> stop what we are doing or saying for a few seconds.</li><li><strong>T (Take a breath):</strong> take one deep breath and exhale slowly.</li><li><strong>O (Observe):</strong> observe the body (hot, tense, heart racing) and the mind’s state (“I am feeling angry/anxious”).</li><li><strong>P (Proceed):</strong> continue acting with clarity, choosing an appropriate response rather than reacting impulsively.</li></ul></div></div></div>"}, "summary": {"vi": "<p><strong>a. Bốn nơi an trú chánh niệm</strong></p><ul><li>Kinh Niệm Xứ dạy bốn nơi an trú chánh niệm: Thân, Thọ, Tâm, Pháp.</li><li>Ví dụ khi bị xúc phạm: Quán Thân (ngực nóng, tim đập nhanh), Quán Thọ (cảm giác khó chịu), Quán Tâm (“Tâm có sân”), Quán Pháp (ý nghĩ “họ xúc phạm mình”, sân hận có mặt).</li><li>Quán Pháp là phần quán chiếu sâu hơn, gồm năm nhóm đối tượng quán chiếu: Năm triền cái, Năm thủ uẩn, Sáu nội ngoại xứ, Bảy giác chi và Tứ Diệu Đế. Bốn nhóm đầu được giải thích từng thuật ngữ ở Phụ lục.</li></ul><p><strong>b. Ba phương pháp khởi đầu</strong></p><ul><li>Ba phương pháp sau là điểm khởi đầu: phương pháp 1 và 2 thuộc Quán Thân, phương pháp 3 bắt đầu Quán Thọ và Quán Tâm.</li><li>Phương pháp 1, Quán niệm hơi thở (Ānāpānasati): ngồi thẳng lưng, biết hít vào, biết thở ra, để hơi thở tự nhiên; khi suy nghĩ chen vào thì không tự trách, nhận biết rồi nhẹ nhàng quay lại.</li><li>Phương pháp 2, Chánh niệm trong hành động: biết rõ việc mình đang làm khi ăn, đi, học, làm việc; làm từng việc một.</li><li>Phương pháp 3, Nhận biết cảm xúc bằng kỹ thuật S.T.O.P: công cụ hiện đại, không có trong kinh; Dừng, Hít thở, Quan sát, Tiếp tục.</li></ul>", "en": "<p><strong>a. Four foundations for establishing mindfulness</strong></p><ul><li>The Foundations of Mindfulness Sutta (Kinh Niệm Xứ) teaches four foundations for establishing mindfulness: Body, Feelings, Mind, Mental phenomena.</li><li>Example, when someone insults us: Body (chest hot, heart racing), Feelings (an unpleasant feeling), Mind (“Hatred is in the mind”), Mental phenomena (the thought “they insulted me”; ill will is present).</li><li>Contemplation of Mental Phenomena is deeper and covers five groups of objects: the Five Hindrances (năm triền cái), Five Aggregates of Clinging (năm thủ uẩn), Six Internal and External Sense Bases (sáu nội ngoại xứ), Seven Factors of Awakening (bảy giác chi), and the Four Noble Truths (Tứ Diệu Đế). Each term in the first four groups is explained in the Appendix.</li></ul><p><strong>b. Three starting methods</strong></p><ul><li>The three methods are starting points: methods 1 and 2 belong to Contemplation of the Body; method 3 begins Contemplation of Feelings and of the Mind.</li><li>Method 1, Mindfulness of Breathing (quán niệm hơi thở; Ānāpānasati): sit upright, know each in-breath and out-breath, keep it natural; when thoughts break in, do not blame yourself, notice it and gently return.</li><li>Method 2, Mindfulness in Action: know clearly what we are doing when eating, walking, studying, and working; do one thing at a time.</li><li>Method 3, Recognizing Emotions with the S.T.O.P Technique: a modern tool, not in the suttas; Stop, Take a breath, Observe, Proceed.</li></ul>"}}, {"id": "s4", "title": {"vi": "LỢI LẠC CỦA CHÁNH NIỆM TRONG ĐỜI SỐNG HẰNG NGÀY", "en": "THE BENEFITS OF MINDFULNESS IN EVERYDAY LIFE"}, "html": {"vi": "<p>Khi luyện chánh niệm đều đặn, nhiều người nhận thấy những thay đổi sau. Chúng ta không cần tin ngay: hãy tự thử và tự kiểm chứng.</p><div class=\"table-wrap\"><table class=\"glossary\"><tr><td><strong>1. Tự chủ hơn</strong></td><td>Chuyển từ “phản ứng bộc phát” sang “phản ứng có lựa chọn”: nhận ra sớm những thói quen có hại (thức khuya, lướt điện thoại, tiêu xài bốc đồng, nghiện game) để tự điều chỉnh.</td></tr><tr><td><strong>2. Tập trung hơn</strong></td><td>Rèn sự chú ý, nên ít xao nhãng hơn khi học hoặc làm việc, và dễ tiếp thu những điều phức tạp.</td></tr><tr><td><strong>3. Bớt bị cảm xúc cuốn đi</strong></td><td>Học nhìn cảm xúc như mây bay qua bầu trời: mây đến rồi mây đi, nên ít bị giận dữ, tự ti hay lo âu chi phối.</td></tr><tr><td><strong>4. Hiểu và lắng nghe người khác</strong></td><td>Biết lắng nghe mà không ngắt lời hay vội phán xét, nên bớt hiểu lầm với cha mẹ, bạn bè, đồng nghiệp. Từ bi (thương và mong người khác bớt khổ) cần tu tập riêng, nhưng lắng nghe trọn vẹn là nền tảng tốt.</td></tr></table></div><p><strong>Lưu ý:</strong> chánh niệm là cách rèn luyện tâm, không thay thế thuốc chữa bệnh. Nếu lo âu, buồn bã hoặc mất ngủ kéo dài, hãy nói chuyện với bác sĩ hoặc chuyên gia tâm lý. Nếu khi ngồi yên quan sát tâm mà thấy khó chịu nhiều, hãy dừng lại và hỏi người hướng dẫn.</p>", "en": "<p>With regular practice, many people notice these changes. No need to believe this right away: let’s try and verify for ourselves.</p><div class=\"table-wrap\"><table class=\"glossary\"><tr><td><strong>1. More self-control</strong></td><td>Shifting from “impulsive reaction” to “a chosen response”: noticing harmful habits early (staying up late, scrolling on the phone, impulsive spending, gaming addiction) to correct ourselves.</td></tr><tr><td><strong>2. Greater focus</strong></td><td>Training attention, so we are less distracted when studying or working and take in complex material more easily.</td></tr><tr><td><strong>3. Less swept up by emotions</strong></td><td>We learn to watch emotions like clouds crossing the sky: clouds come and go, so anger, feelings of inferiority, or anxiety govern us less.</td></tr><tr><td><strong>4. Understanding and listening to others</strong></td><td>Listening without interrupting or rushing to judge, so misunderstandings with parents, friends, and colleagues decrease. Compassion (từ bi: feeling warmth toward others and wishing them less suffering) needs separate cultivation, but listening fully is a good foundation.</td></tr></table></div><p><strong>Note:</strong> mindfulness is a way of training the mind, not a substitute for medication. If anxiety, sadness, or insomnia persists, talk to a doctor or psychologist. If sitting still and observing the mind brings up a lot of discomfort, stop and ask your instructor.</p>"}, "summary": {"vi": "<p>Khi thực hành chánh niệm đều đặn, ta có được những lợi ích sau:</p><ul><li>Tự chủ hơn: từ “phản ứng bộc phát” sang “phản ứng có lựa chọn”; nhận ra sớm thói quen có hại (thức khuya, lướt điện thoại, tiêu xài bốc đồng, nghiện game) để tự điều chỉnh.</li><li>Tập trung hơn: ít xao nhãng khi học và làm việc, dễ tiếp thu điều phức tạp.</li><li>Bớt bị cảm xúc cuốn đi: nhìn cảm xúc như mây bay qua bầu trời, nên ít bị giận dữ, tự ti hay lo âu chi phối.</li><li>Hiểu và lắng nghe người khác: nghe không ngắt lời, không vội phán xét, nên bớt hiểu lầm; từ bi cần tu tập riêng, nhưng lắng nghe trọn vẹn là nền tảng tốt.</li></ul>", "en": "<p>With regular practice, we gain the following benefits:</p><ul><li>More self-control: shifting from “impulsive reaction” to “a chosen response”; noticing harmful habits early (staying up late, scrolling on the phone, impulsive spending, gaming addiction) to correct ourselves.</li><li>Greater focus: less distraction when studying or working, and complex material is easier to take in.</li><li>Less swept up by emotions: watching emotions like clouds crossing the sky, so anger, feelings of inferiority, or anxiety govern us less.</li><li>Understanding and listening to others: listening without interrupting or rushing to judge, so fewer misunderstandings; compassion (từ bi) needs separate cultivation, but listening fully is a good foundation.</li></ul>"}}, {"id": "s5", "title": {"vi": "KẾT LUẬN", "en": "CONCLUSION"}, "html": {"vi": "<p>Chánh niệm tỉnh thức không phải giáo điều xa rời thực tế hay lối sống ẩn dật, mà là một năng lực sống thiết thực cho người trẻ. Như tập gym giúp cơ bắp chắc khỏe, thực hành chánh niệm mỗi ngày – dù chỉ 5 đến 10 phút – là bài tập cho “cơ bắp tâm trí”, giúp chúng ta vững như cây cổ thụ rễ sâu, giữ được bình tĩnh, sáng suốt và tự chủ trước bão táp cuộc đời.</p><p>Tuy vậy, mục đích của người học Phật không dừng ở việc học giỏi hay làm việc hiệu quả hơn. Kinh Niệm Xứ mở đầu bằng lời dạy: “đây là con đường độc nhất đưa đến thanh tịnh cho chúng sanh, vượt khỏi sầu não, diệt trừ khổ ưu, thành tựu chánh trí, chứng ngộ Niết-bàn” (HT Thích Minh Châu dịch).</p>", "en": "<p>Mindful awareness is not a dogma detached from reality or a hermit’s way of life, but a practical life skill for young people. Just as going to the gym builds strong muscles, practicing mindfulness daily—even 5–10 minutes—exercises the “muscles of the mind.” It helps us stand firm like a deep-rooted ancient tree and keep our calm, clarity, and self-control in life’s storms.</p><p>Even so, the aim of studying Buddhism goes beyond studying well or working more effectively. The Foundations of Mindfulness Sutta opens by teaching: “this is the one and only path to the purification of sentient beings (chúng sanh), beyond sorrow and distress, to the end of pain and grief, to right knowledge (chánh trí) and the realization (chứng ngộ) of Nirvana” (Most Ven. Thích Minh Châu’s Vietnamese translation).</p>"}}, {"id": "s6", "title": {"vi": "CÂU HỎI THẢO LUẬN VÀ BÀI TẬP THỰC HÀNH", "en": "DISCUSSION QUESTIONS AND PRACTICE EXERCISES"}, "html": {"vi": "<p><em>Hãy trả lời các câu hỏi sau vào sổ tay tu học của mình để ghi nhớ bài học:</em></p><ol type=\"a\"><li><strong>Khái niệm:</strong> chánh niệm (<em>sammā-sati</em>) là gì? Phân biệt “nghĩ quá nhiều” (<em>overthinking</em>) với “nhận biết nhớ nghĩ” (chánh niệm).</li><li><strong>Ứng dụng thực tế:</strong> khi rất tức giận vì một lời chê bai trên mạng xã hội, hãy mô tả bốn bước S.T.O.P mà chúng ta sẽ làm.</li><li><strong>Phân tích bản thân:</strong> liệt kê 3 hoạt động hằng ngày (như ăn sáng, đi bộ, lướt điện thoại) mà chúng ta hay làm theo thói quen, không để ý. Chúng ta sẽ thay đổi thói quen đó như thế nào bằng chánh niệm?</li><li><strong>Bài tập thực hành 7 ngày:</strong> mỗi ngày dành 5 phút theo dõi hơi thở vào giờ cố định (ví dụ trước khi đi ngủ), rồi ghi lại sự thay đổi của tâm sau 1 tuần.</li></ol>", "en": "<p><em>Answer these questions in your study notebook to help you remember the lesson:</em></p><ol type=\"a\"><li><strong>Concept:</strong> what is mindfulness (<em>sammā-sati</em>)? Distinguish “overthinking” from “knowing and keeping in mind” (mindfulness).</li><li><strong>Real-life application:</strong> when very angry at a belittling comment on social media, describe the four S.T.O.P steps we would take.</li><li><strong>Self-analysis:</strong> list 3 daily activities (such as eating breakfast, walking, scrolling on the phone) that we often do from habit, without noticing. How will we change those habits through mindfulness?</li><li><strong>7-day practice exercise:</strong> each day, spend 5 minutes following the breath at a fixed time (e.g., before bed), then record how the mind has changed after 1 week.</li></ol>"}}, {"id": "s7", "title": {"vi": "TÀI LIỆU THAM KHẢO", "en": "REFERENCES"}, "html": {"vi": "<ul class=\"refs\"><li><em>Satipaṭṭhāna Sutta</em> – Kinh Niệm Xứ (MN 10), bản dịch HT Thích Minh Châu; các câu trích trong bài lấy từ bản này.</li><li><em>Ānāpānasati Sutta</em> – Kinh Quán Niệm Hơi Thở (MN 118).</li><li>S.T.O.P: Elisha Goldstein, <em>The S.T.O.P. Practice for Stress</em>, Mindful.org.</li><li><em>Assutavā Sutta </em>– Kinh Hạng người ít nghe (SN 12.61): hình ảnh con khỉ leo trong rừng.</li></ul>", "en": "<ul class=\"refs\"><li><em>Satipaṭṭhāna Sutta</em>—Foundations of Mindfulness Sutta (MN 10), Vietnamese translation by Most Ven. Thích Minh Châu; the lesson’s quotations come from it.</li><li><em>Ānāpānasati Sutta</em>—Mindfulness of Breathing Sutta (MN 118).</li><li>S.T.O.P: Elisha Goldstein, <em>The S.T.O.P. Practice for Stress</em>, Mindful.org.</li><li><em>Assutavā Sutta</em>—Sutta on the Person Who Has Heard Little, also known in English as “Uninstructed (1)” (Kinh Hạng người ít nghe, SN 12.61): image of a monkey climbing in the forest.</li></ul>"}}, {"id": "pl", "title": {"vi": "PHỤ LỤC: GIẢI THÍCH THUẬT NGỮ TRONG QUÁN PHÁP", "en": "APPENDIX: EXPLAINING TERMS IN CONTEMPLATION OF MENTAL PHENOMENA"}, "html": {"vi": "<p><em>Phụ lục này giải thích ngắn gọn bốn nhóm đầu trong năm nhóm đối tượng của Quán Pháp (xem khung Lưu ý ở mục 3). Nhóm thứ năm, Tứ Diệu Đế, đã được học riêng.</em></p><div class=\"mini-acc\" data-mid=\"pl-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1. Năm triền cái (pañca nīvaraṇa)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>năm thứ che phủ tâm, làm ta khó tập trung và khó thấy rõ sự việc.</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Triền cái</strong></th><th><strong>Ý nghĩa đơn giản</strong></th></tr></thead><tbody><tr><td>Ái dục (<em>kāmacchanda</em>)</td><td>Ham muốn những thứ dễ chịu của giác quan: ngon, đẹp, vui.</td></tr><tr><td>Sân hận (<em>byāpāda</em>)</td><td>Bực bội, ghét bỏ, muốn đẩy xa điều mình không thích.</td></tr><tr><td>Hôn trầm – thụy miên (<em>thīna-middha</em>)</td><td>Người nặng nề, uể oải, buồn ngủ; tâm lờ đờ.</td></tr><tr><td>Trạo hối (<em>uddhacca-kukkucca</em>)</td><td>Tâm bồn chồn không yên (trạo) và day dứt về chuyện đã qua (hối).</td></tr><tr><td>Nghi (<em>vicikicchā</em>)</td><td>Do dự, không tin vào con đường tu tập hoặc vào khả năng của chính mình, nên không dám bắt đầu.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Về khung Lưu ý (mục 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2. Năm thủ uẩn (pañcupādānakkhandhā)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>năm nhóm tạo nên “một con người”. “Thủ” là bám giữ, “uẩn” là nhóm; ta hay bám vào chúng rồi gọi đó là “tôi”.</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Uẩn</strong></th><th><strong>Ý nghĩa đơn giản</strong></th></tr></thead><tbody><tr><td>Sắc (<em>rūpa</em>)</td><td>Thân thể và vật chất.</td></tr><tr><td>Thọ (<em>vedanā</em>)</td><td>Cảm giác: dễ chịu, khó chịu hoặc trung tính.</td></tr><tr><td>Tưởng (<em>saññā</em>)</td><td>Nhận ra và gán nhãn: “đây là hoa”, “đó là bạn tôi”.</td></tr><tr><td>Hành (<em>saṅkhārā</em>)</td><td>Ý muốn, thói quen, phản ứng của tâm: muốn, giận, quyết định.</td></tr><tr><td>Thức (<em>viññāṇa</em>)</td><td>Nhận biết: biết mình đang thấy, nghe, nghĩ.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Về khung Lưu ý (mục 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3. Sáu nội ngoại xứ (cha ajjhattika-bāhira āyatana)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>mười hai “cửa” nơi kinh nghiệm xảy ra, gồm sáu căn (bên trong) gặp sáu trần (bên ngoài).</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Căn (bên trong)</strong></th><th><strong>Trần (bên ngoài)</strong></th><th><strong>Ví dụ</strong></th></tr></thead><tbody><tr><td>Mắt (<em>cakkhu</em>)</td><td>Sắc (<em>rūpa</em>)</td><td>Hình ảnh, màu sắc.</td></tr><tr><td>Tai (<em>sota</em>)</td><td>Thanh (<em>sadda</em>)</td><td>Âm thanh, tiếng nói, tiếng nhạc.</td></tr><tr><td>Mũi (<em>ghāna</em>)</td><td>Hương (<em>gandha</em>)</td><td>Mùi thơm, mùi khó chịu.</td></tr><tr><td>Lưỡi (<em>jivhā</em>)</td><td>Vị (<em>rasa</em>)</td><td>Vị giác: chua, ngọt, đắng, mặn…</td></tr><tr><td>Thân (<em>kāya</em>)</td><td>Xúc (<em>phoṭṭhabba</em>)</td><td>Cảm giác khi chạm: nóng, lạnh, êm, thô.</td></tr><tr><td>Ý (<em>mano</em>)</td><td>Pháp (<em>dhammā</em>)</td><td>Ý nghĩ, ký ức, hình ảnh hiện ra trong tâm. (Ở đây “pháp” không có nghĩa là giáo pháp.)</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Về khung Lưu ý (mục 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-4\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">4. Bảy giác chi (satta bojjhaṅga)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>bảy yếu tố giúp tâm tỉnh thức và dẫn đến giác ngộ.</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Giác chi</strong></th><th><strong>Ý nghĩa đơn giản</strong></th></tr></thead><tbody><tr><td>Niệm (<em>sati</em>)</td><td>Nhớ nghĩ,  chú tâm vào việc đang xảy ra ngay bây giờ.</td></tr><tr><td>Trạch pháp (<em>dhammavicaya</em>)</td><td>Quan sát và phân biệt điều lành, điều không lành.</td></tr><tr><td>Tinh tấn (<em>vīriya</em>)</td><td>Nỗ lực đều đặn, không bỏ cuộc.</td></tr><tr><td>Hỷ (<em>pīti</em>)</td><td>Niềm vui nhẹ nhàng khi tu tập.</td></tr><tr><td>Khinh an (<em>passaddhi</em>)</td><td>Thân và tâm nhẹ nhàng, yên ổn.</td></tr><tr><td>Định (<em>samādhi</em>)</td><td>Tâm tập trung, vững vàng.</td></tr><tr><td>Xả (<em>upekkhā</em>)</td><td>Bình thản, không bị cuốn theo thích hay ghét.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Về khung Lưu ý (mục 3)</button></div></div></div>", "en": "<p><em>This appendix briefly explains the first four of the five groups of objects of Contemplation of Mental Phenomena (see the Note box, section 3). The fifth, the Four Noble Truths, was studied separately.</em></p><div class=\"mini-acc\" data-mid=\"pl-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1. Five Hindrances (Năm triền cái-pañca nīvaraṇa)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>five things that veil the mind, making it hard to concentrate and see clearly.</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Hindrance (Triền cái)</strong></th><th><strong>Simple meaning</strong></th></tr></thead><tbody><tr><td>Sensual desire (Ái dục - <em>kāmacchanda</em>)</td><td>Wanting what pleases the senses: tasty, beautiful, fun.</td></tr><tr><td>Ill will (Sân hận - <em>byāpāda</em>)</td><td>Irritation, aversion, wanting to push away what we dislike.</td></tr><tr><td>Sloth and torpor (Hôn trầm – thụy miên/ <em>thīna-middha</em>)</td><td>Heavy, sluggish, sleepy; the mind is dull.</td></tr><tr><td>Restlessness and remorse (Trạo hối -<em>uddhacca-kukkucca</em>)</td><td>Restless, unsettled mind (restlessness; trạo) and torment over the past (remorse; hối).</td></tr><tr><td>Doubt (Nghi<em> - vicikicchā</em>)</td><td>Hesitating, lacking confidence in the path of practice or in one’s own abilities, and so afraid to begin.</td></tr></tbody></table></div><button class=\"jump-btn back\" onclick=\"jumpBack()\">↑ Back to the Note box (section 3)</button></div></div></div><div class=\"mini-acc\" data-mid=\"pl-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2. Five Aggregates of Clinging (Năm thủ uẩn - pañcupādānakkhandhā)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>five groups that make up “a person.” “Clinging” (thủ) means holding on, “aggregate” (uẩn) means group; we tend to cling to them, calling that “I.”</p><div class=\"table-wrap\"><table class=\"glossary\"><thead><tr><th><strong>Aggregate  (Uẩn)</strong></th><th><strong>Simple meaning</strong></th></tr></thead><tbody><tr><td>Form (Sắc - <em>rūpa</em>)</td><td>Body and material things.</td></tr><tr><td>Feeling (Thọ - <em>vedanā</em>)</td><td>Feeling: pleasant, unpleasant, or neutral.</td></tr><tr><td>Perc
