<script id="artifact-data" type="application/json">{"meta": {"title": {"vi": "Đức Phật và Giáo pháp của Ngài đối với tinh thần Bi Trí Dũng", "en": "The Buddha and His Teaching through the Spirit of Compassion, Wisdom, and Courage (Bi – Trí – Dũng)"}, "subtitle": {"vi": "Đọc từng phần, ôn thuật ngữ bằng thẻ lật, rồi tự kiểm tra bằng trắc nghiệm.", "en": "Read each part, review key terms with flashcards, then check yourself with a quiz."}, "kicker": {"vi": "Tài liệu tu học · Bậc Kiên", "en": "Study material · Kiên level"}}, "sections": [{"id": "i-muc-dich", "title": {"vi": "MỤC ĐÍCH PHẬT PHÁP", "en": "THE PURPOSE OF THE DHARMA"}, "html": {"vi": "<p>Đức Phật là một con người đã giác ngộ và giải thoát. Với lòng từ bi vô lượng, không nỡ nhìn thấy chúng sinh chìm trong biển khổ luân hồi, nên sau khi thành đạo dưới cội Bồ-đề, Ngài đã chuyển bánh xe Chánh pháp lần đầu tiên tại vườn Lộc Uyển. Những lời dạy cùng kinh nghiệm tu chứng của Đức Phật chính là nguồn giáo pháp, mở ra con đường tu tập cho tất cả mọi người, với mục đích là giúp cho chúng sinh có trí tuệ như Phật. Đức Phật từng nói: “Ta là Phật đã thành, chúng sinh là Phật sẽ thành.”</p>\n<p>Giáo pháp không phải là một học thuyết để tin suông mà là con đường thực hành và tự chứng nghiệm, giúp chúng sinh đạt đến trạng thái của:</p>\n<p><strong>a. Chân thường</strong> – thường hằng, không bị biến đổi bởi sinh diệt.</p>\n<p><strong>b. Chân lạc</strong> – niềm an lạc chân thật khi tham ái, sân hận và si mê đã được đoạn trừ.</p>\n<p><strong>c. Chân ngã</strong> – chỉ sự tự tại của Niết-bàn, không nên hiểu là một bản ngã thường còn.</p>\n<p><strong>d. Chân tịnh</strong> – chỉ sự thanh tịnh, trong sáng khi các phiền não đã được chuyển hóa và diệt trừ.</p>\n<p>Trên đây là bốn phẩm chất mô tả trạng thái giải thoát. Đức Phật dạy giáo pháp để giúp chúng sinh đạt đến trạng thái ấy.</p>\n<p><strong>Phật pháp, tự trong cốt tủy, không phải là một hệ thống học thuyết khô cứng.</strong></p>\n<p>Phật pháp tuy được truyền đạt bằng ngôn ngữ, nhưng không chỉ là những điều để học và ghi nhớ. Cốt lõi của Phật pháp là con đường thực hành, giúp con người hiểu để chuyển hóa khổ đau, phát triển trí tuệ và hướng đến giải thoát. Trong suốt 45 năm thuyết pháp, Đức Phật luôn nhấn mạnh rằng mỗi người cần học giáo pháp, suy ngẫm, thực hành và tự mình chứng nghiệm. Vì vậy, giáo pháp Ngài giảng dạy không nên chấp vào chữ nghĩa mà quên mục đích giải thoát. Điều này thường được diễn đạt qua các ý sau:</p>\n<div class=\"mini-acc\" data-mid=\"i-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“Ngón tay chỉ mặt trăng”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Kinh điển và khái niệm chỉ là phương tiện hướng người học đến chân lý, giống như ngón tay chỉ về phía mặt trăng. Vì vậy, không nên đồng nhất lời dạy với sự chứng ngộ chân lý.</p></div></div></div><div class=\"mini-acc\" data-mid=\"i-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“Chiếc bè qua sông”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Giáo pháp là phương tiện giúp con người vượt qua khổ đau và phiền não. Khi đã đạt mục đích, người học không nên chấp giữ giáo pháp như một gánh nặng.</p></div></div></div><div class=\"mini-acc\" data-mid=\"i-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“Chân lý vượt ngoài ngôn ngữ”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Ngôn ngữ và suy luận chỉ giúp chúng ta hiểu một phần. Chân lý cần được trực tiếp chứng nghiệm qua quá trình tu tập và buông bỏ những suy nghĩ và nhận thức sai lệch.</p></div></div></div>", "en": "<p>The Buddha was a person who had awakened (giác ngộ) and attained liberation (giải thoát). Moved by boundless compassion, unable to bear witnessing sentient beings adrift in the sea of suffering through the cycle of birth and death (luân hồi), after attaining enlightenment beneath the Bodhi tree (Bồ-đề), he set the Wheel of the Dharma (Chánh pháp) in motion for the first time at Deer Park (Lộc Uyển). The Buddha’s teachings and the experience of his own realization became the source of the Dharma, opening a path of practice for all people, with the aim of helping sentient beings attain the same wisdom as the Buddha himself. The Buddha once said: “I am a Buddha who has already attained it; sentient beings are Buddhas yet to attain it.”</p>\n<p>The Dharma is not a doctrine to be believed blindly, but a path of practice and direct, personal realization, helping sentient beings reach the state of:</p>\n<p><strong>a. True Permanence (Chân thường)</strong> — the unchanging, not subject to arising and ceasing.</p>\n<p><strong>b. True Bliss (Chân lạc)</strong> — the genuine peace and joy that arises once craving, aversion, and delusion have been uprooted.</p>\n<p><strong>c. True Self (Chân ngã)</strong> — referring to the sovereign freedom of Nirvana (Niết-bàn), not to be understood as a permanent ego.</p>\n<p><strong>d. True Purity (Chân tịnh)</strong> — the clarity and purity that come once afflictions have been transformed and eliminated.</p>\n<p>These four qualities describe the state of liberation. The Buddha taught the Dharma to help sentient beings reach that state.</p>\n<p><strong>At its core, the Buddha-Dharma is not a rigid system of doctrine.</strong></p>\n<p>Although the Dharma is conveyed through language, it is not merely something to be studied and memorized. At its heart, the Dharma is a path of practice that helps people understand and transform suffering, develop wisdom, and move toward liberation. Throughout his forty-five years of teaching, the Buddha consistently emphasized that each person must study the teaching, reflect on it, practice it, and realize it for themselves. For this reason, his teaching should never be clung to as mere words at the expense of its true purpose — liberation. This is often expressed in the following ways:</p>\n<div class=\"mini-acc\" data-mid=\"i-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“A finger pointing at the moon”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Scriptures and concepts are only a means of pointing the learner toward the truth, just as a finger points toward the moon. The teaching should therefore never be mistaken for the realization of truth itself.</p></div></div></div><div class=\"mini-acc\" data-mid=\"i-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“A raft for crossing the river”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>The Dharma is a means for crossing over suffering and affliction. Once the goal has been reached, the practitioner should not cling to the teaching as though it were a burden to be carried forever.</p></div></div></div><div class=\"mini-acc\" data-mid=\"i-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">“Truth beyond language”</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Language and reasoning can only bring us partial understanding. Truth must be directly realized through practice, and through letting go of mistaken thoughts and perceptions.</p></div></div></div>"}, "summary": {"vi": "<ul><li>Đức Phật là con người đã giác ngộ và giải thoát; vì lòng từ bi, Ngài chuyển bánh xe Chánh pháp để giúp chúng sinh có trí tuệ như Phật.</li><li>Giáo pháp là con đường thực hành và tự chứng nghiệm, không phải học thuyết để tin suông.</li><li>Giáo pháp đưa đến bốn phẩm chất của trạng thái giải thoát: chân thường, chân lạc, chân ngã, chân tịnh.</li><li>Ba hình ảnh “ngón tay chỉ mặt trăng”, “chiếc bè qua sông”, “chân lý vượt ngoài ngôn ngữ” nhắc người học đừng chấp vào chữ nghĩa mà quên mục đích giải thoát.</li></ul>", "en": "<ul><li>The Buddha was a person who had awakened and attained liberation; moved by compassion, he set the Wheel of the Dharma in motion to help sentient beings attain wisdom like his own.</li><li>The Dharma is a path of practice and direct, personal realization, not a doctrine to be believed blindly.</li><li>It leads to four qualities of the liberated state: True Permanence, True Bliss, True Self, and True Purity.</li><li>The images of “a finger pointing at the moon”, “a raft for crossing the river”, and “truth beyond language” remind learners not to cling to words at the expense of liberation.</li></ul>"}}, {"id": "ii-dai-cuong", "title": {"vi": "ĐẠI CƯƠNG PHẬT PHÁP", "en": "AN OVERVIEW OF THE DHARMA"}, "html": {"vi": "<p>Phật pháp rất phong phú, thường được diễn đạt bằng con số biểu trưng 84.000 pháp môn, được Đức Phật giảng tùy theo căn cơ của chúng sinh. Giáo lý bao gồm ba tạng kinh điển:</p>\n<div class=\"mini-acc\" data-mid=\"ii-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Kinh</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Kinh là lời Phật dạy về giáo lý và pháp tu.</p></div></div></div><div class=\"mini-acc\" data-mid=\"ii-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Luật</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Những giới luật và quy tắc sinh hoạt do Đức Phật chế ra để giữ đời sống thanh tịnh và hòa hợp. Luật chủ yếu dành cho người xuất gia. Riêng người tại gia cũng có giới căn bản để thực hành như Năm giới, Thập thiện giới, Bát quan trai giới, Bồ Tát Giới tại gia v.v. được ghi trong Kinh tạng và Luận tạng.</p></div></div></div><div class=\"mini-acc\" data-mid=\"ii-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Luận</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Những lời giải thích, bàn luận của các vị đệ tử và tổ sư để làm rõ ý nghĩa sâu xa của Kinh và Luật.</p></div></div></div>\n<blockquote>\n<p>Kinh điển Phật giáo được lưu truyền trong nhiều truyền thống; tại Việt Nam thường phân biệt truyền thống Bắc tông và Nam tông. Ở Việt Nam, cách gọi “Bắc tông” thường chỉ các truyền thống Đại thừa phát triển tại Đông Á, còn “Nam tông” thường chỉ Phật giáo Theravāda (Thượng tọa bộ) được truyền bá tại Nam Á và Đông Nam Á.</p>\n</blockquote>\n<p>Phật pháp giúp chúng ta nhận ra khổ đau của cuộc đời không phải để bi quan, mà để tìm hiểu nguyên nhân của khổ đau. Từ đó, Phật pháp chỉ ra con đường dẫn đến an vui bằng chính nỗ lực tu tập của mỗi người, thay vì dựa vào sự cầu nguyện thần linh. Con đường ấy được gọi là Bát chánh đạo và được sắp xếp thành ba nhóm: <strong>Tuệ, Giới và Định.</strong></p>\n<div class=\"table-wrap\"><table class=\"glossary\">\n<tr>\n<td><strong>TUỆ</strong></td>\n<td><strong>1. Chánh kiến</strong> – Hiểu biết đúng đắn; <strong>2. Chánh tư duy</strong> – Suy nghĩ đúng đắn</td>\n</tr>\n\n<tbody>\n<tr>\n<td><strong>GIỚI</strong></td>\n<td><strong>3. Chánh ngữ</strong> – Lời nói đúng đắn; <strong>4. Chánh nghiệp</strong> – Hành động đúng đắn;<br />\n<strong>5. Chánh mạng</strong> – Nghề nghiệp đúng đắn</td>\n</tr>\n<tr>\n<td><strong>ĐỊNH</strong></td>\n<td><strong>6. Chánh tinh tấn</strong> – Cố gắng đúng đắn; <strong>7. Chánh niệm</strong> – nhớ nghĩ, chú tâm đúng đắn;<br />\n<strong>8. Chánh định</strong> – Tập trung đúng đắn</td>\n</tr>\n</tbody>\n</table></div>\n<p>Ba nhóm này liên hệ chặt chẽ và hỗ trợ lẫn nhau: <strong>trí tuệ</strong> giúp chúng ta nhận ra tầm quan trọng của <strong>giới luật</strong>; <strong>giữ giới</strong> giúp tâm không buông lung và dễ đạt <strong>định</strong>; <strong>định tâm</strong> lại tạo điều kiện để <strong>trí tuệ</strong> tiếp tục phát triển.</p>\n<p><strong>Các quy luật vận hành đời sống</strong></p>\n<ol type=\"a\">\n<li><p><strong>Vô thường và duyên khởi</strong>: mọi sự vật đều do nhiều yếu tố liên kết mà thành, không tự nhiên mà có và cũng không do ai sinh ra. Sự thay đổi của một yếu tố sẽ làm thay đổi sự vật.</p></li>\n<li><p><strong>Luân hồi và nghiệp quả:</strong> theo giáo lý luân hồi, cái chết không phải là chấm hết mà là sự tiếp nối của một đời sống khác. Mọi hành động có chủ ý (nghiệp) đều tạo điều kiện cho quả tương ứng; tiến trình nghiệp và quả tiếp nối không ngừng.</p></li>\n</ol>", "en": "<p>The Dharma is vast and rich, often described by the symbolic figure of 84,000 Dharma doors (pháp môn), each taught by the Buddha according to the capacity and disposition of the listener. The teaching is contained within the Three Baskets of scripture (Tam tạng kinh điển):</p>\n<div class=\"mini-acc\" data-mid=\"ii-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Sutra (Kinh)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>the Buddha’s own words on doctrine and practice.</p></div></div></div><div class=\"mini-acc\" data-mid=\"ii-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Vinaya (Luật)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>the precepts and rules of conduct established by the Buddha to preserve a pure and harmonious communal life. The Vinaya applies chiefly to monastics; lay practitioners likewise have foundational precepts to observe — such as the Five Precepts, the Ten Good Precepts (Thập thiện giới), the Eight Precepts, and the lay Bodhisattva Precepts — recorded within the Sutra Basket and the Treatise Basket.</p></div></div></div><div class=\"mini-acc\" data-mid=\"ii-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Treatises (Luận)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>explanations and discussions by disciples and patriarchs that clarify the deeper meaning of the Sutras and the Vinaya.</p></div></div></div>\n<p>Buddhist scripture has been passed down through many traditions; in Vietnam, a distinction is commonly drawn between the Northern tradition (Bắc tông) and the Southern tradition (Nam tông). In Vietnam, “Northern tradition” (Bắc tông) usually refers to the Mahāyāna traditions that developed in East Asia, while “Southern tradition” (Nam tông) usually refers to Theravāda Buddhism (Thượng tọa bộ), which spread throughout South and Southeast Asia.</p>\n<p>The Dharma helps us recognize the suffering inherent in life — not in order to foster pessimism, but to investigate the causes of that suffering. From there, it points to a path leading to genuine well-being through each person’s own effort in practice, rather than through prayer to the gods. That path is called the Noble Eightfold Path (Bát chánh đạo), and it is organized into three groups: Wisdom (Tuệ), Ethical Conduct (Giới), and Concentration (Định).</p>\n<div class=\"table-wrap\"><table class=\"glossary\">\n<tbody>\n<tr>\n<td><strong>WISDOM (Tuệ)</strong></td>\n<td><strong>1. Right View</strong> (Chánh kiến) — correct understanding; <strong>2. Right Thought</strong> (Chánh tư duy) — correct thinking</td>\n</tr>\n<tr>\n<td><strong>ETHICAL CONDUCT (Giới)</strong></td>\n<td><strong>3. Right Speech</strong> (Chánh ngữ) — correct speech; <strong>4. Right Action</strong> (Chánh nghiệp) — correct conduct; <strong>5. Right Livelihood</strong> (Chánh mạng) — correct occupation</td>\n</tr>\n<tr>\n<td><strong>CONCENTRATION (Định)</strong></td>\n<td><strong>6. Right Effort</strong> (Chánh tinh tấn) — correct effort; <strong>7. Right Mindfulness</strong> (Chánh niệm) — correct recollection and attention; <strong>8. Right Concentration</strong> (Chánh định) — correct focus</td>\n</tr>\n</tbody>\n</table></div>\n<p>These three groups are closely interconnected and mutually supportive: wisdom helps us recognize the importance of ethical discipline; keeping the precepts keeps the mind from running loose and makes concentration easier to attain; and a concentrated mind, in turn, creates the conditions for wisdom to keep developing.</p>\n<p><strong>The laws governing existence</strong></p>\n<ol type=\"a\">\n<li><p><strong>Impermanence (Vô thường) and Dependent Origination (Duyên khởi):</strong> all things arise through the coming together of many interdependent factors; nothing exists spontaneously, and nothing is created by any single agent. A change in one factor brings about a change in the thing itself.</p></li>\n<li><p><strong>Cycle of Birth and Death (Luân hồi) and Karma (Nghiệp quả):</strong> according to the teaching of the cycle of birth and death, death is not an ending but a continuation into another life. Every intentional action creates the conditions for its corresponding result; this process of action and result continues without pause.</p></li>\n</ol>"}, "summary": {"vi": "<ul><li>Phật pháp phong phú, được biểu trưng bằng 84.000 pháp môn; giáo lý gồm ba tạng: Kinh, Luật, Luận.</li><li>Tại Việt Nam thường phân biệt truyền thống Bắc tông và Nam tông.</li><li>Bát chánh đạo dẫn đến an vui bằng chính nỗ lực tu tập của mỗi người, gồm ba nhóm hỗ trợ lẫn nhau: Tuệ, Giới, Định.</li><li>Đời sống vận hành theo hai quy luật: vô thường – duyên khởi, và luân hồi – nghiệp quả.</li></ul>", "en": "<ul><li>The Dharma is rich, symbolized by 84,000 Dharma doors; its teaching is contained in three Baskets: Sutra, Vinaya, and Treatises.</li><li>In Vietnam, a distinction is commonly drawn between the Northern tradition (Bắc tông) and the Southern tradition (Nam tông).</li><li>The Noble Eightfold Path leads to genuine well-being through each person's own effort, in three mutually supportive groups: Wisdom, Ethical Conduct, and Concentration.</li><li>Existence is governed by two laws: impermanence and dependent origination, and the cycle of birth and death and karma.</li></ul>"}}, {"id": "iii-con-duong", "title": {"vi": "CON ĐƯỜNG TU HỌC", "en": "THE PATH OF STUDY AND PRACTICE"}, "html": {"vi": "<p>Dù giáo lý Phật pháp rất phong phú được kết tập trong Tam tạng kinh điển, dù có nhiều pháp môn tu tập khác nhau, tất cả người học Phật đều phải đi qua một lộ trình học và hành cụ thể, rõ ràng:</p>\n<div class=\"mini-acc\" data-mid=\"iii-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">VĂN</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Văn là học hỏi bằng cách nghe giảng giáo lý, đọc tụng kinh điển, pháp đàm với thái độ cởi mở, phải thao thức, muốn hiểu, muốn thực hành.</p></div></div></div><div class=\"mini-acc\" data-mid=\"iii-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">TƯ</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Tư là suy ngẫm, tư duy, quán chiếu những điều mình nghe, đối chiếu với những kinh nghiệm mình trải qua trong cuộc sống để hiểu sâu hơn.</p></div></div></div><div class=\"mini-acc\" data-mid=\"iii-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">TU</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Tu là thực hành, vận dụng những điều mình đã nghe, đã tư duy áp dụng vào chính đời sống để chuyển hóa khổ đau. Đó cũng chính là thực hành “GIỚI – ĐỊNH – TUỆ” trong đời sống hằng ngày.</p></div></div></div>", "en": "<p>However rich and vast the teaching gathered in the Three Baskets of scripture, and however many different Dharma doors of practice there may be, every student of the Buddha must pass through one clear and specific path of study and practice:</p>\n<div class=\"mini-acc\" data-mid=\"iii-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Listening (Văn)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>learning by hearing teachings explained, reading and reciting scripture, and engaging in Dharma discussion with an open mind — approaching it with genuine eagerness, a wish to understand, and a wish to practice.</p></div></div></div><div class=\"mini-acc\" data-mid=\"iii-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Reflecting (Tư)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>contemplating, thinking through, and examining what one has heard, comparing it against one’s own life experience in order to understand it more deeply.</p></div></div></div><div class=\"mini-acc\" data-mid=\"iii-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">Practicing (Tu)</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>putting into action, in one’s own life, what one has heard and reflected on, in order to transform suffering. This is precisely the practice of “Ethical Conduct – Concentration – Wisdom” (Giới – Định – Tuệ) in daily life.</p></div></div></div>"}, "summary": {"vi": "<ul><li>Dù giáo lý phong phú và có nhiều pháp môn, mọi người học Phật đều đi qua một lộ trình cụ thể: Văn – Tư – Tu.</li><li>Văn: học hỏi bằng nghe giảng, đọc tụng kinh điển, pháp đàm.</li><li>Tư: suy ngẫm, đối chiếu với kinh nghiệm sống.</li><li>Tu: thực hành để chuyển hóa khổ đau, chính là thực hành Giới – Định – Tuệ trong đời sống hằng ngày.</li></ul>", "en": "<ul><li>However rich the teaching and however many Dharma doors there are, every student of the Buddha passes through one clear path: Listening – Reflecting – Practicing.</li><li>Listening: learning by hearing teachings, reading scripture, and Dharma discussion.</li><li>Reflecting: contemplating and comparing with life experience.</li><li>Practicing: putting into action to transform suffering, which is precisely the practice of Ethical Conduct – Concentration – Wisdom in daily life.</li></ul>"}}, {"id": "iv-bi-tri-dung", "title": {"vi": "ĐỨC PHẬT VỚI TINH THẦN BI – TRÍ – DŨNG", "en": "THE BUDDHA AND THE SPIRIT OF COMPASSION – WISDOM – COURAGE"}, "html": {"vi": "<p>Đức Phật không phải là một vị thần linh ban phước hay giáng họa, mà là một con người lịch sử đã nỗ lực tự thân đạt đến sự giác ngộ và giải thoát. Đối với học viên ngành Thanh đang tu học Bậc Kiên – những người có thể đang chuẩn bị hành trang bước vào trại Lộc Uyển, Đức Phật chính là bậc Thầy dẫn đường và là tấm gương sáng: Ngài đã tự thân thực chứng con đường giải thoát rồi vì lòng từ bi mà chỉ dạy lại cho chúng sinh.</p>\n<p>Ngài là hiện thân trọn vẹn của ba đức tính cốt lõi: Bi, Trí và Dũng. Ba phẩm chất này chính là kim chỉ nam để học viên Bậc Kiên chúng ta rèn luyện tự thân, chuẩn bị cho mình một tâm thế sẵn sàng trước ngưỡng cửa trở thành người Huynh trưởng.</p>\n<div class=\"mini-acc\" data-mid=\"iv-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1. Đại Bi - Tình thương vô điều kiện làm động lực dấn thân</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><blockquote>\n<p>Đức Phật xuất gia vì thương chúng sinh còn chịu nhiều khổ đau. Sau khi giác ngộ, Ngài không giữ sự an lạc cho riêng mình mà đi nhiều nơi để truyền dạy Chánh pháp, giúp mọi người hiểu nguyên nhân của khổ đau và mở ra con đường tu tập chuyển hóa.</p>\n</blockquote>\n<ul>\n<li><p><strong>Bài học cho học viên Bậc Kiên:</strong> Lòng BI bắt đầu từ những việc rất gần gũi: biết lắng nghe, cảm thông, kiên nhẫn và sẵn lòng giúp đỡ người khác. Chúng ta có thể quan tâm đến những em nhỏ trong Gia Đình Phật Tử, chia sẻ giúp đỡ bạn bè và yêu thương người thân trong gia đình. Khi nuôi dưỡng tình thương mỗi ngày, ta sẽ có thêm động lực học hỏi, vượt qua khó khăn và từng bước trở thành người Huynh trưởng biết bao dung, chở che và dìu dắt đàn em.</p></li>\n</ul></div></div></div>\n<div class=\"mini-acc\" data-mid=\"iv-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2. Đại Trí - Sự sáng suốt phá vỡ màn vô minh</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><blockquote>\n<p>Tình thương nếu thiếu đi trí tuệ sẽ rất dễ dẫn đến những hành động cảm tính và sai lầm. Dưới cội Bồ-đề, Đức Phật đã thấu rõ các quy luật vận hành của đời sống như vô thường, duyên khởi và nghiệp quả. Nhờ Đại Trí, Ngài thấu suốt căn cơ của từng người để tùy duyên thuyết giảng, dùng giáo lý như “chiếc bè qua sông” nhằm giúp chúng sinh tự tìm thấy chân lý.</p>\n<p><strong>Bài học cho học viên Bậc Kiên:</strong> Trí tuệ trên hành trình tu học Bậc Kiên chính là cách ta ứng dụng lộ trình “Văn - Tư - Tu” vào thực tế. Chúng ta nghe Pháp, học Bậc Kiên không chỉ để mở rộng kiến thức Phật pháp, mà còn để suy ngẫm, đối chiếu với cuộc sống, từ đó tháo gỡ những buồn vui, vướng mắc của tuổi trẻ (Chánh tư duy). Có Chánh kiến, hiểu đúng mình và hiểu đúng Đạo, ta có được ngọn đuốc sáng để tự soi đường cho bản thân hôm nay và đủ vững vàng để soi sáng cho đàn em sau này.</p>\n</blockquote></div></div></div>\n<div class=\"mini-acc\" data-mid=\"iv-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3. Đại Dũng - Sức mạnh nội tâm không gì sánh bằng để vượt qua chính mình</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><blockquote>\n<p>Đại Dũng của Đức Phật không phải là sức mạnh bạo lực, mà là nội lực phi thường dứt bỏ vinh hoa phú quý tột bậc để khoác áo tu sĩ. Đó là sức mạnh chiến thắng ma quân – biểu trưng cho những phiền não và tham ái trong tâm – đồng thời bình thản đối mặt với mọi chông gai. Ngài đã dũng mãnh phá bỏ những định kiến giai cấp khắc nghiệt của xã hội lúc bấy giờ bằng một trái tim vô úy (không sợ hãi).</p>\n<p><strong>Bài học cho học viên Bậc Kiên:</strong> Trở thành Huynh trưởng là chấp nhận bước ra khỏi vùng an toàn của một người Đoàn sinh vô tư và được chở che. DŨNG của học viên Bậc Kiên là sự can đảm nhìn nhận và sửa chữa những khuyết điểm của bản thân (Chánh tinh tấn); là sự kiên trì theo đuổi chương trình học Bậc Kiên dẫu bận rộn với bài vở trên giảng đường hay áp lực công việc ngoài xã hội; là bản lĩnh thầm lặng nuôi dưỡng lý tưởng phụng sự, chuẩn bị một đôi vai vững chãi để ngày mai sẵn sàng gánh vác trách nhiệm.</p>\n</blockquote></div></div></div>", "en": "<p>The Buddha was not a deity who grants blessings or metes out punishment, but a historical human being who, through his own effort, attained awakening and liberation. For students of the Thanh branch (ngành Thanh) currently studying at the Kiên level (Bậc Kiên) — who may well be preparing to set out for the Lộc Uyển camp (trại Lộc Uyển) — the Buddha is both guiding teacher and shining example: having realized the path to liberation through his own practice, he then taught it to sentient beings out of compassion.</p>\n<p>He is the complete embodiment of three core qualities: Compassion (Bi), Wisdom (Trí), and Courage (Dũng). These three qualities serve as the guiding compass for us as Kiên-level students to cultivate ourselves, preparing a ready heart and mind as we stand at the threshold of becoming a Huynh trưởng.</p>\n<div class=\"mini-acc\" data-mid=\"iv-1\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">1. Great Compassion (Đại Bi) — Unconditional Love as the Motivation for Engagement</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>The Buddha left the household life out of love for sentient beings still enduring great suffering. After his awakening, he did not keep that peace for himself alone, but traveled widely to teach the Dharma, helping people understand the causes of suffering and opening for them a path of practice and transformation.</p>\n<blockquote>\n<strong>A lesson for Kiên-level students:</strong> Compassion begins with very ordinary things close at hand: knowing how to listen, to empathize, to be patient, and to be willing to help others. We can look after the younger children in the Gia Đình Phật Tử (GĐPT), share and help our friends, and love the members of our own family. By nurturing love each day, we gain more motivation to keep learning, to overcome difficulties, and to grow, step by step, into a Huynh trưởng capable of tolerance, protection, and guidance for the younger members (đàn em).\n</blockquote></div></div></div>\n<div class=\"mini-acc\" data-mid=\"iv-2\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">2. Great Wisdom (Đại Trí) — The Clarity That Shatters the Veil of Ignorance</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>Love without wisdom easily leads to actions driven by emotion and error. Beneath the Bodhi tree, the Buddha fully penetrated the laws governing existence — impermanence, dependent origination, and karma. Through his Great Wisdom, he perceived each person’s capacity and disposition clearly enough to teach according to circumstance, using the Dharma as “a raft for crossing the river” so that sentient beings could discover the truth for themselves.</p>\n<p><strong>A lesson for Kiên-level students:</strong> On the path of studying at the Kiên level, wisdom means applying the path of “Listening – Reflecting – Practicing” (Văn – Tư – Tu) to real life. We listen to the Dharma and study the Kiên curriculum not only to broaden our knowledge of the teaching, but also to reflect on it and weigh it against our own lives, thereby working through the joys, sorrows, and entanglements of youth (Right Thought). With Right View — a correct understanding of ourselves and of the Path — we gain a bright torch to light our own way today, and become steady enough to one day light the way for the younger members who follow.</p></div></div></div>\n<div class=\"mini-acc\" data-mid=\"iv-3\"><button class=\"mini-head\" onclick=\"toggleMini(this)\"><span class=\"mini-title\">3. Great Courage (Đại Dũng) — An Unmatched Inner Strength to Overcome Oneself</span><svg class=\"mini-chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button><div class=\"mini-body\"><div class=\"mini-body-inner\"><p>The Buddha’s Great Courage was not the strength of violence, but an extraordinary inner power that let him renounce the highest wealth and glory to put on a monastic robe. It was the strength to conquer the army of Māra (ma quân) — symbolizing the afflictions and cravings within the mind — while facing every hardship with composure. With a fearless heart (vô úy), he boldly shattered the harsh caste prejudices of the society of his time.</p>\n<p><strong>A lesson for Kiên-level students:</strong> Becoming a Huynh trưởng means accepting a step out of the safe, carefree, sheltered world of an ordinary Đoàn sinh. Courage, for a Kiên-level student, is the bravery to recognize and correct one’s own shortcomings (Right Effort); it is the persistence to keep following the Kiên curriculum despite the demands of school or the pressures of work and life outside; and it is the quiet fortitude to nurture an ideal of service, building steady shoulders ready to carry responsibility tomorrow.</p></div></div></div>"}, "summary": {"vi": "<ul><li>Đức Phật là con người lịch sử tự thân đạt giác ngộ, là bậc Thầy dẫn đường và tấm gương sáng cho học viên Bậc Kiên.</li><li>Ngài là hiện thân của ba đức tính: Đại Bi (tình thương vô điều kiện làm động lực dấn thân), Đại Trí (sự sáng suốt phá vỡ màn vô minh), Đại Dũng (sức mạnh nội tâm để vượt qua chính mình).</li><li>Mỗi đức tính có một bài học riêng cho học viên Bậc Kiên trên đường trở thành Huynh trưởng.</li></ul>", "en": "<ul><li>The Buddha was a historical human being who attained awakening through his own effort, and is both guiding teacher and shining example for Kiên-level students.</li><li>He embodies three qualities: Great Compassion (unconditional love as the motivation for engagement), Great Wisdom (the clarity that shatters the veil of ignorance), and Great Courage (an unmatched inner strength to overcome oneself).</li><li>Each comes with a lesson for Kiên-level students on the way to becoming a Huynh trưởng.</li></ul>"}}, {"id": "v-ket-luan", "title": {"vi": "KẾT LUẬN", "en": "CONCLUSION"}, "html": {"vi": "<p>Bi là động lực, TRÍ là phương hướng, DŨNG là nghị lực. Hành trình từ một Đoàn sinh ngành Thanh bước lên vai trò Huynh trưởng là một quá trình trưởng thành đầy ý nghĩa. Noi theo tấm gương Bi - Trí - Dũng của Đức Thế Tôn, hiểu rõ mục đích, đại cương của Phật pháp, chúng ta sẽ tìm thấy nguồn năng lượng ấm áp để bước những bước đi đầu tiên thật vững chãi. Lý tưởng cao đẹp đang chờ đón chúng ta phía trước, bắt đầu từ chính sự chuyển hóa tự thân ngay trong những ngày tu học Bậc Kiên này.</p>", "en": "<p>Compassion is the motivation, Wisdom is the direction, and Courage is the driving strength. The journey from a Đoàn sinh in the Thanh branch to the role of Huynh trưởng is a deeply meaningful process of growth. By following the example of Compassion – Wisdom – Courage set by the Buddha (Đức Thế Tôn), and by clearly understanding the purpose and overview of the Dharma, we will find the warm wellspring of energy to take our first, steady steps forward. A noble ideal awaits us ahead, and it begins with our own inner transformation, right here in these days of study at the Kiên level.</p>"}, "summary": {"vi": "<ul><li>Bi là động lực, Trí là phương hướng, Dũng là nghị lực.</li><li>Noi theo tấm gương Bi – Trí – Dũng và hiểu rõ mục đích, đại cương của Phật pháp, học viên sẽ tìm thấy nguồn năng lượng để bước những bước đầu tiên thật vững chãi.</li><li>Hành trình từ Đoàn sinh lên Huynh trưởng bắt đầu từ chính sự chuyển hóa tự thân.</li></ul>", "en": "<ul><li>Compassion is the motivation, Wisdom is the direction, and Courage is the driving strength.</li><li>By following the example of Compassion – Wisdom – Courage and clearly understanding the purpose and overview of the Dharma, students will find the energy to take their first steady steps.</li><li>The journey from Đoàn sinh to Huynh trưởng begins with their own inner transformation.</li></ul>"}}, {"id": "nguon", "title": {"vi": "Nguồn", "en": "Source"}, "html": {"vi": "<ul>\n<li><p>Mục Đích và Đại cương Phật pháp – Bậc Kiên 4 – 2022</p></li>\n<li><p>Giới thiệu về Tạng Luật - Tỳ khưu Indacanda<br />\n<a href=\"https://thuvienhoasen.org/a9789/gioi-thieu-ve-tang-luat\" target=\"_blank\" rel=\"noopener\">https://thuvienhoasen.org/a9789/gioi-thieu-ve-tang-luat</a></p></li>\n</ul>", "en": "<ul>\n<li><p>Mục Đích và Đại cương Phật pháp [The Purpose and Overview of the Dharma] — Bậc Kiên 4, 2022</p></li>\n<li><p>Giới thiệu về Tạng Luật [Introduction to the Vinaya Piṭaka] — Bhikkhu Indacanda<br />\n<a href=\"https://thuvienhoasen.org/a9789/gioi-thieu-ve-tang-luat\" target=\"_blank\" rel=\"noopener\">https://thuvienhoasen.org/a9789/gioi-thieu-ve-tang-luat</a></p></li>\n</ul>"}}], "footnotes": {"vi": {}, "en": {}}, "flashcards": [{"front": {"vi": "Chân thường", "en": "True Permanence (Chân thường)"}, "back": {"vi": "Thường hằng, không bị biến đổi bởi sinh diệt.", "en": "The unchanging, not subject to arising and ceasing."}}, {"front": {"vi": "Chân lạc", "en": "True Bliss (Chân lạc)"}, "back": {"vi": "Niềm an lạc chân thật khi tham ái, sân hận và si mê đã được đoạn trừ.", "en": "The genuine peace and joy that arises once craving, aversion, and delusion have been uprooted."}}, {"front": {"vi": "Chân ngã", "en": "True Self (Chân ngã)"}, "back": {"vi": "Chỉ sự tự tại của Niết-bàn, không nên hiểu là một bản ngã thường còn.", "en": "Referring to the sovereign freedom of Nirvana (Niết-bàn), not to be understood as a permanent ego."}}, {"front": {"vi": "Chân tịnh", "en": "True Purity (Chân tịnh)"}, "back": {"vi": "Chỉ sự thanh tịnh, trong sáng khi các phiền não đã được chuyển hóa và diệt trừ.", "en": "The clarity and purity that come once afflictions have been transformed and eliminated."}}, {"front": {"vi": "Pháp môn", "en": "Dharma door (pháp môn)"}, "back": {"vi": "Nghĩa là “cánh cửa pháp”: một phương pháp tu tập dẫn đến giác ngộ và giải thoát. Mỗi người có căn cơ khác nhau nên Đức Phật dạy nhiều pháp môn; “84.000 pháp môn” là con số biểu trưng cho sự phong phú ấy.", "en": "It means “door of the Dharma”: a method of practice that leads to awakening and liberation. Because people differ in capacity and disposition, the Buddha taught many Dharma doors; “84,000 Dharma doors” is a symbolic figure for that richness."}}, {"front": {"vi": "Kinh", "en": "Sutra (Kinh)"}, "back": {"vi": "Lời Phật dạy về giáo lý và pháp tu.", "en": "The Buddha's own words on doctrine and practice."}}, {"front": {"vi": "Luật", "en": "Vinaya (Luật)"}, "back": {"vi": "Những giới luật và quy tắc sinh hoạt do Đức Phật chế ra để giữ đời sống thanh tịnh và hòa hợp. Luật chủ yếu dành cho người xuất gia.", "en": "The precepts and rules of conduct established by the Buddha to preserve a pure and harmonious communal life. The Vinaya applies chiefly to monastics."}}, {"front": {"vi": "Luận", "en": "Treatises (Luận)"}, "back": {"vi": "Những lời giải thích, bàn luận của các vị đệ tử và tổ sư để làm rõ ý nghĩa sâu xa của Kinh và Luật.", "en": "Explanations and discussions by disciples and patriarchs that clarify the deeper meaning of the Sutras and the Vinaya."}}, {"front": {"vi": "Bắc tông", "en": "Northern tradition (Bắc tông)"}, "back": {"vi": "Chỉ truyền thống Đại thừa, phát triển ở Đông Á.", "en": "Refers to the Mahāyāna tradition, which developed in East Asia."}}, {"front": {"vi": "Nam tông", "en": "Southern tradition (Nam tông)"}, "back": {"vi": "Chỉ truyền thống Phật giáo Theravāda (Thượng tọa bộ), được truyền bá tại Nam Á và Đông Nam Á.", "en": "Refers to the Theravāda tradition of Buddhism (Thượng tọa bộ), which spread throughout South and Southeast Asia."}}, {"front": {"vi": "Bát chánh đạo", "en": "Noble Eightfold Path (Bát chánh đạo)"}, "back": {"vi": "Gồm 8 phần, là 8 nhánh của con đường dẫn đến giải thoát an vui bằng chính nỗ lực tu tập của mỗi người.", "en": "Eight parts – the eight branches of the path leading to liberation and well-being through each person's own effort in practice."}}, {"front": {"vi": "Nhóm Tuệ", "en": "Wisdom group (Tuệ)"}, "back": {"vi": "Chánh kiến – hiểu biết đúng đắn; Chánh tư duy – suy nghĩ đúng đắn.", "en": "Right View (Chánh kiến) – correct understanding; Right Thought (Chánh tư duy) – correct thinking."}}, {"front": {"vi": "Nhóm Giới", "en": "Ethical Conduct group (Giới)"}, "back": {"vi": "Chánh ngữ – lời nói đúng đắn; Chánh nghiệp – hành động đúng đắn; Chánh mạng – nghề nghiệp đúng đắn.", "en": "Right Speech (Chánh ngữ) – correct speech; Right Action (Chánh nghiệp) – correct conduct; Right Livelihood (Chánh mạng) – correct occupation."}}, {"front": {"vi": "Nhóm Định", "en": "Concentration group (Định)"}, "back": {"vi": "Chánh tinh tấn – cố gắng đúng đắn; Chánh niệm – nhớ nghĩ, chú tâm đúng đắn; Chánh định – tập trung đúng đắn.", "en": "Right Effort (Chánh tinh tấn) – correct effort; Right Mindfulness (Chánh niệm) – correct recollection and attention; Right Concentration (Chánh định) – correct focus."}}, {"front": {"vi": "Vô thường và duyên khởi", "en": "Impermanence (Vô thường) and Dependent Origination (Duyên khởi)"}, "back": {"vi": "Mọi sự vật đều do nhiều yếu tố liên kết mà thành, không tự nhiên mà có và cũng không do ai sinh ra. Sự thay đổi của một yếu tố sẽ làm thay đổi sự vật.", "en": "All things arise through the coming together of many interdependent factors; nothing exists spontaneously, and nothing is created by any single agent. A change in one factor brings about a change in the thing itself."}}, {"front": {"vi": "Luân hồi và nghiệp quả", "en": "Cycle of Birth and Death (Luân hồi) and Karma (Nghiệp quả)"}, "back": {"vi": "Theo giáo lý luân hồi, cái chết không phải là chấm hết mà là sự tiếp nối của một đời sống khác. Mọi hành động có chủ ý (nghiệp) đều tạo điều kiện cho quả tương ứng; tiến trình nghiệp và quả tiếp nối không ngừng.", "en": "According to the teaching of the cycle of birth and death, death is not an ending but a continuation into another life. Every intentional action creates the conditions for its corresponding result; this process of action and result continues without pause."}}, {"front": {"vi": "Văn", "en": "Listening (Văn)"}, "back": {"vi": "Học hỏi bằng cách nghe giảng giáo lý, đọc tụng kinh điển, pháp đàm với thái độ cởi mở, phải thao thức, muốn hiểu, muốn thực hành.", "en": "Learning by hearing teachings explained, reading and reciting scripture, and engaging in Dharma discussion with an open mind – approaching it with genuine eagerness, a wish to understand, and a wish to practice."}}, {"front": {"vi": "Tư", "en": "Reflecting (Tư)"}, "back": {"vi": "Suy ngẫm, tư duy, quán chiếu những điều mình nghe, đối chiếu với những kinh nghiệm mình trải qua trong cuộc sống để hiểu sâu hơn.", "en": "Contemplating, thinking through, and examining what one has heard, comparing it against one's own life experience in order to understand it more deeply."}}, {"front": {"vi": "Tu", "en": "Practicing (Tu)"}, "back": {"vi": "Thực hành, vận dụng những điều mình đã nghe, đã tư duy áp dụng vào chính đời sống để chuyển hóa khổ đau. Đó cũng chính là thực hành “Giới – Định – Tuệ” trong đời sống hằng ngày.", "en": "Putting into action, in one's own life, what one has heard and reflected on, in order to transform suffering. This is precisely the practice of “Ethical Conduct – Concentration – Wisdom” (Giới – Định – Tuệ) in daily life."}}, {"front": {"vi": "Đại Bi", "en": "Great Compassion (Đại Bi)"}, "back": {"vi": "Tình thương vô điều kiện, là động lực để dấn thân. Đức Phật không giữ sự an lạc cho riêng mình mà đi truyền dạy Chánh pháp cho mọi người.", "en": "Unconditional love as the motivation for engagement. The Buddha did not keep his peace for himself alone, but traveled to teach the Dharma to others."}}, {"front": {"vi": "Đại Trí", "en": "Great Wisdom (Đại Trí)"}, "back": {"vi": "Sự sáng suốt phá vỡ màn vô minh. Nhờ Đại Trí, Đức Phật thấu rõ các quy luật vận hành của đời sống (vô thường, duyên khởi, nghiệp quả) và căn cơ của từng người để dạy cho phù hợp.", "en": "The clarity that shatters the veil of ignorance. Through Great Wisdom, the Buddha understood the laws governing existence (impermanence, dependent origination, karma) and each person's capacity, so he could teach accordingly."}}, {"front": {"vi": "Đại Dũng", "en": "Great Courage (Đại Dũng)"}, "back": {"vi": "Sức mạnh nội tâm để vượt qua chính mình, không phải sức mạnh bạo lực. Là sức mạnh chiến thắng ma quân – tức phiền não và tham ái trong tâm – và bình thản đối mặt với mọi chông gai.", "en": "An inner strength to overcome oneself, not the strength of violence. It is the strength to conquer the army of Māra – the afflictions and cravings within the mind – and to face every hardship with composure."}}], "quiz": [{"q": {"vi": "Theo tài liệu, Giáo pháp của Đức Phật là gì?", "en": "According to the document, what is the Buddha's Dharma?"}, "options": {"vi": ["Một học thuyết để tin suông", "Con đường thực hành và tự chứng nghiệm", "Một hệ thống học thuyết khô cứng", "Một nghi lễ để cầu nguyện thần linh"], "en": ["A doctrine to be believed blindly", "A path of practice and direct, personal realization", "A rigid system of doctrine", "A ritual of prayer to the gods"]}, "correct": 1, "explain": {"vi": "Mục I: “không phải là một học thuyết để tin suông mà là con đường thực hành và tự chứng nghiệm”.", "en": "Section I: “not a doctrine to be believed blindly, but a path of practice and direct, personal realization”."}, "level": "medium"}, {"q": {"vi": "“Chân ngã” trong tài liệu chỉ điều gì?", "en": "In the document, what does “True Self” (Chân ngã) refer to?"}, "options": {"vi": ["Niềm an lạc khi tham ái, sân hận, si mê đã được đoạn trừ", "Sự thanh tịnh khi phiền não đã được chuyển hóa", "Sự tự tại của Niết-bàn", "Một bản ngã thường còn"], "en": ["The joy that arises once craving, aversion, and delusion have been uprooted", "The purity that comes once afflictions have been transformed", "The sovereign freedom of Nirvana", "A permanent ego"]}, "correct": 2, "explain": {"vi": "Mục I.c: “chỉ sự tự tại của Niết-bàn, không nên hiểu là một bản ngã thường còn”. A là Chân lạc, B là Chân tịnh.", "en": "Section I.c: “referring to the sovereign freedom of Nirvana, not to be understood as a permanent ego”. A is True Bliss, B is True Purity."}, "level": "medium"}, {"q": {"vi": "Hình ảnh “ngón tay chỉ mặt trăng” nhắc người học điều gì?", "en": "What does the image of “a finger pointing at the moon” remind learners?"}, "options": {"vi": ["Nên chấp giữ giáo pháp suốt cả cuộc đời", "Ngôn ngữ có thể truyền đạt trọn vẹn chân lý", "Giáo pháp là gánh nặng cần bỏ ngay từ đầu", "Lời dạy chỉ là phương tiện hướng đến chân lý, không phải chính sự chứng ngộ"], "en": ["To cling to the teaching for a whole lifetime", "That language can fully convey the truth", "That the Dharma is a burden to be dropped from the start", "That teachings are only a means toward the truth, not the realization itself"]}, "correct": 3, "explain": {"vi": "Mục I: “không nên đồng nhất lời dạy với sự chứng ngộ chân lý”.", "en": "Section I: “the teaching should therefore never be mistaken for the realization of truth itself”."}, "level": "medium"}, {"q": {"vi": "Ba tạng kinh điển (Tam tạng) gồm những gì?", "en": "What do the Three Baskets of scripture (Tam tạng) consist of?"}, "options": {"vi": ["Kinh, Giới, Định", "Văn, Tư, Tu", "Kinh, Luật, Luận", "Tuệ, Giới, Định"], "en": ["Sutra, Ethical Conduct, Concentration", "Listening, Reflecting, Practicing", "Sutra, Vinaya, Treatises", "Wisdom, Ethical Conduct, Concentration"]}, "correct": 2, "explain": {"vi": "Mục II: ba tạng là Kinh, Luật, Luận.", "en": "Section II: the Three Baskets are Sutra (Kinh), Vinaya (Luật), Treatises (Luận)."}, "level": "medium"}, {"q": {"vi": "Theo tài liệu, bộ Luật chủ yếu dành cho đối tượng nào?", "en": "According to the document, who is the Vinaya chiefly intended for?"}, "options": {"vi": ["Người xuất gia", "Người tại gia", "Học viên ngành Thanh", "Tất cả mọi người như nhau"], "en": ["Monastics", "Lay practitioners", "Students of the Thanh branch", "Everyone equally"]}, "correct": 0, "explain": {"vi": "Mục II: “Luật chủ yếu dành cho người xuất gia”.", "en": "Section II: “The Vinaya applies chiefly to monastics”."}, "level": "medium"}, {"q": {"vi": "Bát chánh đạo được sắp xếp thành ba nhóm nào?", "en": "Into which three groups is the Noble Eightfold Path organized?"}, "options": {"vi": ["Văn, Tư, Tu", "Bi, Trí, Dũng", "Kinh, Luật, Luận", "Tuệ, Giới, Định"], "en": ["Listening, Reflecting, Practicing", "Compassion, Wisdom, Courage", "Sutra, Vinaya, Treatises", "Wisdom, Ethical Conduct, Concentration"]}, "correct": 3, "explain": {"vi": "Mục II: “được sắp xếp thành ba nhóm: Tuệ, Giới và Định”.", "en": "Section II: “organized into three groups: Wisdom (Tuệ), Ethical Conduct (Giới), and Concentration (Định)”."}, "level": "medium"}, {"q": {"vi": "Trong bảng Bát chánh đạo, “Chánh niệm” được mô tả là gì?", "en": "In the document's table of the Noble Eightfold Path, how is “Right Mindfulness” (Chánh niệm) described?"}, "options": {"vi": ["Lời nói đúng đắn", "Nhớ nghĩ, chú tâm đúng đắn", "Cố gắng đúng đắn", "Tập trung đúng đắn"], "en": ["Correct speech", "Correct recollection and attention", "Correct effort", "Correct focus"]}, "correct": 1, "explain": {"vi": "Mục II, bảng nhóm Định: “Chánh niệm – nhớ nghĩ, chú tâm đúng đắn”.", "en": "Section II, Concentration row: “Right Mindfulness (Chánh niệm) – correct recollection and attention”."}, "level": "medium"}, {"q": {"vi": "Theo quy luật vô thường và duyên khởi, mọi sự vật hình thành như thế nào?", "en": "According to the law of impermanence and dependent origination, how do all things come to be?"}, "options": {"vi": ["Do nhiều yếu tố liên kết mà thành", "Tự nhiên mà có, không cần điều kiện nào", "Do một đấng nào đó sinh ra", "Giữ nguyên mãi mà không thay đổi"], "en": ["Through the coming together of many interdependent factors", "Spontaneously, with no conditions needed", "Created by some single agent", "They remain forever unchanged"]}, "correct": 0, "explain": {"vi": "Mục II.a: “do nhiều yếu tố liên kết mà thành, không tự nhiên mà có và cũng không do ai sinh ra”.", "en": "Section II.a: “all things arise through the coming together of many interdependent factors; nothing exists spontaneously, and nothing is created by any single agent”."}, "level": "medium"}, {"q": {"vi": "“Tu” trong lộ trình Văn – Tư – Tu có nghĩa là gì?", "en": "What does “Practicing” (Tu) mean in the path of Listening – Reflecting – Practicing?"}, "options": {"vi": ["Nghe giảng, đọc tụng kinh điển, pháp đàm", "Suy ngẫm, đối chiếu với kinh nghiệm sống", "Thực hành, vận dụng điều đã nghe và đã tư duy vào đời sống", "Ghi nhớ thật kỹ lời dạy trong kinh điển"], "en": ["Hearing teachings and reciting scripture", "Contemplating and comparing teachings with life experience", "Putting into action in one's own life what one has heard and reflected on", "Carefully memorizing the teachings in the scriptures"]}, "correct": 2, "explain": {"vi": "Mục III: “Tu là thực hành, vận dụng những điều mình đã nghe, đã tư duy áp dụng vào chính đời sống”. A là Văn, B là Tư.", "en": "Section III: “putting into action, in one's own life, what one has heard and reflected on, in order to transform suffering”. A is Listening, B is Reflecting."}, "level": "medium"}, {"q": {"vi": "Theo tài liệu, người tại gia có giới căn bản nào để thực hành, và những giới ấy được ghi ở đâu?", "en": "According to the document, which foundational precepts do lay practitioners have, and where are they recorded?"}, "options": {"vi": ["Năm giới, Thập thiện giới, Bát quan trai giới, Bồ Tát Giới tại gia – ghi trong Luật tạng", "Chỉ Năm giới và Thập thiện giới – ghi trong Kinh tạng và Luận tạng", "Năm giới, Thập thiện giới, Bát quan trai giới, Bồ Tát Giới tại gia – ghi trong Kinh tạng và Luận tạng", "Người tại gia không có giới nào, vì Luật chỉ dành cho người xuất gia"], "en": ["Five Precepts, Ten Good Precepts, Eight Precepts, lay Bodhisattva Precepts – recorded in the Vinaya Basket", "Only the Five Precepts and the Ten Good Precepts – recorded in the Sutra Basket and the Treatise Basket", "Five Precepts, Ten Good Precepts, Eight Precepts, lay Bodhisattva Precepts – recorded in the Sutra Basket and the Treatise Basket", "None, since the Vinaya is only for monastics"]}, "correct": 2, "explain": {"vi": "Mục II (Luật): người tại gia “cũng có giới căn bản… như Năm giới, Thập thiện giới, Bát quan trai giới, Bồ Tát Giới tại gia… được ghi trong Kinh tạng và Luận tạng”.", "en": "Section II (Vinaya): lay practitioners “likewise have foundational precepts to observe — such as the Five Precepts, the Ten Good Precepts (Thập thiện giới), the Eight Precepts, and the lay Bodhisattva Precepts — recorded within the Sutra Basket and the Treatise Basket”."}, "level": "advanced"}, {"q": {"vi": "Theo tài liệu, “giữ giới” giúp ích trực tiếp điều gì?", "en": "According to the document, what does keeping the precepts directly help with?"}, "options": {"vi": ["Giúp tâm không buông lung và dễ đạt định", "Giúp nhận ra tầm quan trọng của giới luật", "Tạo điều kiện để trí tuệ tiếp tục phát triển", "Giúp tìm hiểu nguyên nhân của khổ đau"], "en": ["It keeps the mind from running loose and makes concentration easier to  (IV.2).", "en": "Section IV.3: “the bravery to recognize and correct one's own shortcomings (Right Effort)”. Right View and Right Thought are linked to Great Wisdom (IV.2)."}, "level": "advanced"}]}</script>
<script>

    lvMedium:'Mức 1 · Trung bình', lvAdvanced:'Mức 2 · Nâng cao',
    lvMediumDesc:'Kiểm tra kiến thức cốt lõi sau khi đọc.', lvAdvancedDesc:'Vận dụng, phân tích và so sánh các khái niệm.',

  en: {

    continueReadPrefix:'Read', continueReadBtn:'Continue: Flashcards',
