    flashOf:'Card', flashContinue:'Continue: Quiz',
    quizOf:'Question', quizNext:'Next question', quizSubmit:'Submit',
    quizStart:'Start Quiz',
    resultsTitle:'Your Results', resultsScoreOf:'out of',
    congrats:"Congratulations — you've completed the core knowledge before the session begins!",
    reviewTitle:'Review Answers', backToStart:'Back to top',
    fnTag:'Note',
    footnoteHeading:'Footnote',
    stepsTitle:'3-Step Process',
    step1:'Finish Reading', step2:'Finish Flashcards', step3:'Finish Quiz',
    summaryShow:'View summary', summaryHide:'Hide summary', summaryTag:'Quick summary · does not replace the full text',
    summaryReadFull:'Read full text', collapse:'Collapse',
    lvPickTitle:'Choose your quiz level', lvPickSub:'Each attempt shuffles the order of the questions and the answer options.',
    lvMedium:'Level 1 · Intermediate', lvAdvanced:'Level 2 · Advanced',
    lvMediumDesc:'Checks the core knowledge after reading.', lvAdvancedDesc:'Application, analysis and comparison of concepts.',
    lvQuestions:'questions', lvLocked:'Complete Level 1 to unlock', lvDone:'Completed',
    lvStart:'Start', lvRetake:'Retake this level (shuffled)', lvOther:'Choose another level', lvTryAdv:'Take the Level 2 · Advanced challenge',
    lvShuffled:'Questions and answer options have been shuffled',
    levelName_medium:'Intermediate', levelName_advanced:'Advanced',
  }
};

let state = {
  lang:'vi',
  stage:'read', // read | flash | quiz | results
  readSet: new Set(),
  miniOpen: new Set(),
  flashIndex:0,
  flashFlipped:false,
  flashSeen:new Set(),
  summaryOpen: new Set(),
  quizLevel:null,      // 'medium' | 'advanced' | null (picker)
  quizSession:null,    // [{qi, perm}] shuffled order of this attempt
  quizIndex:0,
  quizAnswers:{},      // session position -> DISPLAYED option index
  quizSubmitted:false,
  levelDone:{},        // {medium:true, advanced:true}
};

function t(key){ return STR[state.lang][key]; }
try{ document.title = DATA.meta.title.vi || DATA.meta.title.en || document.title; }catch(e){}

function setLang(l){
  state.lang = l;
  document.getElementById('btnLangVi').classList.toggle('active', l==='vi');
  document.getElementById('btnLangEn').classList.toggle('active', l==='en');
  document.documentElement.lang = l;
  render();
}

/* ---------------- HEADER / PROGRESS ---------------- */
function renderHeader(){
  const notRead = state.stage!=='read';
  document.getElementById('topBackBtn').classList.toggle('show', notRead);
  document.getElementById('topBackLabel').textContent = state.lang==='vi' ? 'Đọc tài liệu' : 'Read document';
  document.querySelectorAll('[data-i18n-label]').forEach(el=>{
    const k = el.getAttribute('data-i18n-label');
    el.textContent = t(k);
  });
  const total = DATA.sections.length;
  const readPct = Math.round((state.readSet.size/total)*100);
  document.getElementById('pbRead').style.width = readPct+'%';
  const flashPct = Math.round((state.flashSeen.size/DATA.flashcards.length)*100);
  document.getElementById('pbFlash').style.width = (state.stage==='read'?0:flashPct)+'%';
  const answered = Object.keys(state.quizAnswers).length;
  const sessLen = state.quizSession ? state.quizSession.length : 0;
  const quizPct = state.quizSubmitted ? 100 : (sessLen ? Math.round((answered/sessLen)*100) : 0);
  document.getElementById('pbQuiz').style.width = ((state.stage==='read'||state.stage==='flash')?0:quizPct)+'%';

  document.querySelectorAll('.progress-step').forEach(el=>{
    const s = el.getAttribute('data-stage');
    el.classList.toggle('current', s===state.stage || (state.stage==='results' && s==='quiz'));
  });
}

/* ---------------- FOOTNOTE MODAL ---------------- */
function openFn(n){
  document.getElementById('fnTag').textContent = t('fnTag')+' '+n;
  document.getElementById('fnBody').textContent = DATA.footnotes[state.lang][n];
  document.getElementById('fnModal').classList.add('show');
}
function closeFn(e){
  document.getElementById('fnModal').classList.remove('show');
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.fn-ref');
  if(btn){ openFn(btn.getAttribute('data-fn')); }
});

/* ---------------- STAGE: READ ---------------- */
function renderRead(){
  const root = document.getElementById('stageRead');
  const lang = state.lang;
  let html = `
    <div class="hero">
      <div style="font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--sage-ink);text-transform:uppercase;margin-bottom:6px;">${(DATA.meta.kicker && DATA.meta.kicker[lang]) || t('heroKicker')}</div>
      <h1>${DATA.meta.title[lang]}</h1>
      <div class="subtitle">${DATA.meta.subtitle[lang]}</div>
    </div>
    <div class="steps-guide">
      <div class="steps-guide-title">${t('stepsTitle')}</div>
      <div class="step-chip s1"><span class="step-num">1</span>${t('step1')}</div>
      <span class="step-arrow">→</span>
      <div class="step-chip s2"><span class="step-num">2</span>${t('step2')}</div>
      <span class="step-arrow">→</span>
      <div class="step-chip s3"><span class="step-num">3</span>${t('step3')}</div>
    </div>
  `;
  DATA.sections.forEach((sec, i)=>{
    const accent = ACCENTS[i % ACCENTS.length];
    const isOpen = sec._open;
    const isRead = state.readSet.has(sec.id);
    const hasSum = !!(sec.summary && sec.summary[lang]);
    const sumOpen = hasSum && state.summaryOpen.has(sec.id);
    const summaryHtml = hasSum ? `
        <div class="summary-bar"><button class="summary-btn ${sumOpen?'on':''}" onclick="toggleSummary('${sec.id}')" aria-expanded="${sumOpen}">
          <span aria-hidden="true">💡</span>${sumOpen?t('summaryHide'):t('summaryShow')}
          <svg class="sb-chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></div>
        ${sumOpen?`<div class="summary-panel"><span class="sp-tag">${t('summaryTag')}</span>${sec.summary[lang]}
          <div class="summary-actions">
            ${isOpen?'':`<button onclick="openFull('${sec.id}')">${t('summaryReadFull')}</button>`}
            <button onclick="toggleSummary('${sec.id}')">${t('summaryHide')}</button>
          </div></div>`:''}` : '';
    html += `
      <div class="section-card ${isOpen?'open':''}" style="--accent:var(--${accent});--accent-bg:var(--${accent}-bg);--accent-ink:var(--${accent}-ink);">
        <button class="section-head" onclick="toggleSection('${sec.id}')">
          <span class="num ${isRead?'check':''}">${isRead ? '✓' : (i+1)}</span>
          <span class="htitle">${sec.title[lang]}</span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        ${summaryHtml}
        <div class="section-body">
          <div class="section-body-inner">${sec.html[lang]}${isOpen ? `<button class="collapse-btn" onclick="toggleSection('${sec.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 15l-6-6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>${t('collapse')}</button>` : ''}</div>
        </div>
      </div>
    `;
  });
  root.innerHTML = html;

  // inject timeline into its placeholder (Part 2)
  const tlHost = root.querySelector('#__TIMELINE__');
  if(tlHost){ tlHost.outerHTML = renderTimelineHtml(lang); }

  // apply persisted mini-accordion open states
  root.querySelectorAll('.mini-acc').forEach(el=>{
    if(state.miniOpen.has(el.getAttribute('data-mid'))) el.classList.add('open');
  });
}
function toggleSection(id){
  const sec = DATA.sections.find(s=>s.id===id);
  sec._open = !sec._open;
  if(sec._open){ state.readSet.add(id); }
  renderRead();
  renderContinueBar();
  renderHeader();
}
function toggleSummary(id){
  if(state.summaryOpen.has(id)) state.summaryOpen.delete(id); else state.summaryOpen.add(id);
  renderRead();
}
function openFull(id){
  const sec = DATA.sections.find(s=>s.id===id);
  sec._open = true; state.readSet.add(id);
  state.summaryOpen.delete(id);
  renderRead(); renderContinueBar(); renderHeader();
}
function toggleMini(btn){
  const wrap = btn.closest('.mini-acc');
  const mid = wrap.getAttribute('data-mid');
  if(state.miniOpen.has(mid)) state.miniOpen.delete(mid); else state.miniOpen.add(mid);
  renderRead();
}

/* ---------------- TIMELINE ---------------- */
function renderTimelineHtml(lang){
  const nodes = DATA.timeline.map(pt=>`
    <button class="timeline-node" onclick="openThinker('${pt.anchor}')">
      <span class="tl-line"></span>
      <span class="tl-dot"></span>
      <span class="tl-year">${pt.year}</span>
      <span class="tl-name">${pt.name}</span>
      <span class="tl-idea">${pt.idea[lang]}</span>
    </button>
  `).join('');
  const title = (DATA.meta.timelineTitle && DATA.meta.timelineTitle[lang]) || (lang==='vi' ? 'Dòng thời gian' : 'Timeline');
  return `<div class="timeline-wrap"><div class="timeline-title">${title}</div><div class="timeline-track">${nodes}</div></div>`;
}
function openThinker(anchor){
  const needle = 'id="'+anchor+'"';
  const sec = DATA.sections.find(s=>((s.html.vi||'')+(s.html.en||'')).includes(needle)) || DATA.sections.find(s=>s.id==='part2') || DATA.sections[0];
  sec._open = true;
  state.readSet.add(sec.id);
  renderRead();
  renderHeader();
  renderContinueBar();
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const el = document.getElementById(anchor);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
    }, 60);
  });
}
function goToRead(){
  state.stage = 'read';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- STAGE: FLASHCARDS ---------------- */
function renderFlash(){
  const root = document.getElementById('stageFlash');
  const lang = state.lang;
  const cards = DATA.flashcards;
  const i = state.flashIndex;
  const card = cards[i];
  const accent = ACCENTS[i % ACCENTS.length];
  state.flashSeen.add(i);
  const dots = cards.map((c,idx)=>`<span class="flash-dot ${state.flashSeen.has(idx)?'seen':''} ${idx===i?'current':''}"></span>`).join('');
  root.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-counter">${t('flashOf')} ${i+1} / ${cards.length}</div>
      <div class="flash-scene">
        <div class="flash-card ${state.flashFlipped?'flipped':''}" id="flashCardEl" onclick="flipCard()" style="--accent:var(--${accent});--accent-bg:var(--${accent}-bg);--accent-ink:var(--${accent}-ink);">
          <div class="flash-face front">
            <div class="flash-face-content">
              <div class="kicker">${lang==='vi'?'Thuật ngữ':'Term'}</div>
              <div class="term">${card.front[lang]}</div>
              <div class="tap-hint">${t('flashFrontHint')}</div>
            </div>
          </div>
          <div class="flash-face back">
            <div class="flash-face-content">
              <div class="kicker">${lang==='vi'?'Giải nghĩa':'Meaning'}</div>
              <div class="term-repeat">${card.front[lang]}</div>
              <div class="def">${card.back[lang]}</div>
              <div class="tap-hint">${t('flashBackHint')}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="iconbtn" onclick="flashPrev()" ${i===0?'disabled':''} aria-label="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" onclick="flashNext()" ${i===cards.length-1?'disabled':''} aria-label="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="flash-dot-row">${dots}</div>
    </div>
  `;
  renderHeader();
  renderContinueBar();
}
function flipCard(){
  state.flashFlipped = !state.flashFlipped;
  renderFlash();
  const el = document.getElementById('flashCardEl');
  if(el){
    const cls = state.flashFlipped ? 'flip-to-back' : 'flip-to-front';
    el.classList.add(cls);
    el.addEventListener('animationend', function handler(){
      el.classList.remove('flip-to-back','flip-to-front');
      el.removeEventListener('animationend', handler);
    });
  }
}
function flashPrev(){ if(state.flashIndex>0){ state.flashIndex--; state.flashFlipped=false; renderFlash(); } }
function flashNext(){ if(state.flashIndex<DATA.flashcards.length-1){ state.flashIndex++; state.flashFlipped=false; renderFlash(); } }

/* ---------------- STAGE: QUIZ (v2: 2 levels + shuffle) ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function levelOf(q){ return q.level==='advanced' ? 'advanced' : 'medium'; }
function questionsOfLevel(level){
  const out=[]; DATA.quiz.forEach((q,i)=>{ if(levelOf(q)===level) out.push(i); }); return out;
}
function levelsAvailable(){ return ['medium','advanced'].filter(l=>questionsOfLevel(l).length>0); }
function isLevelLocked(level){
  if(level!=='advanced') return false;
  if(DATA.meta.gateAdvanced===false) return false;
  return questionsOfLevel('medium').length>0 && !state.levelDone.medium;
}
/* Option order is a permutation of INDICES, so it is language-toggle safe:
   VI and EN option arrays must have the same order (same index = same option). */
function makePerm(q){
  const n = (q.options.vi || q.options.en).length;
  const id = Array.from({length:n}, (_,i)=>i);
  return q.lockOptions ? id : shuffle(id);
}
function initQuizSession(level){
  state.quizLevel = level;
  state.quizSession = shuffle(questionsOfLevel(level)).map(qi=>({qi, perm:makePerm(DATA.quiz[qi])}));
  state.quizAnswers = {};
  state.quizIndex = 0;
  state.quizSubmitted = false;
}
function startQuiz(level){
  if(isLevelLocked(level)) return;
  initQuizSession(level);
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function pickAnotherLevel(){
  state.quizLevel = null; state.quizSession = null; state.quizAnswers = {}; state.quizIndex = 0; state.quizSubmitted = false;
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderQuizPicker(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  const cards = levelsAvailable().map(l=>{
    const n = questionsOfLevel(l).length;
    const locked = isLevelLocked(l);
    const done = !!state.levelDone[l];
    const nameKey = l==='medium' ? 'lvMedium' : 'lvAdvanced';
    const descKey = l==='medium' ? 'lvMediumDesc' : 'lvAdvancedDesc';
    return `<button class="level-card lvl-${l}" ${locked?'disabled':''} onclick="startQuiz('${l}')">
      <div class="lv-name">${locked?'🔒':(done?'✅':(l==='medium'?'🌱':'🔥'))} ${t(nameKey)}</div>
      <div class="lv-meta">${n} ${t('lvQuestions')}${done?' · '+t('lvDone'):''}${locked?' · '+t('lvLocked'):''}</div>
      <div class="lv-desc">${t(descKey)}</div>
    </button>`;
  }).join('');
  root.innerHTML = `
    <div class="level-intro">${t('lvPickTitle')}</div>
    <div class="level-sub">${t('lvPickSub')}</div>
    ${cards}
  `;
  renderHeader();
  renderContinueBar();
}
function renderQuiz(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  if(!state.quizSession){
    const lv = levelsAvailable();
    if(lv.length>1){ renderQuizPicker(); return; }
    initQuizSession(lv[0] || 'medium');
  }
  const sess = state.quizSession;
  const i = state.quizIndex;
  const item = sess[i];
  const q = DATA.quiz[item.qi];
  const answered = state.quizAnswers[i];
  const correctShown = item.perm.indexOf(q.correct);
  const dots = sess.map((_,idx)=>`<button class="quiz-dot ${state.quizAnswers[idx]!==undefined?'answered':''} ${idx===i?'current':''}" onclick="goToQuizQuestion(${idx})">${idx+1}</button>`).join('');

  let optionsHtml = '';
  item.perm.forEach((orig, shown)=>{
    let cls = 'quiz-option';
    if(answered!==undefined){
      if(shown===correctShown) cls += ' correct';
      else if(shown===answered) cls += ' wrong';
    }
    optionsHtml += `<button class="${cls}" onclick="answerQuiz(${shown})" ${answered!==undefined?'disabled':''}>${q.options[lang][orig]}</button>`;
  });

  let explainHtml = '';
  if(answered!==undefined){
    explainHtml = `<div class="quiz-explain">${q.explain[lang]}</div>
    <button class="quiz-retry-btn" onclick="retryQuestion(${i})">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V7m0 5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${lang==='vi'?'Trả lời lại câu này':'Answer this again'}
    </button>`;
  }

  const isLast = i === sess.length-1;
  let nextBtn = '';
  if(answered!==undefined){
    nextBtn = `<button class="btn" onclick="${isLast?'submitQuiz()':'quizNext()'}">${isLast? t('quizSubmit') : t('quizNext')}</button>`;
  }
  const lv = levelOf(q);
  root.innerHTML = `
    <div class="quiz-dot-row">${dots}</div>
    <div class="quiz-progress">${t('quizOf')} ${i+1} / ${sess.length}</div>
    <span class="level-chip lvl-${lv}">${t('levelName_'+lv)}</span>
    <div class="quiz-q">${q.q[lang]}</div>
    <div class="quiz-options">${optionsHtml}</div>
    ${explainHtml}
    ${nextBtn}
  `;
  renderHeader();
  renderContinueBar();
}
function answerQuiz(shown){
  state.quizAnswers[state.quizIndex] = shown;
  renderQuiz();
}
function quizNext(){
  if(state.quizIndex < state.quizSession.length-1){ state.quizIndex++; renderQuiz(); }
}
function goToQuizQuestion(idx){
  state.quizIndex = idx;
  renderQuiz();
}
function retryQuestion(idx){
  delete state.quizAnswers[idx];
  const item = state.quizSession[idx];
  item.perm = makePerm(DATA.quiz[item.qi]);   // reshuffle options on a retry
  state.quizIndex = idx;
  renderQuiz();
}
function submitQuiz(){
  state.quizSubmitted = true;
  state.levelDone[state.quizLevel] = true;
  state.stage = 'results';
  renderAll();
  setTimeout(()=>{ fireConfetti(); fireFireworks(); }, 250);
}
function retakeQuiz(){
  initQuizSession(state.quizLevel || levelsAvailable()[0] || 'medium');   // new shuffle every restart
  state.stage = 'quiz';
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  const root = document.getElementById('stageQuiz');
  const lang = state.lang;
  const sess = state.quizSession;
  let correct = 0;
  sess.forEach((it,idx)=>{ const q=DATA.quiz[it.qi]; if(it.perm[state.quizAnswers[idx]]===q.correct) correct++; });

  let reviewHtml = sess.map((it,idx)=>{
    const q = DATA.quiz[it.qi];
    const yourOrig = it.perm[state.quizAnswers[idx]];
    const ok = yourOrig===q.correct;
    return `<div class="review-item">
      <div class="q">${idx+1}. ${q.q[lang]}</div>
      <div class="${ok?'a-correct':'a-wrong'}">${ok?'✓':'✕'} ${q.options[lang][yourOrig]}</div>
      ${!ok?`<div class="a-correct">→ ${q.options[lang][q.correct]}</div>`:''}
    </div>`;
  }).join('');

  const multi = levelsAvailable().length>1;
  const canAdv = multi && state.quizLevel==='medium' && !isLevelLocked('advanced');
  root.innerHTML = `
    <div class="results">
      <span class="big-emoji">🎆</span>
      <h2>${t('resultsTitle')} · ${t('levelName_'+state.quizLevel)}</h2>
      <div class="score">${correct} / ${sess.length}</div>
      <div class="congrats">🎉 ${t('congrats')}</div>
      <div class="results-actions">
        ${canAdv?`<button class="btn lotus" onclick="startQuiz('advanced')">🔥 ${t('lvTryAdv')}</button>`:''}
        <button class="btn retake-btn" onclick="retakeQuiz()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V7m0 5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ${t('lvRetake')}
        </button>
        ${multi?`<button class="btn secondary" onclick="pickAnotherLevel()">${t('lvOther')}</button>`:''}
      </div>
    </div>
    <div class="review-title">${t('reviewTitle')}</div>
    ${reviewHtml}
  `;
  renderHeader();
  renderContinueBar();
}

/* ---------------- CONTINUE BAR ---------------- */
function renderContinueBar(){
  const bar = document.getElementById('continueBar');
  const status = document.getElementById('continueStatus');
  const btn = document.getElementById('continueBtn');
  const lang = state.lang;

  if(state.stage==='read'){
    const total = DATA.sections.length;
    const readCount = state.readSet.size;
    status.textContent = `${t('continueReadPrefix')} ${readCount}/${total}`;
    btn.textContent = t('continueReadBtn');
    btn.disabled = readCount < total;
    btn.onclick = ()=>{ state.stage='flash'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    bar.style.display='block';
  } else if(state.stage==='flash'){
    const total = DATA.flashcards.length;
    const seen = state.flashSeen.size;
    status.textContent = `${lang==='vi'?'Đã xem':'Viewed'} ${seen}/${total}`;
    btn.textContent = t('flashContinue');
    btn.disabled = seen < total;
    btn.onclick = ()=>{ state.stage='quiz'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    bar.style.display='block';
  } else {
    bar.style.display='none';
  }
}

/* ---------------- CONFETTI ---------------- */
function fireConfetti(){
  const colors = ['#8FB988','#E8A3B0','#E7BA53','#93BEDB','#F3C9D0'];
  const count = 90;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    el.style.width = size+'px';
    el.style.height = (size*0.4 + Math.random()*size*0.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 2.6 + Math.random()*1.8;
    const rot = (Math.random()>0.5?1:-1) * (180+Math.random()*360);
    el.style.setProperty('--rot', rot+'deg');
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = (Math.random()*0.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (duration+0.6)*1000);
  }
}
function fireFireworks(){
  const colors = ['#8FB988','#E8A3B0','#E7BA53','#93BEDB','#F3C9D0','#fff'];
  const burstCount = 5;
  for(let b=0;b<burstCount;b++){
    setTimeout(()=>{
      const originX = 12 + Math.random()*76;
      const originY = 12 + Math.random()*28;
      const particles = 26;
      for(let p=0;p<particles;p++){
        const el = document.createElement('div');
        el.className = 'spark';
        const size = 5 + Math.random()*4;
        el.style.width = size+'px';
        el.style.height = size+'px';
        el.style.left = originX+'vw';
        el.style.top = originY+'vh';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        const angle = (Math.PI*2)*(p/particles) + Math.random()*0.25;
        const dist = 55 + Math.random()*75;
        el.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
        el.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
        const dur = 0.75 + Math.random()*0.5;
        el.style.animationDuration = dur+'s';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), dur*1000+120);
      }
    }, b*320);
  }
}

/* ---------------- MASTER RENDER ---------------- */
function renderAll(){
  document.getElementById('stageRead').style.display = state.stage==='read' ? 'block':'none';
  document.getElementById('stageFlash').style.display = state.stage==='flash' ? 'block':'none';
  document.getElementById('stageQuiz').style.display = (state.stage==='quiz'||state.stage==='results') ? 'block':'none';

  if(state.stage==='read') renderRead();
  else if(state.stage==='flash') renderFlash();
  else if(state.stage==='quiz') renderQuiz();
  else if(state.stage==='results') renderResults();

  renderHeader();
  renderContinueBar();
}
function render(){ renderAll(); }

DATA.sections.forEach(s=>{ s._open = false; });
render();
</script>
